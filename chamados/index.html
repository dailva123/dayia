<style>
:root{--navy:#0E2238;--navy2:#16304F;--sky:#8EC5E8;--sun:#F2C230;--bg:#EEF2F7;--ink:#0E2238;--ink2:#4A5B75;--mute:#7B8BA3;--line:#D6DFEA;
--ok:#1F8A5B;--okbg:#E3F4EC;--warn:#B7791F;--warnbg:#FBF0D9;--bad:#C0392B;--badbg:#FBE4E1;--blue:#2B6CB0;--bluebg:#E2EEFA;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
#intro{position:fixed;inset:0;z-index:99;background:var(--navy);display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#intro.fim{opacity:0;pointer-events:none}
.quadro{width:76px;height:76px;background:#fff;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:cresce 1.4s cubic-bezier(.2,.8,.2,1) forwards}
.quadro img{width:100%;height:100%;display:block;border-radius:10px}
@keyframes cresce{0%{transform:scale(.6) rotate(0);opacity:0}20%{opacity:1}55%{transform:scale(1.6) rotate(0)}100%{transform:scale(1.6) rotate(360deg)}}
.by{position:absolute;display:flex;align-items:center;gap:10px;font-size:22px;color:#CFE2F2;opacity:0;transition:opacity .45s}
.by img{height:40px;width:auto;display:block}
#intro.passo2 .quadro{opacity:0;transition:opacity .3s}
#intro.passo2 .by{opacity:1}

header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:18px;font-stretch:112%;font-weight:800}
header .by2{display:flex;align-items:center;gap:6px;color:#B9CCE2;font-size:13px}
header .by2 img{height:20px}
.modos{margin-left:auto;display:flex;gap:4px;background:var(--navy2);padding:4px;border-radius:12px;flex-wrap:wrap}
.modos button{background:transparent;border:0;color:#B9CCE2;font-weight:700;font-size:13px;padding:7px 12px;border-radius:9px;cursor:pointer}
.modos button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.dica{background:var(--warnbg);color:#7A5410;font-size:13.5px;padding:8px 16px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.dica a{color:#7A5410;font-weight:700}
.dica button{background:#fff;border:1px solid #E6CF9A;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:#7A5410}

.palco{display:grid;grid-template-columns:1fr 1.25fr;gap:0;min-height:calc(100vh - 100px)}
.palco.so-cli{grid-template-columns:1fr}
.palco.so-tec{grid-template-columns:1fr}
.lado{min-width:0;display:flex;flex-direction:column}
.lado+.lado{border-left:4px solid var(--navy)}
.rot{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;display:flex;align-items:center;gap:8px}
.rot.cli{background:#DCEBF7;color:#1C4A75}
.rot.tec{background:#0B1A2C;color:#F2C230}
.cont{padding:16px;overflow:auto;flex:1}
.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:16px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:19px;font-stretch:110%}
.card h3{margin:0 0 8px;font-size:15px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink2)}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:400;color:var(--ink);background:#fff;min-width:0}
label.f textarea{min-height:70px;resize:vertical}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink2)}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.pri{background:var(--navy);color:#fff}.sol{background:var(--sun);color:var(--navy)}.sec{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.okb{background:var(--ok);color:#fff}.badb{background:#fff;border:1.5px solid #E8B4AE;color:var(--bad)}
.min{padding:6px 10px;font-size:13px}
.tag{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-bad{background:var(--badbg);color:var(--bad)}.t-blue{background:var(--bluebg);color:var(--blue)}.t-mute{background:#EEF2F7;color:var(--ink2)}
.meus .it{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff;width:100%;text-align:left}
.meus .it:hover{background:#F7FAFD}
.meus .it b{display:block}
.meus .it small{color:var(--mute)}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{max-width:85%;border-radius:14px;padding:8px 12px;font-size:14px}
.msg small{display:block;font-size:11.5px;opacity:.7;margin-top:2px}
.msg.eu{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.ele{align-self:flex-start;background:#EEF2F7;border-bottom-left-radius:4px}
.msg.sis{align-self:center;background:transparent;color:var(--mute);font-size:12.5px;text-align:center;padding:2px}
.pedido{background:var(--warnbg);border:1.5px solid #E6CF9A;border-radius:12px;padding:12px;margin:10px 0}
.pedido b{display:block;margin-bottom:6px}
.ligado{background:#0B1A2C;color:#F2C230;border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:700;display:flex;gap:8px;align-items:center}
.ligado i{width:10px;height:10px;border-radius:50%;background:#2ECC71;display:inline-block;animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.3}}
.resp{display:flex;gap:8px;margin-top:6px}
.resp input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.estr button{background:none;border:0;font-size:26px;cursor:pointer;color:#C9D3E0;padding:0 2px}
.estr button.on{color:var(--sun)}

/* técnico */
.tecgrid{display:grid;grid-template-columns:300px 1fr;gap:12px;align-items:start}
.fila .it{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border-left:5px solid var(--line)}
.fila .it.sel{outline:2px solid var(--navy)}
.fila .it.novo{border-left-color:var(--sun);animation:chega 1.2s ease 2}
@keyframes chega{30%{background:#FFF6D6}}
.fila .it b{display:block;font-size:14px}
.fila .it small{color:var(--mute);font-size:12px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kp b{display:block;font-size:22px;line-height:1.1}
.kp span{font-size:12px;color:var(--mute)}
.dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:10px 0}
.dados div{background:#F7FAFD;border-radius:10px;padding:8px 10px;font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.dados span{display:block;font-size:11.5px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.dados a{color:var(--blue);font-weight:700}
.acoesT{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.vazio{color:var(--mute);text-align:center;padding:30px 10px}

/* aviso de novo chamado */
.aviso{position:fixed;right:18px;bottom:18px;z-index:60;width:min(360px,92vw);background:#0B1A2C;color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.35);border:2px solid var(--sun);animation:entra .35s ease}
@keyframes entra{from{transform:translateY(30px);opacity:0}}
.aviso b{color:var(--sun);display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.aviso p{margin:4px 0 10px;font-size:15px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:70}

@media (max-width:980px){
  .palco{grid-template-columns:1fr}
  .lado+.lado{border-left:0;border-top:4px solid var(--navy)}
  .tecgrid{grid-template-columns:1fr}
  .rcorpo{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .ferr{max-height:40vh}
}
@media (max-width:560px){.g2{grid-template-columns:1fr}.kp{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion: reduce){.quadro{animation:none}*{transition:none!important;animation:none!important}}

.hdir{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.quem{color:#CFE2F2;font-weight:700;font-size:14px}
.faixa-erro{background:var(--badbg);color:var(--bad);padding:8px 16px;font-weight:700;font-size:14px}
main{max-width:1280px;margin:0 auto;padding:16px}
.rodape{text-align:center;padding:10px 16px 28px;font-size:13px}
.rodape a{color:var(--ink2)}
.caixa{max-width:460px;margin:30px auto}
.caixa input{width:100%}
.okbox{background:var(--okbg);border:1.5px solid #A9DCC3;border-radius:12px;padding:12px;margin-top:12px}
.okbox input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px;font-size:13px;background:#fff}
.erro{color:var(--bad);font-weight:700}
.cligrid{max-width:760px;margin:0 auto}
.kp4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.kp4 div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.kp4 b{display:block;font-size:24px;line-height:1.1}
.kp4 span{font-size:12.5px;color:var(--mute)}
.vermelho{color:var(--bad)!important}
.abasT{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.abasT button{flex:none;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink2)}
.abasT button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.abasT .cont{background:var(--sun);color:var(--navy);border-radius:999px;padding:0 7px;font-size:12px;margin-left:2px}
.tecgrid{grid-template-columns:360px 1fr}
.filtros{display:flex;gap:6px;margin-bottom:8px}
.filtros input,.filtros select{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.fila{max-height:calc(100vh - 250px);overflow:auto;padding-right:2px}
.topoDet{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.topoDet h2,.topoDet h3{margin:0}
.dados select{border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;max-width:100%}
.dados .full{grid-column:1/-1}
select.btn{padding:8px 10px}
.rapidas{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.rapidas .btn{white-space:normal;text-align:left;font-weight:600}
.msg.int{align-self:stretch;max-width:100%;background:#FFF8E1;border:1px dashed #E6CF9A;color:#5E4510}
.msg.int b{display:block;font-size:12px;margin-bottom:2px}
.hist{margin-top:14px}
.hist summary{font-weight:800;cursor:pointer;margin-bottom:6px}
ul.hist,.hist ul{list-style:none;margin:0;padding:0;font-size:13.5px}
ul.hist li,.hist li{padding:6px 0;border-bottom:1px solid #EEF2F7}
.hist time{color:var(--mute);font-size:12.5px;margin-right:4px;white-space:nowrap}
.hist span{color:var(--ink2)}
.tabela{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1.5px solid var(--line)}
td{padding:8px;border-bottom:1px solid #EEF2F7;vertical-align:top}
.lk{background:none;border:0;color:var(--blue);font-weight:700;cursor:pointer;padding:0;font-size:13px}
td .mini{margin-top:4px;display:flex;gap:4px 10px;flex-wrap:wrap}
.aval{margin-top:14px;background:#F7FAFD;border-radius:12px;padding:12px}
#hFiltro{border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
@media (max-width:980px){.tecgrid{grid-template-columns:1fr}.fila{max-height:none}}
.tecgrid>div{min-width:0}
@media (max-width:560px){.dados{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.kp4{grid-template-columns:repeat(2,1fr)}main{padding:12px}header h1{font-size:16px}}
</style>
</head>

<script>
/* ===== instalar no celular + avisos (DayIA) ===== */
var SWR=null;
function fazManifesto(){
  try{
    var pasta=location.origin+location.pathname.replace(/[^\/]*$/,""),ini=location.href;
    var nome=String(nomeApp()||"").slice(0,45),curto=(nome.length>12?nome.split(" · ")[0].slice(0,12):nome).trim();
    var m={name:nome,short_name:curto,id:ini,start_url:ini,scope:pasta,display:"standalone",orientation:"portrait",background_color:"#0E2238",theme_color:"#0E2238",lang:"pt-BR",
      icons:[{src:pasta+"icon-192.png",sizes:"192x192",type:"image/png",purpose:"any"},{src:pasta+"icon-512.png",sizes:"512x512",type:"image/png",purpose:"any"},{src:pasta+"icon-512.png",sizes:"512x512",type:"image/png",purpose:"maskable"}]};
    var l=document.querySelector('link[rel="manifest"]');if(!l){l=document.createElement("link");l.rel="manifest";document.head.appendChild(l)}
    if(l.dataset.u)URL.revokeObjectURL(l.dataset.u);
    l.href=l.dataset.u=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));
  }catch(e){}
}
fazManifesto();window.addEventListener("hashchange",fazManifesto);setTimeout(fazManifesto,4000);setTimeout(fazManifesto,12000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(function(r){SWR=r}).catch(function(){});
function notificar(titulo,corpo,tag,aoClicar){
  try{
    if(!window.Notification||Notification.permission!=="granted")return;if(PUSH.sub&&ls("push-srv"))return;
    var o={body:corpo,tag:tag,icon:"icon-192.png",badge:"icon-192.png",renotify:true,vibrate:[200,100,200]};
    try{var n=new Notification(titulo,o);n.onclick=function(){window.focus();n.close();if(aoClicar)aoClicar()};return}catch(e){}
    var go=function(r){if(r)r.showNotification(titulo,o)};
    if(SWR)go(SWR);else if(navigator.serviceWorker)navigator.serviceWorker.ready.then(go);
  }catch(e){}
}
function vibrar(){try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
function bannerCli(txt,aoVer){
  var old=document.getElementById("avCli");if(old)old.remove();
  var d=document.createElement("div");d.id="avCli";d.setAttribute("role","alert");
  d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:9999;background:#0E2238;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;max-width:calc(100% - 24px);width:420px;font-weight:700";
  d.innerHTML='<span style="flex:1">'+esc(txt)+'</span><button style="background:#7FD3FC;color:#0E2238;border:0;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer">Ver</button><button aria-label="Fechar" style="background:none;border:0;color:#fff;font-size:20px;cursor:pointer">×</button>';
  var bs=d.querySelectorAll("button");bs[0].onclick=function(){d.remove();if(aoVer)aoVer()};bs[1].onclick=function(){d.remove()};
  document.body.appendChild(d);setTimeout(function(){if(d.parentNode)d.remove()},20000);
}
function botaoAvisos(onde,txt){
  try{
    if(!onde||!window.Notification||Notification.permission!=="default"||onde.querySelector(".bAvCli"))return;
    var b=document.createElement("button");b.type="button";b.className="btn sec min bAvCli";b.style.marginTop="12px";b.textContent=txt||"🔔 Me avise por notificação";
    b.onclick=function(){pedirPermissao().then(function(p){b.remove();if(p==="granted")toast("Pronto! Você vai ser avisado aqui.")})};
    onde.appendChild(b);
  }catch(e){}
}

var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function hora(t){return new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function dh(t){return t?new Date(t).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+hora(t):""}
function dur(ms){var m=Math.round(Math.abs(ms)/6e4);if(m<60)return m+" min";var h=Math.round(m/60);return h<48?h+" h":Math.round(h/24)+" dias"}
function fmtMin(m){m=Number(m)||0;var h=Math.floor(m/60),r=m%60;return h?h+" h"+(r?" "+r+" min":""):r+" min"}
function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x?JSON.parse(x):null}if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function toast(m){$$(".toast").forEach(function(o){o.remove()});var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3000)}
var CATS=["Computador ou notebook","Impressora","Internet e rede","E-mail","Sistema ou programa","Acesso e senha","Telefonia","Servidor","Outro"];
var IMPACTO=[["Baixa","Dá para esperar"],["Média","Atrapalha um pouco"],["Alta","Atrapalha muito o setor"],["Urgente","A empresa está parada"]];
var STATUS=["Aberto","Em atendimento","Aguardando cliente","Resolvido"];

/* ---------- servidor ---------- */
var Q=new URLSearchParams(location.search);
if(Q.get("s"))ls("cs-s",Q.get("s"));
if(Q.get("api"))ls("cs-api",Q.get("api"));
var SID_FIXO="AKfycbyl7cQh_oEVXLZSGBESLuVPrbGkPo690p1nATUAjWgvDELJvqyfW4-PjgUtdRPgC4Iw";
var SID=SID_FIXO||Q.get("s")||ls("cs-s")||"";
var API=Q.get("api")||(SID_FIXO?"":ls("cs-api"))||(SID?"https://script.google.com/macros/s/"+SID+"/exec":"");
function base(){var u=location.origin+location.pathname;if(SID_FIXO&&!Q.get("api"))return u;return SID&&!Q.get("api")?u+"?s="+SID:(Q.get("api")?u+"?api="+encodeURIComponent(API):u)}
function api(acao,dados){
  var corpo=Object.assign({acao:acao},dados||{});
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(corpo),redirect:"follow"})
    .then(function(r){return r.json()})
    .then(function(j){$("#offline").hidden=true;if(j&&j.erro){var e=new Error(j.erro);e.servidor=true;throw e}return j},
      function(e){if(!e.servidor)$("#offline").hidden=false;throw e});
}
var EMPRESA=ls("cs-empresa")||"";
function setEmpresa(n){if(!n)return;EMPRESA=n;ls("cs-empresa",n);$("#hEmpresa").textContent=n;document.title=n+" · Atende Fácil"}
if(EMPRESA)setEmpresa(EMPRESA);

/* ---------- roteamento ---------- */
var timer=null;
function parar(){clearTimeout(timer);timer=null}
function rota(){
  parar();
  if(!API)return telaConfig();
  if(location.hash==="#tecnico")return Tec.iniciar();
  return Cli.iniciar();
}
window.addEventListener("hashchange",rota);

/* ---------- configuração (primeira vez) ---------- */
function telaConfig(){
  $("#hDir").innerHTML="";
  $("#app").innerHTML='<div class="caixa card"><h2>Conectar ao servidor</h2><p class="sub">Cole aqui o endereço do App da Web que você copiou no Google Apps Script (termina em <b>/exec</b>).</p>'+
  '<form id="fCfg"><label class="f">Endereço do App da Web<input id="cfgUrl" required placeholder="https://script.google.com/macros/s/…/exec"></label><p></p><button class="btn pri">Conectar</button></form><div id="cfgRes"></div></div>';
  $("#fCfg").onsubmit=function(e){e.preventDefault();var u=$("#cfgUrl").value.trim(),m=u.match(/\/s\/([A-Za-z0-9_-]+)\//);
    if(!m){$("#cfgRes").innerHTML='<p class="erro">Esse endereço não parece um App da Web do Google. Ele começa com https://script.google.com/macros/s/</p>';return}
    SID=m[1];ls("cs-s",SID);API="https://script.google.com/macros/s/"+SID+"/exec";
    $("#cfgRes").innerHTML='<p class="sub">Testando…</p>';
    api("ping").then(function(j){setEmpresa(j.empresa);var b=base();
      $("#cfgRes").innerHTML='<div class="okbox"><b>Conectado a '+esc(j.empresa)+'!</b><p>Link para os <b>clientes</b> abrirem chamados:</p><input readonly value="'+esc(b)+'" onclick="this.select()"><p>Link para a <b>equipe</b> (técnicos e gestor):</p><input readonly value="'+esc(b)+'#tecnico" onclick="this.select()"><p><a class="btn sol" href="'+esc(b)+'#tecnico">Entrar como técnico</a></p></div>'})
    .catch(function(e){$("#cfgRes").innerHTML='<p class="erro">Não consegui falar com o servidor: '+esc(e.message)+'. Confira se a implantação está como "Qualquer pessoa".</p>'})};
}

/* =====================================================================
   CLIENTE
   ===================================================================== */
var Cli={
  aberto:null,dados:null,
  iniciar:function(){
    $("#hDir").innerHTML='';
    $("#rodape").innerHTML='<a href="#tecnico">Área da equipe</a>';
    var c=Q.get("c"),k=Q.get("k");
    if(c&&k){Cli.guardar({id:+c,chave:k});history.replaceState(null,"",base());Cli.abrirChamado(+c,k);return}
    Cli.inicio();
    api("ping").then(function(j){setEmpresa(j.empresa)}).catch(function(){});
  },
  meus:function(){return ls("cs-meus")||[]},
  guardar:function(o){var l=Cli.meus().filter(function(x){return x.id!==o.id});l.unshift(Object.assign({},(Cli.meus().filter(function(x){return x.id===o.id})[0]||{}),o));ls("cs-meus",l.slice(0,30))},
  inicio:function(novo){
    parar();Cli.aberto=null;
    var meus=Cli.meus(),eu=ls("cs-eu")||{};
    var h='<div class="cligrid">';
    if(novo||!meus.length){
      h+='<div class="card"><h2>Abrir um chamado</h2><p class="sub">Conte o que está acontecendo. A equipe de suporte recebe na hora.</p><form id="fCli"><div class="g2">'+
      '<label class="f">Seu nome *<input name="nome" required autocomplete="name" value="'+esc(eu.nome)+'"></label>'+
      '<label class="f">Empresa *<input name="empresa" required autocomplete="organization" value="'+esc(eu.empresa)+'"></label>'+
      '<label class="f">E-mail *<input name="email" type="email" required autocomplete="email" value="'+esc(eu.email)+'"></label>'+

function chatHtml(msgs,lado){
  return '<div class="chat">'+msgs.map(function(m){
    if(m.de==="sis")return '<div class="msg sis">'+esc(m.texto)+' · '+dh(m.quando)+'</div>';
    if(m.de==="int")return '<div class="msg int"><b>🔒 Anotação interna · '+esc(m.autor)+'</b>'+esc(m.texto).replace(/\n/g,"<br>")+'<small>'+dh(m.quando)+' · o cliente não vê</small></div>';
    var eu=(lado==="cli"&&m.de==="cli")||(lado==="tec"&&m.de==="tec");
    return '<div class="msg '+(eu?"eu":"ele")+'">'+esc(m.texto).replace(/\n/g,"<br>")+'<small>'+esc(m.autor||"")+' · '+dh(m.quando)+'</small></div>';
  }).join("")+'</div>';
}

function prazoTag(t){if(t.status==="Resolvido")return '<span class="tag t-ok">Resolvido</span>';var f=t.prazo-Date.now();return f<0?'<span class="tag t-bad">Atrasado '+dur(f)+'</span>':'<span class="tag t-blue">Vence em '+dur(f)+'</span>'}
function linkRemoto(t){var id=String(t.rid||"").replace(/\s/g,"");if(!id)return "";

function avisoCli(a,t,msgs){
  var n={st:t.status,ac:t.acesso,tc:t.tecnico||"",m:msgs.filter(function(x){return x.de==="tec"}).length},o=a.ult;a.ult=n;
  if(!o)return;
  var txt="";
  if(n.ac==="pendente"&&o.ac!=="pendente")txt="🖥 O técnico pediu para acessar o seu computador";
  else if(n.m>o.m)txt="💬 O técnico respondeu o chamado #"+t.id;
  else if(n.st!==o.st&&n.st==="Resolvido")txt="✅ Chamado #"+t.id+" resolvido";
  else if(n.tc&&n.tc!==o.tc)txt="👨‍🔧 "+n.tc+" está cuidando do seu chamado";
  else if(n.st!==o.st)txt="Chamado #"+t.id+": "+n.st;
  if(!txt)return;
  bip();vibrar();
  var t0=document.title,k=0,pi=setInterval(function(){document.title=(k++%2)?t0:"🔔 "+txt;if(k>12||!document.hidden&&k>4){clearInterval(pi);document.title=t0}},900);
  notificar(EMPRESA||"Atende Fácil",txt,"cli-"+t.id);
  bannerCli(txt,function(){var c=document.querySelector(".chat");if(c)c.scrollIntoView({behavior:"smooth",block:"end"})});
}
(function(){var d0=Cli.desenhar;Cli.desenhar=function(t,msgs){try{if(Cli.aberto)avisoCli(Cli.aberto,t,msgs)}catch(e){}d0.apply(Cli,arguments);var c=document.querySelector("#app .card");if(c&&t.status!=="Resolvido")botaoAvisos(c,"🔔 Me avise quando o técnico responder")}})();

  else{setTimeout(function(){intro.classList.add("passo2")},1500);setTimeout(function(){intro.classList.add("fim")},2700);}
  rota();
})();
