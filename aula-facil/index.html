<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aula Fácil · by DayIA</title>
<meta name="theme-color" content="#0E2238">
<meta name="description" content="Aula Fácil by DayIA: chamada, notas, atividades e plano de aula para professoras.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aula Fácil">
<style>
:root{
  --navy:#0E2238;--navy2:#17345A;--azul:#7FD0FB;--azul-d:#2E8FD0;--azul-l:#E8F6FE;
  --amarelo:#F4B400;--amarelo-l:#FFF4CF;--bg:#F5F8FC;--card:#fff;--txt:#0E2238;--muted:#5D6B7E;
  --linha:#E1E8F0;--verde:#1E9E5A;--verde-l:#E3F6EB;--vermelho:#D64545;--vermelho-l:#FDE8E8;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.oculto{display:none!important}

/* topo */
.topo{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(14,34,56,.25)}
.marca{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.marca .simb{width:38px;height:38px;background:#fff;border-radius:10px;padding:4px;flex:none}
.marca .simb img{width:100%;height:100%;display:block;border-radius:6px}
.marca .nomes{min-width:0}
.marca h1{margin:0;font-size:19px;line-height:1.1;font-weight:800;letter-spacing:.2px}
.marca .by{display:flex;align-items:center;gap:5px;font-size:11px;color:#CFE2F2;margin-top:3px}
.marca .by img{height:13px;width:auto;display:block}
.btn-modo{background:var(--navy2);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:8px 10px;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn-instalar{background:var(--amarelo);color:var(--navy);border:0;border-radius:12px;padding:9px 13px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 4px 12px rgba(244,180,0,.35)}
.btn-engr{background:transparent;border:0;color:#fff;font-size:20px;padding:6px;line-height:1}
@media (max-width:420px){.btn-modo .txt{display:none}.marca .simb{display:none}}

main{max-width:720px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
h2{font-size:22px;margin:4px 0 4px}
h3{font-size:17px;margin:0 0 10px}
p{line-height:1.45}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 2px 10px rgba(14,34,56,.06);margin-bottom:14px;border:1px solid var(--linha)}

/* botões */
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-pri{background:var(--navy);color:#fff}
.btn-sec{background:var(--azul-l);color:var(--navy)}
.btn-ama{background:var(--amarelo);color:var(--navy)}
.btn-perigo{background:var(--vermelho-l);color:var(--vermelho)}
.btn-bloco{width:100%}
.linha-btns{display:flex;gap:10px;flex-wrap:wrap}
.linha-btns .btn{flex:1;min-width:140px}

/* boas-vindas */
.boasvindas{position:fixed;inset:0;z-index:60;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.boasvindas h2{font-size:26px;margin:14px 0 6px}
.boasvindas p{color:#CFE2F2;margin:0 0 22px}
.opcoes{display:grid;gap:14px;width:100%;max-width:420px}
.opcao{background:#fff;color:var(--navy);border:0;border-radius:20px;padding:20px 18px;display:flex;align-items:center;gap:14px;text-align:left;font-size:18px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.opcao .ic{font-size:32px;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none}
.opcao small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:3px}
.boasvindas .simb{width:64px;height:64px;background:#fff;border-radius:16px;padding:6px}
.boasvindas .simb img{width:100%;height:100%;border-radius:10px;display:block}

/* início */
.ola{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sel-turma{display:flex;align-items:center;gap:8px;margin:2px 0 16px}
.sel-turma select{border:1px solid var(--linha);background:#fff;border-radius:12px;padding:9px 12px;font-weight:700;max-width:100%}
.atalhos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.atalho{border:0;border-radius:20px;padding:18px 14px;text-align:left;font-weight:800;font-size:15px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 10px rgba(14,34,56,.08)}
.atalho .ic{font-size:30px}
.a1{background:var(--navy);color:#fff}.a2{background:var(--azul);color:var(--navy)}
.a3{background:var(--amarelo);color:var(--navy)}.a4{background:#fff;color:var(--navy);border:1px solid var(--linha)!important}
.agenda-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linha)}
.agenda-item:last-child{border-bottom:0}
.hora{background:var(--azul-l);color:var(--navy);font-weight:800;border-radius:10px;padding:6px 9px;font-size:14px;min-width:62px;text-align:center}
.x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;padding:4px 8px}
.aviso{background:var(--amarelo-l);border:1px solid #F3DA8A;border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.aviso b{color:#8A6200}
.pag-resumo{display:flex;gap:10px;margin:6px 0 12px}
.pag-resumo div{flex:1;border-radius:14px;padding:12px;text-align:center;font-size:13px}
.pag-resumo b{display:block;font-size:24px}

/* organização */
.org{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.org button{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:10px 2px;font-weight:700;font-size:11px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--navy)}
.org .ic{font-size:22px}
.bolinha{display:inline-block;background:var(--vermelho);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:2px}
.tarefa{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--linha)}
.tarefa:last-child{border-bottom:0}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--azul-d);background:#fff;flex:none;display:grid;place-items:center;font-weight:900;color:#fff}
.check.on{background:var(--verde);border-color:var(--verde)}
.tarefa.feita .ttxt{text-decoration:line-through;color:var(--muted)}
.prazo{font-size:12px;font-weight:700;border-radius:8px;padding:2px 7px;display:inline-block;margin-top:3px}
.prazo.ok{background:var(--azul-l);color:var(--navy)}.prazo.perto{background:var(--amarelo-l);color:#8A6200}.prazo.atras{background:var(--vermelho-l);color:var(--vermelho)}
.lapis{width:38px;height:38px;border-radius:12px;background:var(--azul-l);display:grid;place-items:center;font-size:17px;flex:none}
.aviso-ex{background:var(--azul-l);border:1px solid #BFE6FB;border-radius:16px;padding:14px;margin-bottom:14px;font-size:14px}
.aviso-ex .btn{margin-top:10px;width:100%}
.dia{font-size:12px;font-weight:800;color:var(--azul-d);text-transform:uppercase;letter-spacing:.4px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--linha);background:#fff;border-radius:999px;padding:8px 13px;font-weight:700;font-size:13px;color:var(--muted)}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-mic{border:0;background:var(--azul-l);color:var(--navy);border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn-mic.ouvindo{background:var(--vermelho);color:#fff;animation:pulsa 1.2s infinite}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(214,69,69,.45)}50%{box-shadow:0 0 0 8px rgba(214,69,69,0)}}
.rotulo-mic{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.rotulo-mic label{margin:0!important}
.ajuste{background:var(--amarelo-l);border:1px solid #F3DA8A;border-radius:16px;padding:12px;margin-top:12px}
.ajuste textarea{min-height:64px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto;padding:4px 2px 10px;margin-bottom:10px}
.bolha{max-width:88%;padding:12px 14px;border-radius:18px;line-height:1.45;font-size:15px}
.bolha.eu{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:6px}
.bolha.ia{align-self:flex-start;background:#fff;border:1px solid var(--linha);border-bottom-left-radius:6px}
.bolha ol,.bolha ul{padding-left:20px}
.acoes-bolha{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acoes-bolha button{border:0;background:var(--azul-l);color:var(--navy);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.sug{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.chip-sug{border:1px solid var(--linha);background:var(--azul-l);color:var(--navy);border-radius:12px;padding:8px 10px;text-align:left;font-size:13px;font-weight:600}
.caixa-chat{background:#fff;border:1px solid var(--linha);border-radius:18px;padding:12px}
/* listas */
.busca{position:relative;margin-bottom:12px}
.busca input{width:100%;border:1px solid var(--linha);background:#fff;border-radius:14px;padding:13px 14px 13px 42px;font-size:16px}
.busca::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.7}
.lista{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.item .av{width:40px;height:40px;border-radius:50%;background:var(--azul-l);color:var(--navy);display:grid;place-items:center;font-weight:800;flex:none}
.item .info{flex:1;min-width:0}
.item .nome{font-weight:700}
.item .det{color:var(--muted);font-size:13px;margin-top:2px}
.vazio{color:var(--muted);text-align:center;padding:18px;font-size:14px}
.topo-lista{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}

/* chamada */
.contagem{display:flex;gap:10px;margin-bottom:12px}
.contagem div{flex:1;border-radius:14px;padding:10px;text-align:center;font-size:13px;font-weight:600}
.contagem b{display:block;font-size:26px}
.pres{background:var(--verde-l);color:var(--verde)}
.falt{background:var(--vermelho-l);color:var(--vermelho)}
.item.cham{cursor:pointer;user-select:none}
.selo{border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.selo.p{background:var(--verde-l);color:var(--verde)}
.selo.f{background:var(--vermelho);color:#fff}
.alerta-f{display:inline-block;background:var(--amarelo-l);color:#8A6200;border-radius:8px;padding:2px 7px;font-size:12px;font-weight:700;margin-top:4px}
.fixo-baixo{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));margin-top:14px}

/* notas */
.seg{display:flex;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:10px 6px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.nota-linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nota-linha label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.nota-linha input{width:68px;border:1px solid var(--linha);border-radius:10px;padding:9px;text-align:center;font-size:16px}
.media{min-width:64px;text-align:center;border-radius:12px;padding:8px;font-weight:800}
.media.boa{background:var(--verde-l);color:var(--verde)}.media.ruim{background:var(--vermelho-l);color:var(--vermelho)}.media.nada{background:var(--bg);color:var(--muted)}
.evol{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.evol button{flex:1;min-width:92px;border:1px solid var(--linha);background:#fff;border-radius:12px;padding:10px 6px;font-size:13px;font-weight:700}
.evol button.on.e1{background:#FDE8E8;border-color:#F3B4B4;color:var(--vermelho)}
.evol button.on.e2{background:var(--amarelo-l);border-color:#F3DA8A;color:#8A6200}
.evol button.on.e3{background:var(--verde-l);border-color:#A9DFC0;color:var(--verde)}
.item.col{flex-direction:column;align-items:stretch}
.item.col .cab{display:flex;align-items:center;gap:12px}
textarea,.campo input,.campo select{width:100%;border:1px solid var(--linha);border-radius:12px;padding:12px;background:#fff;font-size:16px}
textarea{min-height:90px;resize:vertical;line-height:1.45}
.campo{margin-bottom:12px}
.campo label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.campo .dica{font-size:12px;color:var(--muted);margin-top:4px}

/* atividade gerada */
.folha{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:20px;margin-top:14px}
.folha h4{margin:0 0 4px;font-size:19px}
.folha .cabec{font-size:13px;color:var(--muted);border-bottom:1px dashed var(--linha);padding-bottom:10px;margin-bottom:12px}
.folha ol{padding-left:22px}
.folha li{margin-bottom:14px;line-height:1.45}
.linhas{border-bottom:1px solid #9AA7B6;height:26px}
.grade{display:grid;gap:2px;margin:10px auto;width:max-content}
.grade span{width:26px;height:26px;display:grid;place-items:center;font-weight:700;font-family:ui-monospace,Menlo,monospace;border:1px solid #D5DEE8;font-size:14px}
.palavras{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.palavras span{background:var(--azul-l);border-radius:8px;padding:4px 9px;font-weight:700;font-size:13px}
.selo-ia{display:inline-block;background:var(--azul-l);color:var(--navy);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
.selo-demo{display:inline-block;background:var(--amarelo-l);color:#8A6200;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}

/* menu de baixo */
.menu{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--linha);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(14,34,56,.08)}
.menu button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 2px;border-radius:12px}
.menu button .ic{font-size:21px;line-height:1.1}
.menu button.on{color:var(--navy);background:var(--azul-l)}

/* modal */
.fundo{position:fixed;inset:0;background:rgba(14,34,56,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.janela{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media (min-width:640px){.fundo{align-items:center}.janela{border-radius:22px}}
.janela h3{font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;z-index:70;transition:.3s;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.offline{background:var(--amarelo-l);color:#8A6200;text-align:center;font-size:13px;padding:6px;font-weight:600}
.privac{font-size:12.5px;color:var(--muted);text-align:center;margin-top:18px}

/* impressão */
#impressao{display:none}
@media print{
  body *{visibility:hidden}
  #impressao,#impressao *{visibility:visible}
  #impressao{display:block;position:absolute;left:0;top:0;width:100%;padding:10mm;color:#000;font-family:Arial,sans-serif}
  #impressao table{width:100%;border-collapse:collapse;font-size:13px}
  #impressao th,#impressao td{border:1px solid #999;padding:6px;text-align:left}
  .menu,.topo{display:none}
  #impressao .so-tela{display:none!important}
}
/* abertura padrão DayIA */
#intro{position:fixed;inset:0;z-index:100;background:#0E2238;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
#intro.fim{opacity:0;pointer-events:none}
#intro .quadro{width:76px;height:76px;background:#fff;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:cresce 1.4s cubic-bezier(.2,.8,.2,1) forwards}
#intro .quadro img{width:100%;height:100%;display:block;border-radius:10px}
#intro .by{position:absolute;display:flex;align-items:center;gap:10px;font-size:22px;color:#CFE2F2;opacity:0;transition:opacity .45s ease}
#intro .by img{height:40px;width:auto;display:block}
#intro.passo2 .quadro{opacity:0;transition:opacity .3s}
#intro.passo2 .by{opacity:1}
@keyframes cresce{0%{transform:scale(.6) rotate(0);opacity:0}20%{opacity:1}55%{transform:scale(1.6) rotate(0)}100%{transform:scale(1.6) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#intro{display:none}}
</style>
</head>

    const en=[];m.turmas.forEach(t=>(m.entregas[t.id]||[]).forEach(e=>{if(tem(e.nome))en.push(item("📥",e.nome,(DB.modo==="aulas"?"":t.nome+" · ")+e.entregues.length+" entregaram",{a:"entregas",t:t.id,id:e.id}))}));
    g("📥 Entregas",en);

function abrirResultado(r){
  const m=M();if(r.t){m.turmaId=r.t;chamadaTemp=null;salvar()}
  if(r.a==="atividade"){ir("atividades");mostrarAtividade(m.atividades.find(x=>x.id===r.id),true);return}
  if(r.a==="plano"){ir("plano");const p=m.planos.find(x=>x.id===r.id);if(p){["pTema","pObj","pPassos","pMat"].forEach((k,n)=>{$("#"+k).value=[p.tema,p.obj,p.passos,p.mat][n]});$("#pIdade").value=p.idade;const b=$("#pBncc");if(b)b.value=p.bncc||""}return}
  if(r.a==="entregas"){entregaAtual=r.id;ir("entregas");return}
  if(r.b)buscaInicial={id:r.b,q:r.q};
  ir(r.a);
}

/* ---------- CHAMADA ---------- */
function telaChamada(el){
  const t=turma(),m=M(),hoje=hojeISO();
  if(!chamadaTemp||chamadaTemp.turmaId!==t.id){const sal=(m.chamadas[t.id]||{})[hoje];chamadaTemp={turmaId:t.id,faltas:new Set(sal||[]),jaSalva:!!sal}}
  el.innerHTML=`<h2>Chamada</h2><p class="sub">${dataBR(hoje)} · ${chamadaTemp.jaSalva?"já salva hoje (pode corrigir)":"todos começam como presentes"}</p>
  ${DB.modo==="aulas"?"":seletorTurma()}
  <div class="contagem"><div class="pres"><b id="nP">0</b>Presentes</div><div class="falt"><b id="nF">0</b>Faltas</div></div>
  <p class="sub">Toque no nome do aluno para marcar <b>Falta</b>. Toque de novo para voltar para <b>Presente</b>.</p>
  ${campoBusca("bCham","Buscar aluno pelo nome")}
  <div class="lista" id="lCham"></div>
  <div class="fixo-baixo"><button class="btn btn-pri btn-bloco" id="salvarCham">💾 Salvar chamada</button></div>`;
  ligarSeletor();
  const desenhar=()=>{
    const f=chamadaTemp.faltas;
    $("#lCham").innerHTML=t.alunos.map(a=>{
      const falta=f.has(a.id);let n=faltasDe(t,a.id);
      if(chamadaTemp.jaSalva){if(((m.chamadas[t.id]||{})[hoje]||[]).includes(a.id))n--}
      if(falta)n++;
      const al=pertoLimite(t,n)?`<span class="alerta-f">⚠️ ${n} faltas · limite ${t.limite}</span>`:`<div class="det">${n} ${n===1?"falta":"faltas"} no total</div>`;
      return `<div class="item cham" data-id="${a.id}" data-busca="${esc(a.nome)}"><div class="av">${esc(iniciais(a.nome))}</div><div class="info"><div class="nome">${esc(a.nome)}</div>${al}</div><span class="selo ${falta?"f":"p"}">${falta?"Falta":"Presente"}</span></div>`}).join("")||`<div class="vazio">Nenhum aluno nesta turma.</div>`;
    $("#nF").textContent=f.size;$("#nP").textContent=t.alunos.length-f.size;
    $("#lCham").querySelectorAll(".item").forEach(i=>i.onclick=()=>{const id=i.dataset.id;f.has(id)?f.delete(id):f.add(id);desenhar();const b=$("#bCham");if(b&&b.value)b.dispatchEvent(new Event("input"))});
  };
  desenhar();ligarBusca("bCham","#lCham .item");
  $("#salvarCham").onclick=()=>{
    if(!m.chamadas[t.id])m.chamadas[t.id]={};
    m.chamadas[t.id][hoje]=[...chamadaTemp.faltas];chamadaTemp.jaSalva=true;salvar();
    const perto=t.alunos.filter(a=>pertoLimite(t,faltasDe(t,a.id)));
    toast("Chamada salva em 📂 Salvos! "+(t.alunos.length-chamadaTemp.faltas.size)+" presentes e "+chamadaTemp.faltas.size+" faltas.");
    if(perto.length)avisoCelular("Atenção às faltas","Perto do limite: "+perto.map(a=>a.nome).join(", "));
    desenhar();
  };
}

  ${campoBusca("bNotas","Buscar aluno pelo nome")}
  <div class="lista" id="lNotas"></div><div id="rodNotas"></div>`;
  ligarSeletor();
  el.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{t.aval=b.dataset.av;salvar();render()});
  const L=$("#lNotas");
  if(t.aval==="nota"){
    L.innerHTML=t.alunos.map(a=>{const md=media(a);return `<div class="item col" data-busca="${esc(a.nome)}"><div class="cab"><div class="av">${esc(iniciais(a.nome))}</div><div class="info"><div class="nome">${esc(a.nome)}</div></div></div>
      <div class="nota-linha" style="margin-top:10px"><label>Prova<input inputmode="decimal" data-id="${a.id}" data-c="prova" value="${esc(a.prova)}" placeholder="0 a 10"></label>
      <label>Trabalho<input inputmode="decimal" data-id="${a.id}" data-c="trabalho" value="${esc(a.trabalho)}" placeholder="0 a 10"></label>
      <label>Média<span class="media ${md==null?"nada":md>=6?"boa":"ruim"}" id="m_${a.id}">${fmt(md)}</span></label></div></div>`}).join("")||`<div class="vazio">Nenhum aluno.</div>`;
    L.querySelectorAll("input").forEach(i=>i.oninput=()=>{
      let v=i.value.replace(/[^0-9.,]/g,"");const n=parseFloat(v.replace(",","."));if(!isNaN(n)&&n>10)v="10";i.value=v;
      const a=t.alunos.find(x=>x.id===i.dataset.id);a[i.dataset.c]=v;salvar();
      const md=media(a),s=$("#m_"+a.id);s.textContent=fmt(md);s.className="media "+(md==null?"nada":md>=6?"boa":"ruim")});
    $("#rodNotas").innerHTML=`<p class="sub" style="margin-top:12px">A média é calculada sozinha: (prova + trabalho) ÷ 2.</p><button class="btn btn-pri btn-bloco" id="boletim">🖨️ Gerar boletim da turma</button>`;
    $("#boletim").onclick=()=>boletim(t);
  }else if(t.aval==="evolucao"){
    L.innerHTML=t.alunos.map(a=>`<div class="item col" data-busca="${esc(a.nome)}"><div class="cab"><div class="av">${esc(iniciais(a.nome))}</div><div class="info"><div class="nome">${esc(a.nome)}</div><div class="det">${esc(a.info)}</div></div></div>
      <div class="evol">${Object.keys(EVOL).map(k=>`<button data-id="${a.id}" data-e="${k}" class="${k} ${a.evol===k?"on":""}">${k==="e1"?"🌱":k==="e2"?"📈":"⭐"} ${EVOL[k]}</button>`).join("")}</div></div>`).join("")||`<div class="vazio">Nenhum aluno.</div>`;
    L.querySelectorAll(".evol button").forEach(b=>b.onclick=()=>{const a=t.alunos.find(x=>x.id===b.dataset.id);a.evol=a.evol===b.dataset.e?"":b.dataset.e;salvar();
      b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.e===a.evol))});
    $("#rodNotas").innerHTML=`<p class="sub" style="margin-top:12px">🌱 Começando · 📈 Melhorando · ⭐ Já sabe</p>`;
  }else{
    L.innerHTML=t.alunos.map(a=>`<div class="item col" data-busca="${esc(a.nome)}"><div class="cab"><div class="av">${esc(iniciais(a.nome))}</div><div class="info"><div class="nome">${esc(a.nome)}</div><div class="det">${esc(a.info)}</div></div></div>
      <div class="campo" style="margin:10px 0 8px"><div class="rotulo-mic"><label>Anotações rápidas</label>${micBtn('[data-c=anot][data-id="'+a.id+'"]')}</div><textarea data-id="${a.id}" data-c="anot" placeholder="Ex.: brinca bem com os colegas; já reconhece as cores; ainda tem dificuldade para segurar o lápis">${esc(a.anot)}</textarea></div>
      <button class="btn btn-ama" data-rel="${a.id}">✨ Escrever relatório com IA</button>
      <div class="campo ${a.relatorio?"":"oculto"}" id="r_${a.id}" style="margin-top:12px"><label>Relatório (revise e ajuste se quiser)</label><textarea data-id="${a.id}" data-c="relatorio" style="min-height:180px">${esc(a.relatorio)}</textarea>
      <div class="linha-btns" style="margin-top:8px"><button class="btn btn-sec" data-cp="${a.id}">📋 Copiar</button><button class="btn btn-sec" data-pr="${a.id}">🖨️ Imprimir</button></div>
      <div class="ajuste"><div class="rotulo-mic"><label><b>Não gostou?</b> Fale ou escreva o que mudar</label>${micBtn('[data-aj="'+a.id+'"]')}</div>
      <textarea data-aj="${a.id}" placeholder="Ex.: deixe mais curto, fale mais da coordenação motora, tom mais formal"></textarea>
      <button class="btn btn-ama btn-bloco" data-refrel="${a.id}" style="margin-top:8px">🔄 Refazer o relatório</button></div></div></div>`).join("")||`<div class="vazio">Nenhum aluno.</div>`;
    L.querySelectorAll("textarea[data-c]").forEach(x=>x.oninput=()=>{const a=t.alunos.find(y=>y.id===x.dataset.id);a[x.dataset.c]=x.value;if(x.dataset.c==="relatorio")a.relData=hojeISO();salvar()});
    ligarMics(L);
    const escrever=(a,b,extra,rotulo)=>{
      if(!a.anot.trim()){toast("Escreva ou fale primeiro algumas anotações sobre "+a.nome.split(" ")[0]+".");return}
      const nomeP=a.nome.split(/[ ,(]/)[0];b.disabled=true;b.textContent="⏳ Escrevendo...";
      const tira=s=>String(s||"").split(new RegExp(nomeP.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi")).join("[NOME]");
      const anon=tira(a.anot);
      if(extra.anterior)extra.anterior=tira(extra.anterior);if(extra.ajuste)extra.ajuste=tira(extra.ajuste);
      pedirIA(Object.assign({tipo:"relatorio",anotacoes:anon,fase:a.evol?EVOL[a.evol]:"",idade:(a.info.match(/\d+\s*anos?/)||[""])[0]},extra)).then(r=>{
        if(extra.ajuste&&!(typeof r==="string"&&r.trim())){toast("Não consegui refazer agora. Tente de novo em instantes.");return}
        a.relatorio=(typeof r==="string"&&r.trim())?r.replace(/(^|[\s(])(?:[OoAa]|[Dd][oa]|[Nn][oa]) \[NOME\]/g,(m,p1)=>p1+(/^[Dd]/.test(m.trim())?"de ":/^[Nn]/.test(m.trim())?"em ":"")+"[NOME]").replace(/\[NOME\]/g,nomeP).trim():gerarRelatorio(a);
        a.relData=hojeISO();salvar();const box=$("#r_"+a.id);box.classList.remove("oculto");box.querySelector("textarea[data-c=relatorio]").value=a.relatorio;
        const aj=box.querySelector("[data-aj]");if(aj)aj.value="";
        toast(extra.ajuste?"Relatório refeito com a sua mudança!":"Relatório pronto e salvo em 📂 Salvos. Revise antes de usar.")
      }).finally(()=>{b.disabled=false;b.textContent=rotulo})};
    L.querySelectorAll("[data-rel]").forEach(b=>b.onclick=()=>escrever(t.alunos.find(y=>y.id===b.dataset.rel),b,{},"✨ Escrever relatório com IA"));
    L.querySelectorAll("[data-refrel]").forEach(b=>b.onclick=()=>{const a=t.alunos.find(y=>y.id===b.dataset.refrel);const aj=(L.querySelector('[data-aj="'+a.id+'"]').value||"").trim();
      if(!aj){toast("Fale ou escreva o que você quer mudar no relatório.");return}escrever(a,b,{ajuste:aj,anterior:a.relatorio},"🔄 Refazer o relatório")});
    L.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copiar(t.alunos.find(y=>y.id===b.dataset.cp).relatorio));
    L.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{const a=t.alunos.find(y=>y.id===b.dataset.pr);imprimir(`<h2>Relatório de desenvolvimento</h2><p><b>Aluno(a):</b> ${esc(a.nome)} &nbsp; <b>Turma:</b> ${esc(t.nome)}</p>${esc(a.relatorio).split(/\n+/).map(p=>"<p>"+p+"</p>").join("")}<p style="margin-top:40px">______________________________<br>Professora</p>`)});
  }
  ligarBusca("bNotas","#lNotas .item");
}
function boletim(t){
  const linhas=t.alunos.map(a=>{const m=media(a);return `<tr><td>${esc(a.nome)}</td><td>${fmt(a.prova===""?null:a.prova)}</td><td>${fmt(a.trabalho===""?null:a.trabalho)}</td><td><b>${fmt(m)}</b></td><td>${m==null?"Sem nota":m>=6?"Acima da média":"Precisa de reforço"}</td></tr>`}).join("");
  imprimir(`<h2>Boletim da turma – ${esc(t.nome)}</h2><p>Data: ${dataBR(hojeISO())}</p><table><tr><th>Aluno(a)</th><th>Prova</th><th>Trabalho</th><th>Média</th><th>Situação</th></tr>${linhas}</table><p style="margin-top:40px">______________________________<br>Professora</p>`);
}

/* ---------- ATIVIDADES ---------- */
function telaAtividades(el){
  const m=M();
  el.innerHTML=`<h2>Atividades com IA ✨</h2><p class="sub">Escreva o tema, escolha a idade e o tipo. O app monta a atividade pronta para imprimir.</p>
  <div class="card">
  <div class="campo"><label for="aTema">Tema da atividade</label><input id="aTema" placeholder="Ex.: animais da fazenda, frações, verbo to be"></div>
  <div class="campo"><label for="aIdade">Idade</label><select id="aIdade">${Object.entries(IDADES).map(([k,v])=>`<option value="${k}" ${k===(DB.modo==="particular"?"inf":"f1")?"selected":""}>${v}</option>`).join("")}</select></div>
  <div class="campo"><label for="aMat">Matéria</label><select id="aMat"><option value="">Escolha (opcional)</option>${MATERIAS.map(m=>`<option>${m}</option>`).join("")}</select></div>
  <div class="campo"><label for="aTipo">Tipo</label><select id="aTipo">${GRUPOS_TIPO.map(([g,ks])=>`<optgroup label="${g}">${ks.map(k=>`<option value="${k}">${TIPOS[k]}</option>`).join("")}</optgroup>`).join("")}</select><div class="dica" id="dicaTipo"></div></div>
  <div class="campo oculto" id="cPal"><label for="aPal" id="lblPal">Palavras</label><input id="aPal" placeholder="Ex.: vaca, porco, galinha, cavalo"><div class="dica">Separe por vírgula. Se deixar vazio, o app usa as palavras do tema.</div></div>
  <div class="campo"><div class="rotulo-mic"><label for="aIdeia">💬 Sua ideia (opcional)</label>${micBtn("#aIdeia")}</div><textarea id="aIdeia" placeholder="Fale ou escreva como você quer a atividade. Ex.: quero 5 questões com desenho, usando os animais que a turma viu no passeio"></textarea></div>
  <button class="btn btn-ama btn-bloco" id="criarAt">✨ Criar atividade</button></div>
  <div id="resAt"></div>
  <h3 style="margin-top:22px">📂 Atividades salvas</h3>
  ${campoBusca("bAt","Buscar atividade (nome ou o que tem dentro)")}
  <div class="lista" id="lAt">${m.atividades.length?m.atividades.map(a=>`<div class="item" data-busca="${esc(a.titulo+" "+tirarTags(a.html))}" data-id="${a.id}" style="cursor:pointer"><div class="av">📄</div><div class="info"><div class="nome">${esc(a.titulo)}</div><div class="det">${esc(IDADES[a.idade])} · ${dataBR(a.data)}</div></div><button class="x" data-del="${a.id}" aria-label="Apagar">✕</button></div>`).join(""):`<div class="vazio">Nenhuma atividade salva ainda.</div>`}</div>`;
  if(atPrefill){$("#aTema").value=atPrefill.tema;$("#aTipo").value="prova";atPrefill=null;setTimeout(()=>{$("#aTema").scrollIntoView({block:"center"});toast("Confira a idade e toque em ✨ Criar atividade.")},100)}
  const tipo=$("#aTipo");tipo.onchange=()=>{const v=tipo.value;$("#cPal").classList.toggle("oculto",!USA_PAL[v]);
    $("#dicaTipo").textContent=PRONTOS[v]?"✅ Fica pronta na hora, mesmo sem internet. Use o campo \"Sua ideia\" para escolher o que vai na folha.":"✨ A IA cria sobre qualquer assunto (precisa de internet).";
    $("#aIdeia").placeholder=DICAS_TIPO[v]||"Fale ou escreva como você quer a atividade. Ex.: quero 5 questões com desenho, usando os animais que a turma viu no passeio";
    const dc=$("#dicaCol");if(dc)dc.remove();
    if(v==="colorir")$("#aIdeia").insertAdjacentHTML("afterend",`<div class="dica" id="dicaCol">Desenhos prontos (${Object.keys(NOMES_DESENHO).length}): ${Object.values(NOMES_DESENHO).join(", ")}.</div>`);
    if(PRONTOS[v]&&!$("#aTema").value.trim())$("#aTema").placeholder="Opcional para este tipo";else $("#aTema").placeholder="Ex.: animais da fazenda, frações, verbo to be";
    $("#lblPal").textContent=v==="ligue"?"Pares para ligar":v==="ditado"?"Palavras do ditado":v==="cruz"?"Palavras da cruzadinha":"Palavras do caça-palavras";
    $("#aPal").placeholder=v==="ligue"?"Ex.: vaca=leite, galinha=ovo, abelha=mel":v==="cruz"?"Ex.: vaca, porco, galinha":"Ex.: vaca, porco, galinha, cavalo"};
  ligarBusca("bAt","#lAt .item");ligarMics(el);tipo.onchange();
  $("#criarAt").onclick=()=>{
    const tema=$("#aTema").value.trim();
    if(!tema&&!PRONTOS[tipo.value]){toast("Escreva o tema da atividade.");$("#aTema").focus();return}
    const at={id:uid(),tema,materia:$("#aMat").value,idade:$("#aIdade").value,tipo:tipo.value,pal:$("#aPal").value,ideia:$("#aIdeia").value.trim(),data:hojeISO()};
    at.titulo=TIPOS[at.tipo]+(tema?": "+tema:"");
    if(PRONTOS[at.tipo]){at.pronto=true;at.html=gerarPronto(at);mostrarAtividade(at,false);return}
    const btn=$("#criarAt");btn.disabled=true;btn.textContent="⏳ Criando com IA...";
    criarAtividadeIA(at,{}).finally(()=>{btn.disabled=false;btn.textContent="✨ Criar atividade"});
  };
  el.querySelectorAll("#lAt .item").forEach(i=>i.onclick=e=>{if(e.target.dataset.del)return;mostrarAtividade(m.atividades.find(a=>a.id===i.dataset.id),true)});
  el.querySelectorAll("#lAt [data-del]").forEach(b=>b.onclick=()=>{if(!confirm("Apagar esta atividade?"))return;m.atividades=m.atividades.filter(a=>a.id!==b.dataset.del);salvar();render()});
}
function criarAtividadeIA(at,extra){
  return pedirIA(Object.assign({tipo:"atividade",tema:(at.materia?at.materia+" – ":"")+at.tema,idade:at.idade,tipo_atividade:at.tipo,palavras:at.pal,ideia:at.ideia||""},extra)).then(r=>{
    const htmlAntigo=at.html;
    if(r){try{at.ia=true;at.html=atividadeIA(at,r)}catch(e){at.ia=false;r=null}}
    if(!r){if(extra.ajuste&&htmlAntigo){toast("Não consegui refazer agora. Tente de novo em instantes.");at.html=htmlAntigo}else at.html=gerarAtividade(at)}
    else if(extra.ajuste)toast("Pronto! Atividade refeita com a sua mudança.");
    mostrarAtividade(at,false);
  });
}
function mostrarAtividade(at,salva){
  $("#resAt").innerHTML=`<div class="folha" id="folhaAt">${at.html}</div>
  <div class="linha-btns" style="margin-top:12px"><button class="btn btn-pri" id="impAt">🖨️ Imprimir</button>${salva?"":`<button class="btn btn-sec" id="salAt">💾 Salvar</button>`}</div>
  ${!salva&&at.pronto?`<button class="btn btn-ama btn-bloco" id="outraAt" style="margin-top:10px">🔄 Gerar outra versão</button>`:""}
  ${salva||at.pronto?"":`<div class="ajuste"><div class="rotulo-mic"><label for="aAjuste"><b>Não gostou de algo?</b> Fale ou escreva o que mudar</label>${micBtn("#aAjuste")}</div>
  <textarea id="aAjuste" placeholder="Ex.: deixe mais fácil, troque a questão 3, coloque mais desenho, use só animais selvagens"></textarea>
  <button class="btn btn-ama btn-bloco" id="refazAt" style="margin-top:8px">🔄 Refazer com essa mudança</button></div>`}`;
  ligarMics($("#resAt"));
  const ou=$("#outraAt");if(ou)ou.onclick=()=>{at.html=gerarPronto(at);mostrarAtividade(at,false);toast("Pronto! Uma versão nova.")};
  const rf=$("#refazAt");if(rf)rf.onclick=()=>{const aj=$("#aAjuste").value.trim();if(!aj){toast("Fale ou escreva o que você quer mudar.");return}
    rf.disabled=true;rf.textContent="⏳ Refazendo...";criarAtividadeIA(at,{ajuste:aj,anterior:tirarTags(at.html).replace(/\s+/g," ").slice(0,2500)})};
  $("#impAt").onclick=()=>imprimir(at.html);
  const s=$("#salAt");if(s)s.onclick=()=>{M().atividades.unshift(at);salvar();toast("Atividade salva em 📂 Salvos!");render()};
  $("#folhaAt").scrollIntoView({behavior:"smooth",block:"start"});
}

  <div class="campo"><div class="rotulo-mic"><label for="pIdeia">💬 Sua ideia (opcional)</label>${micBtn("#pIdeia")}</div><textarea id="pIdeia" placeholder="Fale ou escreva como imagina a aula. Ex.: quero uma aula com experiência usando copo e gelo, e um vídeo curto"></textarea></div>

  <button class="btn btn-ama btn-bloco" id="montarP">✨ Montar o plano com IA</button>
  <div class="ajuste"><div class="rotulo-mic"><label for="pAjuste"><b>Não gostou?</b> Fale ou escreva o que mudar</label>${micBtn("#pAjuste")}</div>
  <textarea id="pAjuste" placeholder="Ex.: aula mais curta, sem vídeo, com mais atividade em grupo"></textarea>
  <button class="btn btn-ama btn-bloco" id="refazP" style="margin-top:8px">🔄 Refazer o plano</button></div>
  <div class="linha-btns" style="margin-top:10px"><button class="btn btn-sec" id="salP">💾 Salvar</button><button class="btn btn-sec" id="impP">🖨️ Imprimir</button></div></div>
  <h3 style="margin-top:22px">📂 Planos salvos</h3>${campoBusca("bPl","Buscar plano (tema ou o que tem dentro)")}
  <div class="lista" id="lPl">${m.planos.length?m.planos.map(p=>`<div class="item" data-busca="${esc([p.tema,p.obj,p.bncc,p.passos,p.mat].join(" "))}" data-id="${p.id}" style="cursor:pointer"><div class="av">📚</div><div class="info"><div class="nome">${esc(p.tema)}</div><div class="det">${esc(IDADES[p.idade])} · ${dataBR(p.data)}</div></div><button class="x" data-del="${p.id}" aria-label="Apagar">✕</button></div>`).join(""):`<div class="vazio">Nenhum plano salvo ainda.</div>`}</div>`;
  ligarBusca("bPl","#lPl .item");ligarMics(el);
  const ler=()=>({tema:$("#pTema").value.trim(),idade:$("#pIdade").value,obj:$("#pObj").value,bncc:escola?$("#pBncc").value:"",passos:$("#pPassos").value,mat:$("#pMat").value});
  const pôr=p=>{$("#pTema").value=p.tema;$("#pIdade").value=p.idade;$("#pObj").value=p.obj;if(escola)$("#pBncc").value=p.bncc||"";$("#pPassos").value=p.passos;$("#pMat").value=p.mat};
  const montar=(bt,rotulo,ajuste)=>{const p=ler();if(!p.tema){toast("Escreva o tema da aula.");$("#pTema").focus();return}

    const extra=ajuste?{ajuste,anterior:tirarTags(htmlPlano(p,escola)).replace(/\s+/g," ").slice(0,2500)}:{};

      let g=null;if(r&&typeof r==="object"&&r.passos){g={obj:r.objetivo||"",bncc:escola?(r.bncc||""):"",passos:(Array.isArray(r.passos)?r.passos.map((x,i)=>(i+1)+". "+String(x).replace(/^\d+[.)]\s*/,"")).join("\n"):String(r.passos)),mat:r.material||""}}

  $("#montarP").onclick=()=>montar($("#montarP"),"✨ Montar o plano com IA");

function rotuloPrazo(iso){if(!iso)return "";const hoje=new Date(hojeISO()),d=new Date(iso),dias=Math.round((d-hoje)/864e5);

function listaSalvos(){

    const c=m.chamadas[t.id]||{};Object.keys(c).forEach(d=>{const f=c[d].filter(id=>t.alunos.some(a=>a.id===id)).length;
      L.push({tipo:"cham",ic:"✅",titulo:"Chamada"+(DB.modo==="aulas"?"":" – "+t.nome),det:(t.alunos.length-f)+" presentes · "+f+(f===1?" falta":" faltas"),data:d,busca:"chamada "+t.nome,acao:{a:"vercham",t:t.id,d}})});
    (m.entregas[t.id]||[]).forEach(e=>L.push({tipo:"ent",ic:"📥",titulo:e.nome,det:(nT(t)?nT(t)+" · ":"")+e.entregues.length+" entregaram",data:e.data,busca:e.nome,acao:{a:"entregas",t:t.id,id:e.id}}));
  });
  (m.mentorChat||[]).forEach(c=>{if(c.plano)L.push({tipo:"plano",ic:"🧑‍🏫",titulo:"Plano da mentora – "+(c.plano.tema||""),det:"4 pilares",data:c.data||"",busca:tirarTags(htmlPlanoMentor(c.plano)),acao:{a:"guia"}})});
  (m.avaliacoes||[]).forEach(a=>L.push({tipo:"aval",ic:"📝",titulo:a.tipo+" – "+a.materia,det:(DB.modo==="aulas"?"":nomeTurma(a.turmaId)+" · ")+a.conteudo,data:a.data,busca:[a.tipo,a.materia,a.conteudo,nomeTurma(a.turmaId)].join(" "),acao:{a:"avaliacoes",b:"bAval",q:a.materia}}));
  m.atividades.forEach(a=>L.push({tipo:"ativ",ic:"✨",titulo:a.titulo,det:IDADES[a.idade],data:a.data,busca:a.titulo+" "+tirarTags(a.html),acao:{a:"atividade",id:a.id}}));

  return L.sort((x,y)=>String(y.data).localeCompare(String(x.data)));

/* ---------- CÓPIA DE SEGURANÇA ---------- */
function salvarCopia(){
  const txt=JSON.stringify(DB),nome="aula-facil-copia-"+hojeISO()+".json";
  const arq=new File([txt],nome,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[arq]})){
    navigator.share({files:[arq],title:"Cópia do Aula Fácil",text:"Guarde este arquivo no seu e-mail ou no Drive."}).then(()=>marcarCopia()).catch(()=>baixar(arq,nome));return}
  baixar(arq,nome);
}
function baixar(arq,nome){const u=URL.createObjectURL(arq),a=document.createElement("a");a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);marcarCopia();
  toast("Cópia salva! Guarde o arquivo no seu e-mail ou no Drive.")}
function marcarCopia(){DB.ultimaCopia=hojeISO();salvar();fecharModal()}
function recuperarCopia(){
  const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.v!==1||!d.modos)throw 0;
      if(!confirm("Trocar os dados deste celular pelos da cópia de "+(d.ultimaCopia?dataBR(d.ultimaCopia):"um dia anterior")+"?"))return;
      DB=d;salvar();fecharModal();chamadaTemp=null;render();toast("Pronto! Seus dados foram recuperados.")}catch(e){toast("Este arquivo não é uma cópia do Aula Fácil.")}};r.readAsText(f)};
  i.click();
}

function pedirAvisos(){

  Notification.requestPermission().then(r=>{toast(r==="granted"?"Avisos ativados! O app avisa quando um aluno estiver perto do limite de faltas.":"Avisos não foram liberados.")});
}
function avisoCelular(titulo,corpo){
  try{if(!("Notification" in window)||Notification.permission!=="granted")return;
    if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(titulo,{body:corpo,icon:"icon-192.png"})).catch(()=>new Notification(titulo,{body:corpo}));
    else new Notification(titulo,{body:corpo});}catch(e){}
}

function copiar(txt){
  if(!txt){toast("Não há texto para copiar.");return}
  const ok=()=>toast("Copiado! Agora é só colar e enviar quando quiser.");
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,()=>copiarAntigo(txt,ok));else copiarAntigo(txt,ok);
}
function copiarAntigo(txt,ok){const t=document.createElement("textarea");t.value=txt;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){toast("Não consegui copiar.")}t.remove()}

const GRUPOS_DESENHO={animais:["gato","cachorro","cavalo","vaca","porco","galinha"],"animais da fazenda":["vaca","porco","galinha","cavalo","ovelha","pato"],fazenda:["vaca","porco","galinha","cavalo","ovelha","pato"],"animais domesticos":["gato","cachorro","peixe","passaro","coelho"],"animais domésticos":["gato","cachorro","peixe","passaro","coelho"],"animais selvagens":["leao","elefante","tartaruga","sapo","borboleta"],frutas:["macã","banana"],natureza:["arvore","flor","sol","borboleta"],"meios de transporte":["carro"]};

function acharDesenhos(texto){
  const tx=" "+norm(texto).replace(/[^a-z0-9 ]/g," ")+" ",achou=[];
  for(const k in SINONIMOS){const pos=Math.min(...SINONIMOS[k].map(s=>{const i=tx.indexOf(" "+norm(s)+" ");return i<0?1e9:i}));if(pos<1e9)achou.push([pos,k])}
  let lista=achou.sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  if(!lista.length){for(const g of Object.keys(GRUPOS_DESENHO).sort((a,b)=>b.length-a.length)){if(tx.includes(" "+norm(g)+" ")){lista=GRUPOS_DESENHO[g].slice();break}}}
  return lista.slice(0,6);
}
function svgDesenho(k){return `<svg viewBox="0 0 200 200" style="width:100%;height:auto;display:block" fill="#fff" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">${DESENHOS[k]}</svg>`}
function folhaColorir(at,textoExtra){
  const ks=acharDesenhos([at.tema,at.ideia||"",textoExtra||""].join(" "));
  if(!ks.length)return null;
  const col=ks.length===1?1:2;
  return `<div style="display:grid;grid-template-columns:repeat(${col},1fr);gap:12px;margin-top:10px">${ks.map(k=>`<div style="border:2px solid #9AA7B6;border-radius:14px;padding:8px 8px 4px;page-break-inside:avoid;text-align:center">
    <div style="max-width:${col===1?360:240}px;margin:0 auto">${svgDesenho(k)}</div><div style="font-weight:800;font-size:${col===1?24:18}px;letter-spacing:2px;margin:4px 0">${esc(NOMES_DESENHO[k]).toUpperCase()}</div></div>`).join("")}</div>`;
}

  if(m){const a=+m[1],b=Math.min(+m[2],a+29);return Array.from({length:b-a+1},(_,i)=>String(a+i))}

  if(m&&!/alfabeto|letra/.test(m[1]))return cx(m[1].trim().split(/\s+/)[0]).split("");
  if(/vogais/.test(tx))return cx("aeiou").split("");
  if(/consoantes/.test(tx))return cx("bcdfghjklmnpqrstvwxz").split("");
  m=tx.match(/letras?\s+((?:[a-z](?:\s*,\s*|\s+e\s+|\s+|$))+)/);

}

  {n:"Caixa dos sentidos",m:"Caixa de sapato, objetos seguros com texturas diferentes (esponja, pano, tampinha grande, algodão, escova)",p:["Coloque os objetos dentro da caixa com um furo para a mão.","Sente com as crianças em roda e deixe uma de cada vez colocar a mão.","Pergunte: \"É macio ou duro? Gelado ou quentinho?\"","Tire o objeto e nomeie junto com a criança."],e:"Sentidos, linguagem (novas palavras), curiosidade e coordenação das mãos."},
  {n:"Pintura com as mãos e pés",m:"Papel grande no chão (pardo ou kraft), tinta guache atóxica, pano úmido",p:["Forre o chão e deixe as crianças descalças.","Ofereça 2 ou 3 cores de cada vez.","Deixe pisar, carimbar a mão e misturar cores.","Pergunte: \"Que cor apareceu quando misturou?\""],e:"Coordenação motora grossa, percepção das cores, criatividade e autoestima."},
  {n:"Cesto do tesouro",m:"Cesto com objetos do dia a dia seguros (colher de pau, pote, chocalho, pinha, bola)",p:["Coloque o cesto no meio da roda.","Deixe explorar livremente, sem ensinar \"o jeito certo\".","Observe e narre: \"Você bateu a colher no pote e fez barulho!\"","Ao final, guardem juntos cantando."],e:"Exploração, atenção, causa e efeito, autonomia."},
  {n:"Música com movimento",m:"Músicas infantis, lenços coloridos",p:["Coloque uma música animada e balance os lenços.","Pare a música: todos \"viram estátua\".","Troque o ritmo: rápido (corre no lugar), lento (anda devagar).","Termine com uma música calma e respiração."],e:"Coordenação, escuta, autocontrole e expressão corporal."}],
 perg:["\"O que você acha que tem aqui dentro?\"","\"Como você fez isso?\"","\"E se a gente fizer de outro jeito?\"","\"Que barulho isso faz?\"","\"Onde você acha que a bolinha foi parar?\""],
 erro:"Nessa idade não existe \"erro\": existe tentativa. Se a criança empilhou e caiu, comemore a tentativa (\"Caiu! Vamos de novo?\") e mostre uma pista, sem fazer por ela.",
 disp:"Bebês e crianças pequenas prestam atenção poucos minutos. Planeje atividades curtas (5 a 10 min), mude de lugar ou de ritmo, use músicas de transição e chame pelo nome com carinho. Firmeza é rotina: sempre a mesma sequência (chegada, roda, atividade, lanche, parque).",
 rot:{ini:"Música de chegada e roda: cumprimente cada criança pelo nome (5 min).",meio:"Uma experiência sensorial ou de movimento, com a professora junto, narrando o que acontece (10 a 15 min).",fim:"Guardar juntos com música, relembrar o que fizeram com fotos ou objetos e um momento calmo (5 min)."}},
"4a6":{nome:"🧒 4 a 6 anos",
 ativ:[
  {n:"Detetives da natureza",m:"Lupa (ou tampa de garrafa como \"lupa\"), saquinho, papel e giz de cera",p:["Leve a turma ao pátio com uma missão: encontrar 3 coisas da natureza.","Cada dupla coleta folhas, pedrinhas, gravetos.","Na sala, separem por cor, tamanho e textura.","Desenhem o que acharam e contem para a turma."],e:"Observação, classificação (raciocínio lógico), cooperação e linguagem oral."},
  {n:"Mercadinho da turma",m:"Embalagens vazias, papel para dinheiro de brincadeira, cestinhas",p:["Montem juntos um \"mercado\" com as embalagens e etiquetas de preço (1 a 10).","Metade compra, metade vende; depois trocam.","O vendedor conta as moedas; o comprador confere o troco.","No fim, conversem: \"O que você precisava e o que você só queria?\""],e:"Números, educação financeira, faz de conta, comunicação e cooperação."},
  {n:"História maluca coletiva",m:"Cartões com desenhos (animal, lugar, objeto) ou figuras de revista",p:["Sorteie 3 cartões e comece: \"Era uma vez...\".","Cada criança continua a história usando um cartão.","A professora escreve no quadro ou grava no celular.","Desenhem o final que mais gostaram."],e:"Criatividade, oralidade, sequência lógica e escuta do colega."},
  {n:"Circuito de movimento",m:"Cordas, cones (ou garrafas), bambolês, almofadas",p:["Monte um percurso: pular, passar por baixo, equilibrar.","Explique com o próprio corpo, não só falando.","Cada criança faz e depois ajuda a montar um novo desafio.","Terminem com alongamento e respiração."],e:"Coordenação motora, noção de espaço, persistência e autorregulação."}],
 perg:["\"Por que você acha que isso aconteceu?\"","\"Como você descobriu?\"","\"O que aconteceria se...?\"","\"Tem outro jeito de fazer?\"","\"O que você sentiu quando...?\"","\"Como podemos resolver isso juntos?\""],
 erro:"Troque \"está errado\" por \"vamos conferir juntos?\". Peça para a criança explicar como pensou: muitas vezes ela mesma percebe. Valorize o caminho: \"Você tentou contar nos dedos, que boa ideia! Vamos contar de novo devagar?\"",
 disp:"Combine as regras com a turma (e desenhem um cartaz). Use sinais combinados (bater palmas no ritmo, música do silêncio). Ofereça escolhas (\"Quer fazer com giz ou lápis?\"). Se alguém se desconecta, dê uma tarefa especial (ajudante do dia). Seja firme e gentil: \"Eu entendo que você quer brincar agora. Primeiro terminamos aqui, depois vamos ao parque.\"",
 rot:{ini:"Roda de conversa com uma pergunta curiosa ou um objeto misterioso para despertar a vontade de saber (10 min).",meio:"Atividade mão na massa em grupos pequenos; a professora circula fazendo perguntas, sem dar respostas prontas (20 min).",fim:"Cada grupo mostra o que fez; perguntem \"O que aprendemos hoje?\" e registrem com desenho (10 min)."}},
"7a10":{nome:"📚 7 a 10 anos",

  {n:"Jornal da turma",m:"Folhas, canetinhas, celular para fotos (opcional)",p:["Divida a turma em \"redação\": repórteres, fotógrafos, desenhistas, editores.","Cada grupo escolhe uma notícia da escola ou do bairro.","Façam entrevistas, escrevam e revisem juntos.","Montem o jornal e leiam para outra turma."],e:"Leitura, escrita com sentido, argumentação, cooperação e responsabilidade."},
  {n:"Matemática do lanche",m:"Folheto de mercado ou cardápio de lanchonete, dinheiro de brincadeira",p:["Cada grupo tem um valor (ex.: R$ 30) para montar o lanche da turma.","Escolhem itens, somam, conferem se dá e calculam o troco.","Apresentam as escolhas e justificam.","Discutam: qual grupo economizou mais? Como?"],e:"Operações, estimativa, educação financeira, tomada de decisão."},
  {n:"Debate do bem",m:"Uma pergunta polêmica leve (\"Devemos ter dever de casa?\")",p:["Divida em dois grupos (a favor e contra), por sorteio.","Cada grupo prepara 3 argumentos.","Debatam com regras: falar na sua vez, respeitar o colega.","No fim, cada um diz se mudou de ideia e por quê."],e:"Pensamento crítico, oralidade, escuta respeitosa e empatia."}],
 perg:["\"Como você chegou a essa resposta?\"","\"Você consegue explicar para um colega?\"","\"Que provas você tem disso?\"","\"O que você faria diferente?\"","\"Onde isso aparece na sua vida?\"","\"Qual foi a parte mais difícil e como você venceu?\""],
 erro:"Use o erro como material de aula: copie no quadro (sem o nome) e pergunte à turma \"Onde está o pulo do gato aqui?\". Mostre que todo cientista erra antes de acertar. Peça para o aluno corrigir o próprio erro explicando o que mudou.",
 disp:"Varie o formato a cada 15 a 20 minutos (explicação, dupla, movimento). Dê papéis nos grupos (líder do tempo, redator, porta-voz). Converse em particular com quem está desligado: \"Percebi que você não está bem hoje. Como posso te ajudar?\" Combine consequências claras e cumpra sempre, com calma.",
 rot:{ini:"Desafio ou pergunta-problema ligada ao dia a dia dos alunos e retomada do que já sabem (10 min).",meio:"Investigação em grupos com papéis definidos; o professor faz perguntas e dá pistas (25 min).",fim:"Socialização dos grupos, registro individual (\"o que aprendi\") e uma pergunta para a próxima aula (10 min)."}},

  {n:"Projeto que resolve um problema real",m:"Papel, cartolina ou celular",p:["Os alunos escolhem um problema da escola ou do bairro (lixo, desperdício, segurança).","Pesquisam causas e pensam em soluções.","Criam um protótipo, campanha ou cartaz.","Apresentam para a turma ou para a direção."],e:"Protagonismo, pensamento crítico, criatividade, cidadania e projeto de vida."},
  {n:"Júri simulado",m:"Um caso para discutir (histórico, científico ou ético)",p:["Divida em acusação, defesa, testemunhas e júri.","Cada grupo pesquisa e prepara argumentos com provas.","Façam o julgamento com tempo para cada fala.","O júri decide e explica o motivo."],e:"Argumentação, pesquisa, oratória, ética e respeito a opiniões diferentes."},
  {n:"Gincana do conhecimento",m:"Perguntas no celular ou em cartões, placar no quadro",p:["Monte equipes misturando perfis.","Use perguntas de níveis diferentes e desafios práticos.","Cada equipe pode \"pedir ajuda\" uma vez a outra equipe.","No fim, revisem as perguntas mais erradas."],e:"Revisão divertida, cooperação, raciocínio rápido e motivação."}],
 perg:["\"Você concorda? Por quê?\"","\"Qual é o outro lado dessa história?\"","\"Como você provaria isso?\"","\"Onde isso se aplica no mundo real?\"","\"O que você faria se estivesse no lugar dele?\"","\"Qual a sua opinião e em que você se baseia?\""],
 erro:"Adolescentes têm medo de errar na frente dos outros. Corrija em particular ou de forma coletiva e anônima. Diga \"esse erro é comum e mostra que você está pensando\". Peça para revisarem os próprios trabalhos com uma lista de critérios.",

 rot:{ini:"Gancho: notícia, vídeo curto, pergunta polêmica ou situação real (10 min).",meio:"Desafio em grupo ou projeto com entrega concreta; o professor orienta e provoca (30 min).",fim:"Apresentação rápida, autoavaliação e conexão com a vida ou com a próxima aula (10 min)."}},

  {n:"Roda de conversa com tema",m:"Uma notícia, música ou imagem",p:["Apresente o material e pergunte o que cada um pensa.","Anote as palavras-chave que surgirem.","Usem essas palavras para ler, escrever ou calcular.","Fechem com uma frase de cada um sobre o tema."],e:"Expressão, pensamento crítico, vocabulário e sentimento de pertencimento."},
  {n:"Desafio em dupla",m:"Problema prático impresso",p:["Forme duplas com níveis diferentes.","Um explica, o outro confere; depois invertem.","Compartilhem estratégias diferentes para o mesmo problema.","Registrem a melhor estratégia no caderno."],e:"Cooperação, metacognição (pensar sobre como pensa) e confiança."}],

const CHECKLIST=["Os alunos falaram mais do que eu? Eles perguntaram, testaram e explicaram?","Fiz perguntas abertas, em vez de só dar respostas prontas?","Todos participaram, inclusive os mais tímidos e os que têm mais dificuldade?","O que foi ensinado tem ligação com a vida real dos alunos?","Os alunos sabem dizer o que aprenderam hoje (e eu sei como vou continuar na próxima aula)?"];
function htmlGuia(k){const g=GUIA[k];
  return `<h3 style="margin-top:6px">1️⃣ Atividades mão na massa</h3>${g.ativ.map(a=>`<div class="card guia-item" data-busca="${esc(a.n+" "+a.m+" "+a.p.join(" ")+" "+a.e)}"><h3>🎯 ${esc(a.n)}</h3><p><b>Material:</b> ${esc(a.m)}</p><b>Como aplicar:</b><ol>${a.p.map(x=>"<li>"+esc(x)+"</li>").join("")}</ol><p class="ajuste" style="margin:8px 0 0"><b>O que estimula:</b> ${esc(a.e)}</p></div>`).join("")}
  <h3>2️⃣ O jeito certo de conduzir a aula</h3>
  <div class="card guia-item" data-busca="perguntas abertas ${esc(g.perg.join(" "))}"><h3>❓ Perguntas abertas que fazem pensar</h3><ul>${g.perg.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div>
  <div class="card guia-item" data-busca="erro errar ${esc(g.erro)}"><h3>🌱 Quando o aluno erra</h3><p>${esc(g.erro)}</p></div>
  <div class="card guia-item" data-busca="dispersão desinteresse bagunça disciplina ${esc(g.disp)}"><h3>🧭 Dispersão e falta de interesse</h3><p>${esc(g.disp)}</p></div>
  <h3>3️⃣ Roteiro de uma aula engajadora</h3>
  <div class="card guia-item" data-busca="roteiro aula início meio fim ${esc(g.rot.ini+" "+g.rot.meio+" "+g.rot.fim)}"><p><b>🟢 Início:</b> ${esc(g.rot.ini)}</p><p><b>🟡 Meio:</b> ${esc(g.rot.meio)}</p><p><b>🔵 Fim:</b> ${esc(g.rot.fim)}</p></div>
  <h3>4️⃣ Checklist do bom professor</h3>
  <div class="card guia-item" data-busca="checklist avaliar ${esc(CHECKLIST.join(" "))}">${CHECKLIST.map(x=>`<label style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px"><input type="checkbox" style="width:22px;height:22px;flex:none"> <span>${esc(x)}</span></label>`).join("")}</div>`;
}

/* ============ MENTORA DO PROFESSOR (conversa com IA + voz) ============ */
const FAIXAS={"1a3":"1 a 3 anos","4a6":"4 a 6 anos","7a10":"7 a 10 anos",adol:"adolescentes (11 a 17 anos)",adul:"adultos (EJA, alfabetização, aula particular)"};
let guiaAba="mentora",guiaFaixa=null;
function faixaPadrao(){return DB.mentorFaixa||(DB.modo==="particular"?"4a6":DB.modo==="aulas"?"7a10":"7a10")}
function vozFeminina(){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const pt=vs.filter(v=>/^pt(-|_)BR/i.test(v.lang)||/portugu[eê]s.*brasil/i.test(v.name));
  return pt.find(v=>/luciana|francisca|maria|vit[oó]ria|camila|female|feminin|google português do brasil/i.test(v.name))||pt[0]||vs.find(v=>/^pt/i.test(v.lang))||null}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
function falarTexto(txt){try{if(!window.speechSynthesis||DB.vozMentora===false)return;speechSynthesis.cancel();
  const limpo=String(txt).replace(/<[^>]+>/g," ").replace(/[*#_>`]/g,"").replace(/https?:\S+/g,"").slice(0,2500);
  const partes=limpo.match(/[^.!?\n]+[.!?]?/g)||[limpo];const v=vozFeminina();
  partes.forEach(f=>{const u=new SpeechSynthesisUtterance(f.trim());u.lang="pt-BR";if(v)u.voice=v;u.rate=1.02;u.pitch=1.05;speechSynthesis.speak(u)});}catch(e){}}
function pararVoz(){try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}
function chatMentora(){const m=M();if(!m.mentorChat)m.mentorChat=[];return m.mentorChat}
function htmlPlanoMentor(r){const arr=x=>Array.isArray(x)?x.filter(Boolean):[];
  return `<div><b>📋 Plano nos 4 pilares${r.tema?" – "+esc(r.tema):""}</b>
  <h4 style="margin:10px 0 4px">1️⃣ Atividades mão na massa</h4>${arr(r.atividades).map(a=>`<div style="margin-bottom:8px"><b>🎯 ${esc(a.nome||"")}</b><br><i>Material:</i> ${esc(a.material||"")}<ol style="margin:4px 0">${arr(a.passos).map(x=>"<li>"+esc(x)+"</li>").join("")}</ol><i>Estimula:</i> ${esc(a.estimula||"")}</div>`).join("")}
  <h4 style="margin:10px 0 4px">2️⃣ Como conduzir</h4><b>Perguntas abertas:</b><ul style="margin:4px 0">${arr(r.perguntas).map(x=>"<li>"+esc(x)+"</li>").join("")}</ul><b>Quando o aluno erra:</b> ${esc(r.erro||"")}<br><b>Dispersão:</b> ${esc(r.dispersao||"")}
  <h4 style="margin:10px 0 4px">3️⃣ Roteiro da aula</h4>🟢 <b>Início:</b> ${esc((r.roteiro||{}).inicio||"")}<br>🟡 <b>Meio:</b> ${esc((r.roteiro||{}).meio||"")}<br>🔵 <b>Fim:</b> ${esc((r.roteiro||{}).fim||(r.roteiro||{}).fundo||(r.roteiro||{}).final||"")}
  <h4 style="margin:10px 0 4px">4️⃣ Checklist</h4><ul style="margin:4px 0">${arr(r.checklist).map(x=>"<li>☐ "+esc(x)+"</li>").join("")}</ul></div>`}
function telaGuia(el){
  const fx=guiaFaixa||faixaPadrao();
  el.innerHTML=`<h2>🧑‍🏫 Mentora do Professor</h2><p class="sub">Converse por voz ou por escrita sobre a sua aula, ou consulte o guia com ideias prontas.</p>
  <div class="seg"><button data-ga="mentora" class="${guiaAba==="mentora"?"on":""}">💬 Conversar</button><button data-ga="guia" class="${guiaAba==="guia"?"on":""}">📘 Guia</button></div>
  <div class="chips">${Object.keys(FAIXAS).map(k=>`<button data-fx="${k}" class="${fx===k?"on":""}">${GUIA[k].nome}</button>`).join("")}</div>
  <div id="guiaCorpo"></div>`;
  el.querySelectorAll("[data-ga]").forEach(b=>b.onclick=()=>{guiaAba=b.dataset.ga;pararVoz();render()});
  el.querySelectorAll("[data-fx]").forEach(b=>b.onclick=()=>{guiaFaixa=b.dataset.fx;DB.mentorFaixa=b.dataset.fx;salvar();render()});
  const C=$("#guiaCorpo");
  if(guiaAba==="guia"){
    C.innerHTML=`${campoBusca("bGuia","Buscar no guia (ex.: erro, dispersão, perguntas, música)")}<div class="linha-btns" style="margin-bottom:12px"><button class="btn btn-sec" id="impGuia">🖨️ Imprimir</button><button class="btn btn-sec" id="ouvGuia">🔊 Ouvir</button></div><div id="gConteudo">${htmlGuia(fx)}</div>`;
    ligarBusca("bGuia","#gConteudo .guia-item");
    $("#impGuia").onclick=()=>imprimir(`<h2>Guia do Bom Professor – ${esc(GUIA[fx].nome)}</h2>`+htmlGuia(fx).replace(/<input[^>]*>/g,"☐"));
    $("#ouvGuia").onclick=()=>{if(DB.vozMentora===false){DB.vozMentora=true;salvar()}falarTexto($("#gConteudo").innerText)};
    return;
  }
  const ch=chatMentora();
  C.innerHTML=`<div class="chat" id="chat">${ch.length?"":`<div class="bolha ia">Olá, professora! 👋 Sou a sua mentora. Me conte sobre a sua turma ou a aula que você vai dar, e eu te ajudo com ideias práticas. Pode falar no 🎙️ ou escrever.<div class="sug">${["Minha turma está muito agitada, o que eu faço?","Ideias para ensinar frações de um jeito divertido","Como ajudar um aluno que não quer participar?","Uma aula sobre o ciclo da água mão na massa"].map(s=>`<button class="chip-sug">${s}</button>`).join("")}</div></div>`}
    ${ch.map((c,i)=>`<div class="bolha ${c.de==="prof"?"eu":"ia"}">${c.plano?htmlPlanoMentor(c.plano):esc(c.txt).replace(/\n/g,"<br>")}${c.de==="ia"?`<div class="acoes-bolha"><button data-ouvir="${i}">🔊 Ouvir</button><button data-copiar="${i}">📋 Copiar</button>${c.plano?`<button data-impplano="${i}">🖨️ Imprimir</button>`:""}</div>`:""}</div>`).join("")}</div>
  <div class="caixa-chat">
    <textarea id="msgM" placeholder="Escreva ou toque em 🎙️ para falar com a mentora"></textarea>
    <div class="linha-btns" style="margin-top:8px">${micBtn("#msgM")}<button class="btn btn-pri" id="envM">➤ Enviar</button></div>
    <div class="linha-btns" style="margin-top:8px"><button class="btn btn-ama" id="planoM">📋 Montar plano nos 4 pilares</button></div>
    <div class="linha-btns" style="margin-top:8px"><button class="btn btn-sec" id="vozM">${DB.vozMentora===false?"🔇 Voz desligada":"🔊 Voz ligada"}</button><button class="btn btn-sec" id="pararM">⏹️ Parar de falar</button><button class="btn btn-sec" id="limparM">🧹 Nova conversa</button></div>
    <p class="privac">🔒 Não coloque nomes de alunos na conversa. A mentora é uma IA: confira as ideias antes de usar.</p>
  </div>`;
  ligarMics(C);
  const ch2=$("#chat");ch2.scrollTop=ch2.scrollHeight;
  C.querySelectorAll(".chip-sug").forEach(b=>b.onclick=()=>{$("#msgM").value=b.textContent;enviarMentora()});

  });

/* ============ MICROFONE (falar em vez de digitar) ============ */
let ditadoAtivo=null;
function micBtn(alvo){return `<button type="button" class="btn-mic" data-mic='${alvo}' aria-label="Falar em vez de escrever">👩‍🏫🎙️ Falar</button>`}
function ligarMics(raiz){(raiz||document).querySelectorAll("[data-mic]").forEach(b=>b.onclick=e=>{e.preventDefault();ditar(b,document.querySelector(b.dataset.mic))})}
// Termina o ditado na hora (não espera o celular), e só uma vez
function finalizarDitado(st,avisar){
  if(!st||st.fim)return;st.fim=true;
  try{st.rec.onresult=null;st.rec.onend=null;st.rec.onerror=null;st.rec.stop()}catch(e){}
  setTimeout(()=>{try{st.rec.abort()}catch(e){}},300);
  st.btn.classList.remove("ouvindo");st.btn.innerHTML=st.rotulo;
  const txt=[st.base,st.final,st.parcial].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
  st.alvo.value=txt;st.alvo.dispatchEvent(new Event("input"));
  if(ditadoAtivo===st)ditadoAtivo=null;
  if(avisar&&(st.final||st.parcial))toast("Pronto! Confira o que ficou escrito.");
}
function comoDitarTeclado(){
  const ua=navigator.userAgent;
  if(/iphone|ipad|ipod/i.test(ua))return `<b>No iPhone:</b><ol><li>Toque no campo onde quer escrever.</li><li>No teclado, toque no <b>microfone 🎤</b>, que fica <b>embaixo, à direita</b> (perto do espaço).</li><li>Fale normalmente. Para terminar, toque no ⌨️ ou no microfone de novo.</li></ol>`;
  if(/android/i.test(ua))return `<b>No Android:</b><ol><li>Toque no campo onde quer escrever.</li><li>No teclado, procure o <b>microfone 🎤</b>:<br>• teclado do Google (Gboard): fica <b>no alto, à direita</b>, acima das letras;<br>• teclado da Samsung: fica <b>no alto</b> (ou segure a tecla da <b>vírgula</b> e escolha o 🎤).</li><li>Fale normalmente. O texto aparece sozinho.</li></ol>`;
  if(/mac/i.test(ua))return `<b>No Mac:</b><ol><li>Clique no campo onde quer escrever.</li><li>Aperte <b>duas vezes a tecla Fn</b> (ou a tecla 🌐).</li><li>Fale normalmente. Para terminar, aperte Fn de novo.</li></ol>`;
  return `<b>No computador (Windows):</b><ol><li>Clique no campo onde quer escrever.</li><li>Aperte as teclas <b>Windows + H</b> juntas.</li><li>Vai aparecer um microfone azul: fale normalmente. Para pontuar, fale "vírgula", "ponto" ou "ponto de interrogação".</li></ol>`;
}
function ajudaMicrofone(bloqueado){
  $("#toast").classList.remove("on");clearTimeout(toast._t);
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),inst=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  const passos=ios?`<ol><li>Abra o app <b>Ajustes</b> do iPhone (a engrenagem cinza).</li><li>Desça e toque em <b>Safari</b>.</li><li>Toque em <b>Microfone</b> e escolha <b>Perguntar</b> ou <b>Permitir</b>.</li><li>Volte ao Aula Fácil e toque em <b>Falar</b> de novo.</li></ol>`
    :inst?`<ol><li>Saia do Aula Fácil e <b>segure o dedo no ícone</b> dele na tela do celular.</li><li>Toque em <b>"Informações do app"</b> (ou no ⓘ).</li><li>Toque em <b>Permissões</b> → <b>Microfone</b> → <b>Permitir</b>.</li><li>Abra o Aula Fácil de novo e toque em <b>Falar</b>.</li></ol>`
    :`<ol><li>Lá em cima, ao lado do endereço do site, toque no <b>cadeado 🔒</b> (ou no ícone de ajustes).</li><li>Toque em <b>Permissões</b> (ou "Configurações do site").</li><li>Em <b>Microfone</b>, escolha <b>Permitir</b>.</li><li>Toque em <b>Falar</b> de novo.</li></ol>`;
  abrirModal(`<h3>🎙️ O microfone está bloqueado</h3><p>${bloqueado?"O celular não deixou o app usar o microfone.":""} Você pode liberar assim:</p>${passos}
  <div class="ajuste" style="margin-top:10px"><b>Mais fácil:</b> falar pelo próprio teclado, que funciona sem liberar nada.<br><br>${comoDitarTeclado()}</div>
  <button class="btn btn-pri btn-bloco" style="margin-top:12px" onclick="fecharModal()">Entendi</button>`);
}
function pararDitado(){if(ditadoAtivo)finalizarDitado(ditadoAtivo,false)}
function ditar(btn,alvo){
  if(!alvo)return;
  if(!DB.micAvisado&&!(ditadoAtivo&&ditadoAtivo.btn===btn)){
    abrirModal(`<div style="text-align:center"><div style="font-size:52px">👩‍🏫🎙️</div><h3>Falar em vez de escrever</h3>
    <p>Agora o celular vai perguntar se o Aula Fácil pode usar o microfone.</p>
    <p style="background:var(--verde-l);color:var(--verde);border-radius:14px;padding:12px;font-weight:800">Toque em "Permitir" ✅</p>
    <p class="sub">O app só ouve enquanto o botão estiver vermelho 🔴. Nada é gravado nem guardado.</p>
    <button class="btn btn-pri btn-bloco" id="micOk">Entendi, quero falar</button></div>`,()=>{$("#micOk").onclick=()=>{DB.micAvisado=true;salvar();fecharModal();ditar(btn,alvo)}});
    return}
  if(ditadoAtivo&&ditadoAtivo.btn===btn){finalizarDitado(ditadoAtivo,true);return}   // 2º toque: para na hora
  pararDitado();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){abrirModal(`<h3>🎙️ Falar em vez de escrever</h3><p>Aqui o app não consegue ouvir direto, mas dá para falar pelo próprio teclado:</p>${comoDitarTeclado()}
    <button class="btn btn-pri btn-bloco" onclick="fecharModal()">Entendi</button>`);return}
  if(!navigator.onLine){toast("Para ouvir sua voz o celular precisa de internet. Use o microfone do teclado.");return}
  const rec=new SR();rec.lang="pt-BR";rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;
  const st={rec,btn,alvo,base:alvo.value.trim(),final:"",parcial:"",rotulo:btn.innerHTML,fim:false};
  ditadoAtivo=st;btn.classList.add("ouvindo");btn.innerHTML="🔴 Ouvindo… toque para parar";
  rec.onresult=ev=>{if(st.fim)return;let fin="",par="";
    for(let i=0;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=" "+r[0].transcript;else par+=" "+r[0].transcript}
    st.final=fin.trim();st.parcial=par.trim();
    alvo.value=[st.base,st.final,st.parcial].filter(Boolean).join(" ").replace(/\s+/g," ");};
  rec.onerror=ev=>{if(st.fim)return;
    if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){finalizarDitado(st,false);ajudaMicrofone(true);return}
    else if(ev.error==="no-speech")toast("Não ouvi nada. Toque em Falar e fale perto do celular.");
    else if(ev.error!=="aborted")toast("Não consegui ouvir. Tente de novo.");
    finalizarDitado(st,false)};
  rec.onend=()=>finalizarDitado(st,true);           // para sozinho quando ela termina de falar
  setTimeout(()=>{if(!st.fim)finalizarDitado(st,true)},60000); // segurança: no máximo 1 minuto
  try{rec.start();toast("Pode falar 🙂 Quando terminar, é só parar de falar ou tocar no botão.")}catch(e){finalizarDitado(st,false)}
}

/* ============ IA DE VERDADE (via Apps Script) ============ */
function pedirIA(dados){
  if(!IA_URL||IA_URL.indexOf("http")!==0)return Promise.resolve(null);
  if(!navigator.onLine){toast("Sem internet: usei um modelo pronto.");return Promise.resolve(null)}
  const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),45000);
  return fetch(IA_URL,{method:"POST",body:JSON.stringify(dados),signal:ctrl.signal})
    .then(r=>r.json()).then(d=>{if(d&&d.ok)return d.resultado;toast((d&&d.mensagem)||"A IA não respondeu. Usei um modelo pronto.");return null})
    .catch(()=>{toast("A IA não respondeu agora. Usei um modelo pronto.");return null}).finally(()=>clearTimeout(tm));
}
function atividadeIA(at,r){
  if(!r||typeof r!=="object")throw 0;
  const tit=r.titulo||(TIPOS[at.tipo]+" – "+at.tema),semPal=!String(at.pal||"").trim(),arr=x=>Array.isArray(x)?x.filter(Boolean):[];
  if(at.tipo==="caca"||at.tipo==="cruz"||at.tipo==="ditado"){
    const pal=arr(r.palavras);if(semPal&&pal.length)at.pal=pal.join(", ");
    if(at.tipo==="cruz"){at.dicas={};const d=arr(r.dicas);(semPal?pal:at.pal.split(/[,;]+/)).forEach((w,i)=>{if(d[i])at.dicas[semAcento(String(w).trim()).toUpperCase().replace(/[^A-Z]/g,"")]=d[i]})}
    return gerarAtividade(at);
  }
  if(at.tipo==="ligue"){const pr=arr(r.pares).filter(p=>Array.isArray(p)&&p.length>=2);if(semPal&&pr.length)at.pal=pr.map(p=>p[0]+"="+p[1]).join(", ");return gerarAtividade(at)}
  const t=esc(at.tema),inf=at.idade==="inf",inst=r.instrucao?`<p>${esc(r.instrucao)}</p>`:"";
  let corpo="";
  if(at.tipo==="colorir"){const fc=folhaColorir(at,JSON.stringify(r));corpo=fc?`<p>Pinte os desenhos bem bonito! 🖍️</p>`+fc:(inst||`<p>Pinte os desenhos bem bonito! 🖍️</p>`)+desenhoColorir(at.tema)+linhas(2)}
  else if(at.tipo==="desenho")corpo=inst+`<div style="border:2px solid #9AA7B6;border-radius:12px;height:${inf?340:260}px;margin-bottom:14px"></div>`+arr(r.questoes).map(q=>`<p>${esc(q.enunciado)}</p>`+linhas(q.linhas||1)).join("");
  else if(at.tipo==="texto")corpo=inst+arr(r.questoes).map(q=>`<p>${esc(q.enunciado)}</p>`).join("")+(inf?`<div style="border:2px solid #9AA7B6;border-radius:12px;height:300px"></div>`:`<p>Título: ________________________________</p>`+linhas({f1:10,f2:16,em:28,ad:12}[at.idade]||12));
  else{
    const qs=arr(r.questoes);if(!qs.length)throw 0;
    corpo=(at.tipo==="prova"?`<div class="cabec">Turma: __________ &nbsp; Nota: ______</div>`:"")+inst+`<ol>${qs.map(q=>{const alt=arr(q.alternativas);
      const n=typeof q.linhas==="number"?Math.min(q.linhas,6):(alt.length||inf?0:2);
      const desenho=/desenh/i.test(q.enunciado||"")&&!alt.length;
      return `<li>${at.tipo==="vf"?"( &nbsp; ) ":""}${esc(q.enunciado||"")}${desenho?`<div style="border:2px solid #9AA7B6;border-radius:12px;height:200px;margin-top:8px"></div>`:""}${alt.length?`<div style="margin-top:6px">${alt.map((x,i)=>`<div>${"abcdef"[i]}) ${esc(x)}</div>`).join("")}</div>`:""}${n?linhas(n):""}</li>`}).join("")}</ol>`;
    if(at.tipo==="tarefa")corpo+=`<p style="margin-top:14px">Assinatura do responsável: ______________________________</p>`;
  }
  const gab=at.tipo==="colorir"?[]:arr(r.respostas);
  return cabecalho(at,tit)+corpo+(gab.length?`<div class="so-tela" style="margin-top:16px;border-top:2px dashed #9AA7B6;padding-top:10px;color:#5D6B7E;font-size:13px"><b>Gabarito (só a professora vê, não sai na impressão):</b><ol>${gab.map(x=>"<li>"+esc(x)+"</li>").join("")}</ol></div>`:"");
}

const linhas=n=>Array.from({length:n},()=>`<div class="linhas"></div>`).join("");
function gerarAtividade(at){
