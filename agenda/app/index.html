<style>
:root{--navy:#0E2238;--navy2:#16304F;--sky:#8EC5E8;--sun:#F2C230;--bg:#EEF2F7;--ink:#0E2238;--ink2:#4A5B75;--mute:#7B8BA3;--line:#D6DFEA;
--ok:#1F8A5B;--okbg:#E3F4EC;--warn:#B7791F;--warnbg:#FBF0D9;--bad:#C0392B;--badbg:#FBE4E1;--blue:#2B6CB0;--bluebg:#E2EEFA;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
/* abertura padrão DayIA */
#intro{position:fixed;inset:0;z-index:99;background:var(--navy);display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#intro.fim{opacity:0;pointer-events:none}
.quadro{width:76px;height:76px;background:#fff;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:cresce 1.4s cubic-bezier(.2,.8,.2,1) forwards}
.quadro img{width:100%;height:100%;display:block;border-radius:10px}
@keyframes cresce{0%{transform:scale(.6) rotate(0);opacity:0}20%{opacity:1}55%{transform:scale(1.6) rotate(0)}100%{transform:scale(1.6) rotate(360deg)}}
.by{position:absolute;display:flex;align-items:center;gap:10px;font-size:22px;color:#CFE2F2;opacity:0;transition:opacity .45s}
.by img{height:40px;width:auto;display:block}
#intro.passo2 .quadro{opacity:0;transition:opacity .3s}
#intro.passo2 .by{opacity:1}

header.top{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{margin:0;font-size:18px;font-stretch:112%;font-weight:800}
.by2{display:flex;align-items:center;gap:6px;color:#B9CCE2;font-size:13px}
.by2 img{height:20px}
.modos{margin-left:auto;display:flex;gap:4px;background:var(--navy2);padding:4px;border-radius:12px;flex-wrap:wrap}
.modos button{background:transparent;border:0;color:#B9CCE2;font-weight:700;font-size:13px;padding:7px 12px;border-radius:9px;cursor:pointer}
.modos button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.dica{background:var(--warnbg);color:#7A5410;font-size:13.5px;padding:8px 16px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.dica label{display:flex;align-items:center;gap:8px;font-weight:700}
.dica select{border:1px solid #E6CF9A;border-radius:8px;padding:5px 8px;background:#fff;font-weight:700;color:var(--navy)}
.dica button{background:#fff;border:1px solid #E6CF9A;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:#7A5410}

.palco{display:grid;grid-template-columns:420px 1fr;min-height:calc(100vh - 100px)}
.palco.so-cli{grid-template-columns:1fr}.palco.so-neg{grid-template-columns:1fr}
.lado{min-width:0;display:flex;flex-direction:column}
.lado+.lado{border-left:4px solid var(--navy)}
.rot{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px}
.rot.cli{background:#DCEBF7;color:#1C4A75}.rot.neg{background:#0B1A2C;color:var(--sun)}
.cont{padding:16px;flex:1;min-width:0}
.so-cli #cli{max-width:520px;margin:0 auto;width:100%}

.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:16px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:19px;font-stretch:110%}
.card h3{margin:0 0 8px;font-size:15px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;font-size:14.5px}
.pri{background:var(--navy);color:#fff}.sol{background:var(--sun);color:var(--navy)}.sec{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.okb{background:var(--ok);color:#fff}.badb{background:#fff;border:1.5px solid #E8B4AE;color:var(--bad)}.wa{background:#25D366;color:#073B1E}
.min{padding:6px 10px;font-size:13px}.larg{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-bad{background:var(--badbg);color:var(--bad)}.t-blue{background:var(--bluebg);color:var(--blue)}.t-mute{background:#EEF2F7;color:var(--ink2)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink2)}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:400;color:var(--ink);background:#fff;min-width:0;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.vazio{color:var(--mute);text-align:center;padding:24px 10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:70;max-width:92vw;text-align:center}

/* ----- cliente ----- */
.vitrine{background:linear-gradient(135deg,var(--navy),#1E4470);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
.vitrine h2{margin:0;font-size:22px;font-stretch:112%}
.vitrine p{margin:4px 0 0;color:#CFE2F2;font-size:13.5px}
.vitrine .lin{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.vitrine .lin a{color:#fff;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 11px;font-size:13px;text-decoration:none;font-weight:700}
.passos{display:flex;gap:4px;margin:0 0 12px}
.passos i{flex:1;height:5px;border-radius:9px;background:#D6DFEA}
.passos i.on{background:var(--sun)}
.opc{display:flex;flex-direction:column;gap:8px}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.op:hover{border-color:var(--sky)}
.op .bol{width:12px;height:12px;border-radius:50%;flex:none}
.op b{display:block}
.op small{color:var(--mute)}
.op .pr{margin-left:auto;font-weight:800;white-space:nowrap}
.av{width:38px;height:38px;border-radius:50%;background:var(--bluebg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.dias{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.dia{flex:none;width:62px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 0;text-align:center;cursor:pointer}
.dia small{display:block;font-size:11.5px;color:var(--mute);text-transform:uppercase;font-weight:700}
.dia b{display:block;font-size:20px}
.dia[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.dia[aria-pressed="true"] small{color:#B9CCE2}
.dia:disabled{opacity:.35;cursor:default}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:12px}
.hora{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;font-weight:800;cursor:pointer}
.hora:hover{border-color:var(--navy)}
.hora[aria-pressed="true"]{background:var(--sun);border-color:var(--sun)}
.resumo{background:#F7FAFD;border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
.resumo div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.resumo span{color:var(--mute)}
.voltar{background:none;border:0;color:var(--ink2);font-weight:700;cursor:pointer;padding:0;margin-bottom:8px}
.feito{text-align:center}
.feito .ic{font-size:44px}
.meu{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meu b{display:block}

/* ----- negócio ----- */
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.kp b{display:block;font-size:22px;line-height:1.15}
.kp span{font-size:12.5px;color:var(--mute)}
.abas{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.abas button{flex:none;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink2)}
.abas button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.barraDia{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.barraDia h3{margin:0 8px 0 0;font-size:17px}
.grade{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:calc(100vh - 290px);min-height:360px}
.gtab{display:grid;position:relative;min-width:520px}
.gcab{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1.5px solid var(--line);padding:8px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px;min-width:0}
.gcab .av{width:28px;height:28px;font-size:12px}
.ghora{font-size:11.5px;color:var(--mute);text-align:right;padding-right:6px;border-right:1px solid var(--line);position:relative}
.ghora span{position:relative;top:2px}
.gcol{position:relative;border-right:1px solid #EEF2F7}
.gcol .lin{position:absolute;left:0;right:0;border-top:1px solid #EEF2F7}
.gcol .lin.meia{border-top-style:dashed;opacity:.6}
.gcol .livre{position:absolute;left:0;right:0;cursor:pointer;z-index:1}
.gcol .livre:hover{background:rgba(142,197,232,.18)}
.gcol .fecha{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#F3F5F9,#F3F5F9 6px,#E9EDF3 6px,#E9EDF3 12px);z-index:1}
.ag{position:absolute;left:4px;right:4px;border-radius:9px;padding:4px 7px;font-size:12.5px;line-height:1.25;overflow:hidden;cursor:pointer;z-index:2;border-left:4px solid;box-shadow:0 1px 2px rgba(0,0,0,.08);text-align:left;border-top:0;border-right:0;border-bottom:0}
.ag b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag small{display:block;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag.cancelado{opacity:.45;text-decoration:line-through}
.ag.faltou{background:repeating-linear-gradient(45deg,#FBE4E1,#FBE4E1 5px,#fff 5px,#fff 10px)!important}
.ag.novo{animation:chega 1.2s ease 3}
@keyframes chega{40%{box-shadow:0 0 0 4px var(--sun)}}
.agora{position:absolute;left:0;right:0;border-top:2px solid var(--bad);z-index:2;pointer-events:none}
.agora::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.lista .it{display:flex;gap:12px;align-items:center;border-bottom:1px solid #EEF2F7;padding:10px 0;flex-wrap:wrap}
.lista .it:last-child{border-bottom:0}
.lista .hr{font-weight:800;width:52px}
.lista .it .info{flex:1;min-width:160px}
.lista .it .info small{color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1.5px solid var(--line)}
td{padding:8px;border-bottom:1px solid #EEF2F7;vertical-align:middle}
.tabela{overflow-x:auto}
.barras .b{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin:6px 0;font-size:13.5px}
.barras .b i{display:block;height:12px;border-radius:6px;background:var(--sky)}
.barras .b span{text-align:right;font-weight:700}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal{position:fixed;inset:0;z-index:90;background:rgba(14,34,56,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:700px){.modal{align-items:center}}
.modal .card{width:min(520px,100%);max-height:90vh;overflow:auto;margin:0}
.det div.l{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #EEF2F7;font-size:14px}
.det div.l span{color:var(--mute)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.aviso{position:fixed;right:18px;bottom:18px;z-index:60;width:min(360px,92vw);background:#0B1A2C;color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.35);border:2px solid var(--sun);animation:entra .35s ease}
@keyframes entra{from{transform:translateY(30px);opacity:0}}
.aviso b{color:var(--sun);display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.aviso p{margin:4px 0 10px;font-size:15px}
.cfg .lin{display:grid;grid-template-columns:1fr 90px 100px 34px;gap:8px;align-items:center;margin-bottom:8px}
.cfg .lin input{border:1.5px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0;width:100%}
.cfg .x{background:none;border:0;color:var(--bad);font-size:18px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{display:flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.link{display:flex;gap:8px}
.link input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#F7FAFD}

@media (max-width:1100px){.palco{grid-template-columns:1fr}.lado+.lado{border-left:0;border-top:4px solid var(--navy)}}
@media (max-width:640px){.kp{grid-template-columns:repeat(2,1fr)}.duas{grid-template-columns:1fr}.barras .b{grid-template-columns:100px 1fr 74px}.cont{padding:12px}header.top h1{font-size:16px}.cfg .lin{grid-template-columns:1fr 70px 80px 30px}}
@media (prefers-reduced-motion: reduce){.quadro{animation:none}*{transition:none!important;animation:none!important}}
main{max-width:1280px;margin:0 auto;padding:16px}
.cli{max-width:560px;margin:0 auto}
.negtopo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.negtopo h2{margin:0;font-size:20px;font-stretch:110%}
.caixa{max-width:440px;margin:30px auto}
.caixa input{width:100%}
.okbox{background:var(--okbg);border:1.5px solid #A9DCC3;border-radius:12px;padding:12px;margin-top:12px}
.okbox input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px;font-size:13px;background:#fff}
.erro{color:var(--bad);font-weight:700}
.faixa-erro{background:var(--badbg);color:var(--bad);padding:8px 16px;font-weight:700;font-size:14px}
.rodape{text-align:center;padding:10px 16px 28px;font-size:13px;color:var(--mute)}
.rodape a{color:var(--ink2)}
.conv{display:flex;flex-direction:column;gap:6px;margin:10px 0;max-height:260px;overflow:auto}
.cm{max-width:85%;border-radius:14px;padding:7px 11px;font-size:14px}
.cm small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.cm.eu{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.cm.ele{align-self:flex-start;background:#EEF2F7;border-bottom-left-radius:4px}
.cm.sis{align-self:center;color:var(--mute);font-size:12px;text-align:center;padding:2px}
.resp{display:flex;gap:8px;margin-top:6px}
.resp input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.meu small{display:block;color:var(--mute)}
</style>

function livreEm(db,pid,ini,dur,ignorar,semAntecedencia){
  var fim=ini+dur*6e4,d0=dia0(ini),H=db.horario,wd=new Date(ini).getDay();
  if(H.dias.indexOf(wd)<0)return false;
  var a=(ini-d0)/6e4,b=(fim-d0)/6e4;
  if(a<hm2min(H.ini)||b>hm2min(H.fim))return false;
  if(H.almoco&&H.almoco[0]&&H.almoco[1]&&a<hm2min(H.almoco[1])&&b>hm2min(H.almoco[0]))return false;
  if(!semAntecedencia&&ini<Date.now()+(db.antecedencia||0)*6e4)return false;
  for(var i=0;i<db.ags.length;i++){var x=db.ags[i];if(x.prof!==pid||x.status==="cancelado"||(ignorar!=null&&x.id===ignorar))continue;if(ini<x.fim&&fim>x.ini)return false}
  for(var j=0;j<db.bloq.length;j++){var k=db.bloq[j];if(k.prof!==pid&&k.prof!=="todos")continue;if(ini<k.fim&&fim>k.ini)return false}
  return true;

}
