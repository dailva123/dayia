<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Divulga Fácil</title>
<meta name="description" content="Divulga Fácil by DayIA: organize as postagens, vídeos e mensagens da sua empresa num lugar só.">
<meta name="theme-color" content="#0E2238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Divulga Fácil">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Divulga Fácil by DayIA">
<meta property="og:description" content="Organize as postagens, vídeos e mensagens da sua empresa num lugar só. 7 dias grátis.">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E2238;--navy2:#16304F;--sky:#8EC5E8;--sun:#F2C230;--bg:#EEF2F7;--ink:#0E2238;--ink2:#4A5B75;--mute:#7B8BA3;--line:#D6DFEA;
--ok:#1F8A5B;--okbg:#E3F4EC;--warn:#B7791F;--warnbg:#FBF0D9;--bad:#C0392B;--badbg:#FBE4E1;--blue:#2B6CB0;--bluebg:#E2EEFA;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
/* abertura padrão DayIA */
#intro{position:fixed;inset:0;z-index:99;background:var(--navy);display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#intro.fim{opacity:0;pointer-events:none}
.quadro{width:76px;height:76px;background:#fff;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:cresce 1.4s cubic-bezier(.2,.8,.2,1) forwards}
.quadro img{width:100%;height:100%;display:block;border-radius:10px}
@keyframes cresce{0%{transform:scale(.6) rotate(0);opacity:0}20%{opacity:1}55%{transform:scale(1.6) rotate(0)}100%{transform:scale(1.6) rotate(360deg)}}
.by{position:absolute;display:flex;align-items:center;gap:10px;font-size:22px;color:#CFE2F2;opacity:0;transition:opacity .45s}
.by img{height:40px;width:auto;display:block}
#intro.passo2 .quadro{opacity:0;transition:opacity .3s}
#intro.passo2 .by{opacity:1}
@media (prefers-reduced-motion:reduce){#intro{display:none}}

header.top{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.top h1{margin:0;font-size:18px;font-stretch:112%;font-weight:800}
.by2{display:flex;align-items:center;gap:6px;color:#B9CCE2;font-size:13px}
.by2 img{height:20px;display:block}
.top .dir{margin-left:auto;display:flex;gap:6px;align-items:center}
.top .emp{color:#CFE2F2;font-size:13px;font-weight:700;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:var(--navy2);border:0;color:#fff;border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.demo{background:var(--sun);color:#1d1600;font-size:13.5px;font-weight:700;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.demo a,.demo button{background:#1d1600;color:var(--sun);border:0;text-decoration:none;padding:6px 14px;border-radius:999px;font-weight:800;cursor:pointer;font-size:13px;white-space:nowrap}
.demo button.cl{background:transparent;color:#1d1600;border:1.5px solid #1d1600}
main{max-width:1060px;margin:0 auto;padding:16px 14px 70px}
.faixa-erro{background:var(--badbg);color:var(--bad);text-align:center;font-weight:700;font-size:13px;padding:6px}
.faixa-teste{background:var(--warnbg);color:#7A5410;border:1.5px solid #E6CF9A;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.faixa-teste summary{cursor:pointer;font-weight:800;margin-top:4px}
.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:16px}
h2{font-size:20px;margin:0 0 4px;font-stretch:108%}
.sub{color:var(--ink2);margin:0 0 12px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;font-size:14.5px}
.btn.pri{background:var(--navy);color:#fff}
.btn.sol{background:var(--sun);color:var(--navy)}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:#1FA855;color:#fff}
.btn.lnk{background:none;color:var(--blue);padding:6px 4px}
.btn.del{background:none;color:var(--bad);padding:6px 4px}
.btn.larg{width:100%}
.btn.min{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.6;cursor:default}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink2)}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px;font-weight:400;color:var(--ink);background:#fff;min-width:0;width:100%;font-size:15px}
label.f small{font-weight:400;color:var(--mute)}
.g{display:grid;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
.erro{color:var(--bad);font-weight:700;font-size:14px;min-height:1em}

/* boas-vindas */
.boas{max-width:460px;margin:10px auto}
.hero{text-align:center;padding:10px 0 16px}
.hero .ico{width:64px;height:64px;border-radius:16px;background:#fff;padding:6px;box-shadow:0 6px 18px rgba(14,34,56,.15);display:inline-block}
.hero .ico img{width:100%;height:100%;display:block}
.hero h2{font-size:26px;margin-top:10px}
.troca{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.troca button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font-weight:800;color:var(--ink2);cursor:pointer}
.troca button[aria-pressed="true"]{background:var(--navy);color:#fff}
.vantagens{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px;font-size:14.5px}

/* resumo e abas */
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.resumo div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0}
.resumo b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.resumo span{color:var(--ink2);font-size:13px}
.resumo .px b{font-size:15px;padding-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resumo .pend b{color:var(--warn)}.resumo .feitos b{color:var(--ok)}
@media (max-width:560px){.resumo{grid-template-columns:1fr 1fr}.resumo .px{grid-column:1/-1}}
.abas{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.abas button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;color:var(--ink2);cursor:pointer;white-space:nowrap}
.abas button[aria-selected="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.ferr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
#busca{flex:1 1 240px;border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;background:#fff;font-size:15px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--sky);border-color:var(--sky);color:var(--navy)}
.sel{border:1.5px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;font-weight:700;font-size:13px}
.lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.lista{grid-template-columns:1fr}}
.vazio{color:var(--ink2);text-align:center;padding:30px 10px}

/* card de post */
.post{display:flex;flex-direction:column;gap:10px;min-width:0}
.post.feito{border-color:#9BD4B8;background:#FBFEFC}
.ph{display:flex;align-items:flex-start;gap:8px}
.ph h3{margin:0;font-size:16.5px;flex:1;min-width:0;overflow-wrap:anywhere}
.st{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--warnbg);color:var(--warn);white-space:nowrap}
.post.parcial .st{background:var(--bluebg);color:var(--blue)}
.post.feito .st{background:var(--okbg);color:var(--ok)}
.meta{font-size:13px;color:var(--ink2)}
.rot{font-size:12.5px;font-weight:800;color:var(--ink2);margin:0 0 4px}
.ja{display:flex;flex-wrap:wrap;gap:6px}
.ja label{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
.ja label.on{border-color:#6FC39B;background:var(--okbg)}
.ja input{width:17px;height:17px;accent-color:var(--ok);margin:0}
.todas{background:none;border:0;color:var(--blue);font-weight:800;font-size:13px;cursor:pointer;padding:2px 0;align-self:flex-start}
.tit{display:flex;gap:6px}
.tit input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;background:#F7F9FC}
.post textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:14px;line-height:1.45;resize:vertical;background:#fff}
.acoes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.redes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:10px}
.redes span{font-size:12.5px;font-weight:800;color:var(--ink2)}
.rb{font-size:13px;font-weight:800;text-decoration:none;color:#fff;padding:7px 12px;border-radius:999px}
.rb.ig{background:#c13584}.rb.fb{background:#1877f2}.rb.tt{background:#111}.rb.wa{background:#1fa855}.rb.yt{background:#e62117}.rb.li{background:#0A66C2}
.links td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:middle}
.links input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}

/* janelas */
.modal{position:fixed;inset:0;background:rgba(14,34,56,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
.modal .card{width:min(560px,100%);margin:auto 0}
.redes-esc{display:flex;flex-wrap:wrap;gap:6px}
.redes-esc label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer}
.redes-esc input{width:17px;height:17px;margin:0}
.fmt-esc{display:flex;gap:6px;flex-wrap:wrap}
.fmt-esc label{flex:1;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;min-width:140px}
#aviso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
#aviso.on{opacity:1}
.planos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0;text-align:left}
.plano{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:8px}
.plano.dest{border-color:var(--sun);background:#FFFBEB}
.plano b{font-size:22px}
.passos{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
footer.rodape{text-align:center;color:var(--mute);font-size:12.5px;padding:10px 0 24px}
footer.rodape a{color:var(--ink2)}
</style>
</head>

function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}

function copiar(txt,bt,rot){
  var ok=function(){if(bt){bt.textContent="Copiado ✓";setTimeout(function(){bt.textContent=rot},1600)}aviso("Copiado! Agora é só colar.")};
  try{navigator.clipboard.writeText(txt).then(ok,function(){fallbackCopia(txt);ok()})}catch(e){fallbackCopia(txt);ok()}
}

/* ======================= instalar no celular ======================= */
var PEDIDO_INSTALAR=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();PEDIDO_INSTALAR=e});
(function(){
  try{
    var pasta=location.origin+location.pathname.replace(/[^\/]*$/,""),ini=location.href.split("#")[0];
    var m={name:"Divulga Fácil",short_name:"Divulga Fácil",id:pasta,start_url:ini,scope:pasta,display:"standalone",orientation:"portrait",background_color:"#0E2238",theme_color:"#0E2238",lang:"pt-BR",

  }catch(e){}

})();
function instalar(){
  if(PEDIDO_INSTALAR){PEDIDO_INSTALAR.prompt();PEDIDO_INSTALAR.userChoice.then(function(){PEDIDO_INSTALAR=null});return}
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  janela('<h2>📲 Instalar no celular</h2><p class="sub">Fica um ícone na tela do celular, como um aplicativo.</p>'+

    '<p></p><button class="btn pri larg" data-fecha>Entendi</button>');
}

/* ======================= servidor ======================= */
function api(acao,dados){
  if(!API)return Promise.reject(new Error("O sistema ainda não foi ligado. Fale com a DayIA."));
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({acao:acao,token:ls(PFX+"token")||""},dados||{})),redirect:"follow"})
    .then(function(r){return r.json()})
    .then(function(j){$("#offline").hidden=true;if(j&&j.erro){var e=new Error(j.erro);e.servidor=true;throw e}return j},
      function(e){if(!e.servidor)$("#offline").hidden=false;throw e});
}

/* ======================= dados ======================= */
var D={posts:[],msgs:[],links:[]},V=0,CONTA={},LIC={};
var UI={aba:"posts",filtro:"todos",rede:"todas",fmt:"todos",busca:""};
function vivos(k){return D[k].filter(function(x){return !x.del})}
function achar(k,id){return D[k].filter(function(x){return x.id===id})[0]}
function guardarLocal(){ls(PFX+"dados",JSON.stringify(D));ls(PFX+"v",String(V))}
function juntar(a,b){var out={};["posts","msgs","links"].forEach(function(k){var m={},ord=[];
  (a[k]||[]).forEach(function(x){m[x.id]=x;ord.push(x.id)});
  (b[k]||[]).forEach(function(x){if(!m[x.id]){m[x.id]=x;ord.push(x.id)}else if((+x.u||0)>(+m[x.id].u||0))m[x.id]=x});
  out[k]=ord.map(function(id){return m[id]})});return out}
var PEND=false,ENVIANDO=false,TSALVA=null;
function mexeu(item){item.u=Date.now();guardarLocal();PEND=true;ls(PFX+"pend","1");clearTimeout(TSALVA);TSALVA=setTimeout(enviar,900);resumo()}
function enviar(){
  if(DEMO){PEND=false;return}
  if(ENVIANDO){clearTimeout(TSALVA);TSALVA=setTimeout(enviar,800);return}
  if(!PEND)return;
  ENVIANDO=true;PEND=false;
  api("salvar",{dados:D}).then(function(j){
    ENVIANDO=false;D=juntar(j.dados,D);V=j.v;guardarLocal();if(!PEND)ls(PFX+"pend",null);
    if(!editando())desenhar();
  },function(e){ENVIANDO=false;PEND=true;
    if(e.servidor&&/SESSAO/.test(e.message))return sairLocal();
    if(e.servidor){aviso(e.message);return}
    clearTimeout(TSALVA);TSALVA=setTimeout(enviar,8000)});
}
function editando(){var a=document.activeElement;return a&&/^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)&&a.closest("#app")}
function atualizar(){
  if(DEMO||!ls(PFX+"token")||document.hidden)return;
  if(PEND||ls(PFX+"pend")){PEND=true;enviar();return}
  api("dados",{v:V}).then(function(j){
    CONTA=j.conta||CONTA;LIC=j.licenca||LIC;$("#hEmp").textContent=CONTA.empresa||"";
    if(!LIC.ok){telaBloqueada();return}
    if(j.mudou){D=juntar(j.dados||{},D);V=j.v;guardarLocal()}
    if(!editando())desenhar();
  },function(e){if(e.servidor&&/SESSAO/.test(e.message))sairLocal()});
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)atualizar()});
setInterval(atualizar,60000);
window.addEventListener("online",function(){if(PEND)enviar()});

/* ======================= telas ======================= */
function inicio(){
  if(DEMO){iniciarDemo();return}
  if(!ls(PFX+"token")){telaEntrada(Q.has("entrar")?"entrar":"criar");return}
  try{D=juntar({posts:[],msgs:[],links:[]},JSON.parse(ls(PFX+"dados")||"{}"));V=+ls(PFX+"v")||0}catch(e){}
  if(ls(PFX+"pend"))PEND=true;
  $("#topoDir").hidden=false;
  if(D.posts.length||D.msgs.length)desenhar();
  api("dados",{v:PEND?0:V}).then(function(j){
    CONTA=j.conta||{};LIC=j.licenca||{};$("#hEmp").textContent=CONTA.empresa||"";
    if(!LIC.ok){telaBloqueada();return}
    if(j.mudou){D=juntar(j.dados||{},D);V=j.v;guardarLocal()}
    desenhar();if(PEND)enviar();
  },function(e){
    if(e.servidor&&/SESSAO/.test(e.message))return sairLocal();
    if(D.posts.length||D.msgs.length)return;
    $("#app").innerHTML='<div class="card vazio">Não consegui conectar. Confira a internet e toque em tentar de novo.<p></p><button class="btn pri" onclick="inicio()">Tentar de novo</button></div>';
  });
}
function telaEntrada(modo){
