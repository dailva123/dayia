<style>
:root{
  --navy:#0E2238; --navy2:#16304F; --sky:#8EC5E8; --sun:#F2C230;
  --bg:#EEF2F7; --card:#FFFFFF; --ink:#0E2238; --ink2:#4A5B75; --mute:#7B8BA3; --line:#D6DFEA;
  --ok:#1F8A5B; --okbg:#E3F4EC; --warn:#B7791F; --warnbg:#FBF0D9; --bad:#C0392B; --badbg:#FBE4E1; --info:#2B6CB0; --infobg:#E2EEFA;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}

/* abertura padrão DayIA */
#intro{position:fixed;inset:0;z-index:90;background:var(--navy);display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
#intro.fim{opacity:0;pointer-events:none}
.quadro{width:76px;height:76px;background:#fff;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:cresce 1.4s cubic-bezier(.2,.8,.2,1) forwards}
.quadro img{width:100%;height:100%;display:block;border-radius:10px}
@keyframes cresce{0%{transform:scale(.6) rotate(0);opacity:0}20%{opacity:1}55%{transform:scale(1.6) rotate(0)}100%{transform:scale(1.6) rotate(360deg)}}
.by{position:absolute;display:flex;align-items:center;gap:10px;font-size:22px;color:#CFE2F2;opacity:0;transition:opacity .45s ease}
.by img{height:40px;width:auto;display:block}
#intro.passo2 .quadro{opacity:0;transition:opacity .3s}
#intro.passo2 .by{opacity:1}

/* topo */
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.topo{max-width:1180px;margin:0 auto;padding:12px 18px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto}
.marca h1{margin:0;font-size:19px;font-stretch:112%;font-weight:800;letter-spacing:-.01em}
.marca .by2{display:flex;align-items:center;gap:6px;color:#B9CCE2;font-size:13px}
.marca .by2 img{height:20px;width:auto;display:block}
.cli{display:flex;align-items:center;gap:8px;font-size:13px;color:#B9CCE2}
.cli select{background:var(--navy2);border:1px solid #2A4A70;color:#fff;border-radius:10px;padding:7px 10px;max-width:220px}
nav.abas{max-width:1180px;margin:0 auto;padding:10px 18px 0;display:flex;gap:4px;overflow-x:auto}
nav.abas button{background:transparent;border:0;color:#B9CCE2;font-weight:700;padding:10px 14px 12px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
nav.abas button[aria-selected="true"]{background:var(--bg);color:var(--navy)}
nav.abas .cont{background:var(--sun);color:var(--navy);border-radius:999px;font-size:12px;padding:1px 8px}

main{max-width:1180px;margin:0 auto;padding:18px 18px 60px}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.barra input[type=search]{flex:1 1 220px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.barra select{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--navy);color:#fff}
.btn.sol{background:var(--sun);color:var(--navy)}
.btn.sec{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.min{padding:6px 10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

.alertas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.alerta{height:100%;background:#fff;border-radius:14px;padding:12px 14px;border-left:5px solid var(--line);cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0}
.alerta b{display:block;font-size:24px;font-stretch:110%;line-height:1.1}
.alerta span{display:block;font-size:13px;color:var(--ink2)}
.alerta.bad{border-left-color:var(--bad)} .alerta.bad b{color:var(--bad)}
.alerta.warn{border-left-color:var(--warn)} .alerta.warn b{color:var(--warn)}
.alerta.azul{border-left-color:var(--info)} .alerta.azul b{color:var(--info)}
.alerta.ok{border-left-color:var(--ok)} .alerta.ok b{color:var(--ok)}

.lista{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.linha{display:grid;grid-template-columns:86px 1fr 130px 120px 110px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;background:#fff;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.linha:first-child{border-top:0}
.linha:hover{background:#F7FAFD}
.linha .id{font-weight:800;color:var(--mute);font-size:13px}
.linha .tit{font-weight:700;line-height:1.3}
.linha .sub{font-size:12.5px;color:var(--mute);margin-top:2px}
.cab{display:grid;grid-template-columns:86px 1fr 130px 120px 110px;gap:12px;padding:10px 16px;font-size:12px;font-weight:700;color:var(--mute);background:#F7FAFD;border-bottom:1px solid var(--line)}
.inv .linha,.inv .cab{grid-template-columns:96px 1fr 150px 130px 120px}
.tag{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)} .t-warn{background:var(--warnbg);color:var(--warn)} .t-bad{background:var(--badbg);color:var(--bad)} .t-info{background:var(--infobg);color:var(--info)} .t-mute{background:#EEF2F7;color:var(--ink2)}
.prio{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.prio i{width:9px;height:9px;border-radius:50%;display:inline-block}
.vazio{padding:40px 16px;text-align:center;color:var(--ink2)}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:16px;padding:14px 16px;border:1px solid var(--line)}
.kpi span{font-size:13px;color:var(--ink2)}
.kpi b{display:block;font-size:30px;font-stretch:112%;line-height:1.15;margin:2px 0}
.kpi small{font-size:12.5px;color:var(--mute)}
.graf{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.box{background:#fff;border-radius:16px;padding:16px;border:1px solid var(--line)}
.box h3{margin:0 0 2px;font-size:16px}
.box p.d{margin:0 0 12px;font-size:13px;color:var(--mute)}
.barras .it{display:grid;grid-template-columns:120px 1fr 46px;gap:10px;align-items:center;margin:7px 0;font-size:13.5px}
.barras .tr{background:#EEF2F7;border-radius:6px;height:14px;overflow:hidden}
.barras .tr div{height:100%;background:var(--navy);border-radius:6px}
.barras .v{text-align:right;font-weight:700}
svg text{font-family:inherit}
.rel{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.rel h2{margin:0;font-size:22px;font-stretch:110%}
.rel p{margin:2px 0 0;color:var(--ink2);font-size:14px}

/* modal */
dialog{border:0;border-radius:18px;padding:0;width:min(760px,96vw);max-height:92vh;background:#fff;color:var(--ink)}
dialog::backdrop{background:rgba(8,18,34,.55)}
.mod{padding:20px 22px 18px;overflow:auto;max-height:92vh}
.mod h2{margin:0 0 4px;font-size:21px;font-stretch:110%;line-height:1.2}
.mod .meta{color:var(--mute);font-size:13px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink2)}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-weight:400;color:var(--ink);background:#fff}
label.f textarea{min-height:80px;resize:vertical}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 14px}
.info div{background:#F7FAFD;border-radius:10px;padding:8px 10px;font-size:13px}
.info div span{display:block;color:var(--mute);font-size:12px}
.info div b{font-weight:700}
.hist{border-left:3px solid var(--line);margin:8px 0 14px 4px;padding-left:14px}
.hist .ev{margin:0 0 10px;font-size:14px}
.hist .ev small{display:block;color:var(--mute);font-size:12px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px;position:sticky;bottom:-18px;background:#fff;padding:10px 0 4px}
.estrelas button{background:none;border:0;font-size:26px;cursor:pointer;color:#C9D3E0;padding:0 2px}
.estrelas button.on{color:var(--sun)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:95;box-shadow:0 8px 24px rgba(0,0,0,.25)}
footer{text-align:center;color:var(--mute);font-size:13px;padding:10px 0 30px}
footer img{height:18px;width:auto;vertical-align:middle;margin-left:4px;background:var(--navy);border-radius:6px;padding:3px 6px}
.demo{background:var(--warnbg);color:#7A5410;border-radius:12px;padding:9px 14px;font-size:13.5px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}

@media (max-width:760px){
  .cab{display:none}
  .linha,.inv .linha{grid-template-columns:1fr auto;gap:6px 10px}
  .linha .c3,.linha .c4{grid-column:1/2}
  .linha .id{grid-column:1/-1}
  .linha .c5{grid-row:2;grid-column:2}
  .grid2{grid-template-columns:1fr}
  .barras .it{grid-template-columns:96px 1fr 40px}
  .marca h1{font-size:17px}
}
@media print{
  header,#intro,.barra,.chips,.demo,.noprint,footer{display:none!important}
  body{background:#fff}
  main{padding:0}
  .box,.kpi{break-inside:avoid}
}
@media (prefers-reduced-motion: reduce){.quadro{animation:none}*{transition:none!important}}
</style>
</head>

<dialog id="dlg"><div class="mod" id="mod"></div></dialog>

<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var H=3600e3,D=24*H;
function fData(t){var d=new Date(t);return d.toLocaleDateString("pt-BR")}
function fHora(t){var d=new Date(t);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function fDur(ms){var h=Math.round(ms/H);if(Math.abs(h)<1)return Math.max(1,Math.round(Math.abs(ms)/60000))+" min";if(Math.abs(h)<48)return Math.abs(h)+" h";return Math.round(Math.abs(h)/24)+" dias"}
function toast(m){var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function rnd(seed){var x=seed;return function(){x=(x*16807)%2147483647;return (x-1)/2147483646}}

/* ---------- regras ---------- */
var PRIO={"Urgente":{h:4,cor:"#C0392B"},"Alta":{h:8,cor:"#E67E22"},"Média":{h:24,cor:"#2B6CB0"},"Baixa":{h:72,cor:"#7B8BA3"}};
var STATUS=["Aberto","Em atendimento","Aguardando cliente","Resolvido"];
var CATS=["Computador","Impressora","Internet e rede","E-mail","Sistema","Acesso e senha","Telefonia"];
var TECS=["Ana","Bruno","Carla","Diego"];
var CLIENTES=["Empresa Modelo","Clínica Bem Viver","Lima Advocacia","Mercado Bom Preço"];
var SETORES=["Administrativo","Financeiro","Comercial","Recepção","Estoque","Diretoria"];
var TIPOS=["Computador","Notebook","Impressora","Servidor","Roteador","Celular","Monitor"];
var AST=["Em uso","Em estoque","Em manutenção","Baixado"];
var KEY="dayia-suporte-v1";

/* ---------- dados de demonstração ---------- */
function gerar(){
  var r=rnd(20261006),now=Date.now(),pick=function(a){return a[Math.floor(r()*a.length)]};
  var nomes=["Paula","Rogério","Simone","Marcelo","Juliana","Fernando","Letícia","Cláudio","Renata","Hugo","Patrícia","Vítor","Sônia","Otávio","Bianca","Caio"];
  var marcas={"Computador":["Dell OptiPlex 3080","Lenovo ThinkCentre M70","HP ProDesk 400"],"Notebook":["Dell Latitude 3420","Lenovo ThinkPad E14","Acer Aspire 5"],"Impressora":["Brother HL-L5102","HP LaserJet M428","Epson L3250"],"Servidor":["Dell PowerEdge T150"],"Roteador":["TP-Link Archer C6","Mikrotik hAP ac²"],"Celular":["Samsung Galaxy A34","Motorola Moto G54"],"Monitor":["LG 24MK430","Samsung 24'' T35F"]};
  var ativos=[],n=1;
  CLIENTES.forEach(function(cli,ci){
    var q=ci===0?16:8;
    for(var i=0;i<q;i++){
      var tipo=i<5?"Computador":pick(TIPOS),compra=now-Math.floor(r()*4*365)*D,gar=compra+(r()<.5?365:3*365)*D;
      var ult=now-Math.floor(r()*200+5)*D,prox=ult+180*D;
      var st=r()<.78?"Em uso":r()<.5?"Em manutenção":r()<.6?"Em estoque":"Baixado";
      ativos.push({id:"A"+n,pat:"PAT-"+String(n).padStart(4,"0"),tipo:tipo,modelo:pick(marcas[tipo]),cliente:cli,setor:pick(SETORES),resp:pick(nomes),status:st,compra:compra,garantia:gar,ultManut:ult,proxManut:prox,obs:""});n++;
    }
  });
  var titulos={
    "Computador":["Computador muito lento","Computador não liga","Tela azul ao iniciar","Instalar programa de PDF"],
    "Impressora":["Impressora não imprime","Papel atolando","Configurar impressora na rede","Impressão saindo falhada"],
    "Internet e rede":["Sem internet no setor","Wi-Fi caindo toda hora","Internet lenta à tarde"],
    "E-mail":["Não recebo e-mails","Caixa de e-mail cheia","Configurar e-mail no celular"],
    "Sistema":["Erro ao emitir nota fiscal","Sistema travando no fechamento","Relatório não abre"],
    "Acesso e senha":["Esqueci a senha do sistema","Liberar acesso para novo funcionário","Usuário bloqueado"],
    "Telefonia":["Ramal sem sinal","Transferir linha para outro ramal"]};
  var ch=[],num=1001;
  for(var k=0;k<118;k++){
    var cat=pick(CATS),cli=r()<.4?CLIENTES[0]:pick(CLIENTES),pr=r()<.08?"Urgente":r()<.25?"Alta":r()<.7?"Média":"Baixa";
    var aberto;
    if(k<9)aberto=now-Math.floor(r()*PRIO[pr].h*H*(k<2?1.6:0.85))-60000;
    else if(k<14)aberto=now-Math.floor((14+r()*16)*H);
    else if(k<20)aberto=now-Math.floor((2+r()*5)*D)-Math.floor(r()*10)*H;
    else aberto=now-Math.floor((7+r()*49)*D)-Math.floor(r()*10)*H;
    var idade=now-aberto,st;
    if(idade>4*D)st=r()<.97?"Resolvido":"Aguardando cliente";
    else if(idade>2*D)st=r()<.75?"Resolvido":pick(STATUS.slice(1,3));
    else if(k>=9)st="Resolvido";
    else st=pick(["Aberto","Em atendimento","Em atendimento","Aguardando cliente"]);
    var lim=PRIO[pr].h*H,dur=lim*(r()<.82?(0.15+r()*0.8):(1.1+r()*1.5));
    var res=st==="Resolvido"?Math.min(now-H,aberto+(k>=9&&k<14?Math.min(dur,idade-2*H):dur)):null;
    var cand=ativos.filter(function(a){return a.cliente===cli&&((cat==="Impressora"&&a.tipo==="Impressora")||(cat==="Computador"&&(a.tipo==="Computador"||a.tipo==="Notebook"))||(cat==="Internet e rede"&&a.tipo==="Roteador"))});
    var tec=st==="Aberto"&&r()<.6?"":pick(TECS),sol=pick(nomes);
    var notas=[{t:aberto,a:sol,x:"Chamado aberto."}];
    if(tec)notas.push({t:aberto+Math.min(dur*0.3,2*H),a:tec,x:"Assumi o chamado e estou verificando."});
    if(st==="Aguardando cliente")notas.push({t:aberto+Math.min(dur*0.5,4*H),a:tec,x:"Pedi ao usuário para testar e confirmar."});
    if(res)notas.push({t:res,a:tec,x:"Problema resolvido. Chamado encerrado."});
    ch.push({id:num++,titulo:pick(titulos[cat]),desc:"",cliente:cli,solicitante:sol,setor:pick(SETORES),categoria:cat,prioridade:pr,status:st,tecnico:tec,aberto:aberto,prazo:aberto+lim,resolvido:res,ativo:cand.length&&r()<.85?pick(cand).id:"",notas:notas,nota:res&&r()<.8?(r()<.7?5:r()<.6?4:3):null});
  }
  ch.sort(function(a,b){return b.aberto-a.aberto});
  return {chamados:ch,ativos:ativos,prox:num,proxA:n};
}
var DB;
function carregar(){try{var x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&x.chamados)return x}catch(e){}return gerar()}
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
DB=carregar();

/* ---------- estado ---------- */
var st={aba:"chamados",cli:"",q:"",fSt:"abertos",fPri:"",fTec:"",iq:"",iTipo:"",iSt:"",iAlerta:""};
function doCli(x){return !st.cli||x.cliente===st.cli}
function ativo(id){return DB.ativos.filter(function(a){return a.id===id})[0]}
function sla(c){
  var now=Date.now();
  if(c.status==="Resolvido")return c.resolvido<=c.prazo?{t:"No prazo",c:"t-ok"}:{t:"Fora do prazo",c:"t-mute"};
  var falta=c.prazo-now;
  if(falta<0)return {t:"Atrasado "+fDur(falta),c:"t-bad"};
  if(falta<PRIO[c.prioridade].h*H*0.25)return {t:"Vence em "+fDur(falta),c:"t-warn"};
  return {t:"Vence em "+fDur(falta),c:"t-info"};
}
function stTag(s){return '<span class="tag '+({"Aberto":"t-info","Em atendimento":"t-warn","Aguardando cliente":"t-mute","Resolvido":"t-ok"}[s])+'">'+esc(s)+'</span>'}
function prioTag(p){return '<span class="prio"><i style="background:'+PRIO[p].cor+'"></i>'+esc(p)+'</span>'}

/* ---------- topo ---------- */
var cliSel=$("#cliSel");
cliSel.innerHTML='<option value="">Todos os clientes</option>'+CLIENTES.map(function(c){return '<option>'+esc(c)+'</option>'}).join("");
cliSel.onchange=function(){st.cli=cliSel.value;render()};
$$("nav.abas button").forEach(function(b){b.onclick=function(){st.aba=b.dataset.aba;$$("nav.abas button").forEach(function(x){x.setAttribute("aria-selected",x===b)});render();scrollTo(0,0)}});

function render(){
  var abertos=DB.chamados.filter(function(c){return c.status!=="Resolvido"&&doCli(c)}).length;
  $("#cAbertos").textContent=abertos;
  if(st.aba==="chamados")rChamados();else if(st.aba==="inventario")rInventario();else rPainel();
}
function demoBar(){return '<div class="demo noprint"><span>Demonstração com dados fictícios. O que você mudar fica salvo só neste aparelho. <a href="ao-vivo/" target="_blank" rel="noopener" style="font-weight:800">Ver ao vivo: o cliente abre e o chamado chega na tela do técnico →</a></span><button class="btn sec min" id="reset">Restaurar demonstração</button></div>'}
function ligaDemo(){var b=$("#reset");if(b)b.onclick=function(){if(confirm("Voltar aos dados de demonstração? O que você alterou será apagado.")){DB=gerar();salvar();render();toast("Demonstração restaurada")}}}

/* ---------- CHAMADOS ---------- */
function rChamados(){
  var L=DB.chamados.filter(doCli),now=Date.now();
  var ab=L.filter(function(c){return c.status!=="Resolvido"});
  var atr=ab.filter(function(c){return c.prazo<now}).length;
  var venc=ab.filter(function(c){return c.prazo>=now&&c.prazo-now<PRIO[c.prioridade].h*H*0.25}).length;
  var sem=ab.filter(function(c){return !c.tecnico}).length;
  var hoje=L.filter(function(c){return c.resolvido&&now-c.resolvido<D}).length;
  var f=L.filter(function(c){
    if(st.fSt==="abertos"&&c.status==="Resolvido")return false;
    if(st.fSt==="atrasados"&&!(c.status!=="Resolvido"&&c.prazo<now))return false;
    if(st.fSt==="semtec"&&!(c.status!=="Resolvido"&&!c.tecnico))return false;
    if(STATUS.indexOf(st.fSt)>=0&&c.status!==st.fSt)return false;

function rPainel(){
  var now=Date.now(),L=DB.chamados.filter(doCli),ini=now-30*D,ant=now-60*D;
  var mes=L.filter(function(c){return c.aberto>=ini}),mesAnt=L.filter(function(c){return c.aberto>=ant&&c.aberto<ini});
  var res=L.filter(function(c){return c.resolvido&&c.resolvido>=ini});
  var noPrazo=res.filter(function(c){return c.resolvido<=c.prazo}).length;
  var tm=res.length?res.reduce(function(s,c){return s+(c.resolvido-c.aberto)},0)/res.length:0;
  var notas=res.filter(function(c){return c.nota}),media=notas.length?notas.reduce(function(s,c){return s+c.nota},0)/notas.length:0;
  var ab=L.filter(function(c){return c.status!=="Resolvido"}).length;
  var pct=res.length?Math.round(noPrazo/res.length*100):0;
  var dif=mes.length-mesAnt.length;
  // semanas
  var sem=[];for(var i=7;i>=0;i--){var a0=now-(i+1)*7*D,a1=now-i*7*D;sem.push({lab:new Date(a1).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}),ab:L.filter(function(c){return c.aberto>=a0&&c.aberto<a1}).length,re:L.filter(function(c){return c.resolvido&&c.resolvido>=a0&&c.resolvido<a1}).length})}
  var cat={};mes.forEach(function(c){cat[c.categoria]=(cat[c.categoria]||0)+1});
  var catL=Object.keys(cat).map(function(k){return [k,cat[k]]}).sort(function(a,b){return b[1]-a[1]});
  var tec=TECS.map(function(t){var r=res.filter(function(c){return c.tecnico===t});var np=r.filter(function(c){return c.resolvido<=c.prazo}).length;return [t,r.length,r.length?Math.round(np/r.length*100):0]});
  var A=DB.ativos.filter(doCli),aSt=AST.map(function(s){return [s,A.filter(function(a){return a.status===s}).length]});
  var top=(function(){var m={};L.forEach(function(c){if(c.ativo)m[c.ativo]=(m[c.ativo]||0)+1});return Object.keys(m).map(function(k){return [ativo(k),m[k]]}).filter(function(x){return x[0]}).sort(function(a,b){return b[1]-a[1]}).slice(0,5)})();
  var cliNome=st.cli||"todos os clientes";
  var h=demoBar()+
  '<div class="rel"><div><h2>Resultados dos últimos 30 dias</h2><p>'+esc(cliNome)+' · '+fData(ini)+' a '+fData(now)+'</p></div><button class="btn pri noprint" id="imp">Imprimir relatório para o cliente</button></div>'+
  '<div class="kpis">'+
    kpi("Chamados abertos no período",mes.length,(dif>=0?"+":"")+dif+" em relação aos 30 dias anteriores")+
    kpi("Resolvidos no período",res.length,ab+" ainda em aberto agora")+
    kpi("Resolvidos dentro do prazo",pct+"%",noPrazo+" de "+res.length+" chamados")+
    kpi("Tempo médio de solução",res.length?fDur(tm):"–","do chamado aberto até a solução")+
    kpi("Satisfação dos usuários",media?media.toFixed(1).replace(".",",")+" de 5":"–",notas.length+" avaliações")+
  '</div><div class="graf">'+
  '<div class="box full" style="grid-column:1/-1"><h3>Chamados por semana</h3><p class="d">Abertos e resolvidos nas últimas 8 semanas</p>'+svgSemanas(sem)+'</div>'+
  '<div class="box"><h3>O que mais gera chamado</h3><p class="d">Por categoria, últimos 30 dias</p><div class="barras">'+barras(catL)+'</div></div>'+
  '<div class="box"><h3>Desempenho da equipe</h3><p class="d">Chamados resolvidos e % dentro do prazo</p><div class="barras">'+tec.map(function(t){var mx=Math.max.apply(null,tec.map(function(x){return x[1]}))||1;return '<div class="it"><span>'+esc(t[0])+' <small style="color:var(--mute)">'+t[2]+'% no prazo</small></span><div class="tr"><div style="width:'+(t[1]/mx*100)+'%"></div></div><span class="v">'+t[1]+'</span></div>'}).join("")+'</div></div>'+
  '<div class="box"><h3>Equipamentos por situação</h3><p class="d">'+A.length+' equipamentos cadastrados</p><div class="barras">'+barras(aSt)+'</div></div>'+
  '<div class="box"><h3>Equipamentos com mais chamados</h3><p class="d">Candidatos a troca ou revisão</p>'+(top.length?'<div class="barras">'+top.map(function(t){var mx=top[0][1];return '<div class="it" style="grid-template-columns:1fr 90px 30px"><span>'+esc(t[0].pat)+' <small style="color:var(--mute)">'+esc(t[0].tipo)+' · '+esc(t[0].setor)+'</small></span><div class="tr"><div style="width:'+(t[1]/mx*100)+'%;background:#E67E22"></div></div><span class="v">'+t[1]+'</span></div>'}).join("")+'</div>':'<p style="color:var(--mute)">Sem chamados ligados a equipamentos.</p>')+'</div>'+
  '</div>';
  $("#main").innerHTML=h;ligaDemo();$("#imp").onclick=function(){window.print()};
}
function kpi(t,v,s){return '<div class="kpi"><span>'+esc(t)+'</span><b>'+esc(v)+'</b><small>'+esc(s)+'</small></div>'}
function barras(L){if(!L.length)return '<p style="color:var(--mute)">Sem dados no período.</p>';var mx=Math.max.apply(null,L.map(function(x){return x[1]}))||1;return L.map(function(x){return '<div class="it"><span>'+esc(x[0])+'</span><div class="tr"><div style="width:'+(x[1]/mx*100)+'%"></div></div><span class="v">'+x[1]+'</span></div>'}).join("")}
function svgSemanas(S){
  var W=900,Hh=230,pl=34,pb=28,pt=14,mx=Math.max.apply(null,S.map(function(s){return Math.max(s.ab,s.re)}))||1;mx=Math.ceil(mx/5)*5;
  var gw=(W-pl-10)/S.length,bw=Math.min(28,gw/3.2),y=function(v){return pt+(Hh-pt-pb)*(1-v/mx)};
  var g="";for(var v=0;v<=mx;v+=mx/5){g+='<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#E3E9F1"/><text x="'+(pl-6)+'" y="'+(y(v)+4)+'" font-size="11" fill="#7B8BA3" text-anchor="end">'+Math.round(v)+'</text>'}
  S.forEach(function(s,i){var cx=pl+gw*i+gw/2;
    g+='<rect x="'+(cx-bw-2)+'" y="'+y(s.ab)+'" width="'+bw+'" height="'+(y(0)-y(s.ab))+'" rx="4" fill="#8EC5E8"><title>'+s.ab+' abertos</title></rect>';
    g+='<rect x="'+(cx+2)+'" y="'+y(s.re)+'" width="'+bw+'" height="'+(y(0)-y(s.re))+'" rx="4" fill="#0E2238"><title>'+s.re+' resolvidos</title></rect>';
    g+='<text x="'+cx+'" y="'+(Hh-8)+'" font-size="11" fill="#7B8BA3" text-anchor="middle">até '+s.lab+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" role="img" aria-label="Chamados abertos e resolvidos por semana">'+g+'</svg>'+
  '<div style="display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-top:4px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#8EC5E8;margin-right:6px"></i>Abertos</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#0E2238;margin-right:6px"></i>Resolvidos</span></div>';
}

render();

/* abertura */
var intro=$("#intro");
if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){intro.classList.add("fim")}
else{setTimeout(function(){intro.classList.add("passo2")},1500);setTimeout(function(){intro.classList.add("fim")},2700)}
})();
</script>
