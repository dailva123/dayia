<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pedido Fácil</title>
<meta name="theme-color" content="#2F3A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--pri:#2F3A4A;--pri2:#3E4B5E;--bg:#F6F1E9;--card:#fff;--ink:#2A3340;--ink2:#5E6878;--mute:#8C95A3;--line:#E6DED1;
--olive:#5F7350;--olivebg:#E8EEDF;--acc:#B5623A;--accbg:#F8E6DC;--warn:#9A6B12;--warnbg:#FBF0D6;--bad:#B23A2E;--badbg:#FBE3DF;--blue:#2B6CB0;--bluebg:#E2EEFA;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:90px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
#intro{position:fixed;inset:0;z-index:99;background:var(--pri);display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#intro.fim{opacity:0;pointer-events:none}
.quadro{width:76px;height:76px;background:#fff;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:cresce 1.4s cubic-bezier(.2,.8,.2,1) forwards}
.quadro img{width:100%;height:100%;display:block;border-radius:10px;object-fit:cover}
@keyframes cresce{0%{transform:scale(.6) rotate(0);opacity:0}20%{opacity:1}55%{transform:scale(1.6) rotate(0)}100%{transform:scale(1.6) rotate(360deg)}}
.by{position:absolute;display:flex;align-items:center;gap:10px;font-size:22px;color:#DCE3EC;opacity:0;transition:opacity .45s}
.by img{height:40px;width:auto;display:block}
#intro.passo2 .quadro{opacity:0;transition:opacity .3s}
#intro.passo2 .by{opacity:1}

header.top{background:var(--pri);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;min-height:64px}
.logo{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:cover;flex:none;border:2px solid rgba(255,255,255,.6)}
.logo.ini{display:grid;place-items:center;color:var(--pri);font-weight:800}
.tt{min-width:0;flex:1}
.tt h1{margin:0;font-size:16.5px;line-height:1.2;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.by2{display:flex;align-items:center;gap:5px;color:#C9D1DC;font-size:12px;margin-top:2px}
.by2 img{height:15px}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:14px 16px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--ink2);font-size:13.5px;margin:0}
.faixa{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;font-weight:700;border-radius:12px;padding:9px 12px;margin-bottom:12px}
.faixa.ab{background:var(--olivebg);color:var(--olive)}.faixa.fe{background:var(--badbg);color:var(--bad)}
.faixa .pt{width:9px;height:9px;border-radius:50%;background:currentColor}
.aviso-neg{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;font-weight:600}
.grupo{margin:18px 0 8px}
.grupo h2{font-size:18px}
.prato{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.prato:hover{border-color:#CDBFA9}
.prato .nm{font-weight:700;flex:1}
.prato .nm small{display:block;font-weight:500;color:var(--ink2);font-size:13px;margin-top:2px}
.prato .pr{font-weight:800;color:var(--pri);white-space:nowrap}
.prato .mais{width:32px;height:32px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.prato.off{opacity:.55;cursor:default}
.tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--accbg);color:var(--acc)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--pri);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.sec{background:#fff;color:var(--pri);border:1.5px solid var(--line)}
.btn.ok{background:var(--olive)}.btn.acc{background:var(--acc)}.btn.bad{background:#fff;color:var(--bad);border:1.5px solid #EBC3BD}
.btn.wa{background:#25D366;color:#fff}
.btn.blk{width:100%}.btn.min{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(246,241,233,.95) 30%)}
.barra .btn{max-width:532px;margin:0 auto;display:flex;width:100%;justify-content:space-between;font-size:16px;padding:14px 18px;box-shadow:0 10px 30px rgba(47,58,74,.35)}
.fundo{position:fixed;inset:0;background:rgba(30,36,46,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:sobe .25s ease-out}
@keyframes sobe{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.folha .x{float:right;border:0;background:#fff;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;border:1px solid var(--line)}
.opcs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.opc{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-weight:700;cursor:pointer;font-size:14px}
.opc[aria-pressed="true"]{border-color:var(--pri);background:var(--pri);color:#fff}
.rot{font-size:13px;font-weight:800;color:var(--ink2);margin:14px 0 4px;display:block}
.rot b{color:var(--bad)}
input.f,textarea.f,select.f{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:15px}
textarea.f{min-height:64px;resize:vertical}
input.f:focus,textarea.f:focus{border-color:var(--pri);outline:none}
.qtd{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.qtd button{border:0;background:none;width:42px;height:42px;font-size:20px;cursor:pointer;font-weight:800;color:var(--pri)}
.qtd span{min-width:28px;text-align:center;font-weight:800}
.linha{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.linha:last-child{border-bottom:0}
.linha small{color:var(--ink2);display:block}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding-top:8px}
.pix{background:#fff;border:2px dashed #CDBFA9;border-radius:16px;padding:14px}
.pix .ch{font-size:19px;font-weight:800;letter-spacing:.02em;margin:4px 0;word-break:break-all}
.passos{margin:8px 0 0;padding-left:20px;color:var(--ink2);font-size:14px}.passos li{margin:3px 0}
.arq{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:12px;padding:12px;background:#fff;cursor:pointer}
.arq.ok{border-style:solid;border-color:var(--olive);background:var(--olivebg)}
.arq img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.erro{color:var(--bad);font-weight:700;font-size:14px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--pri);color:#fff;padding:10px 16px;border-radius:12px;z-index:200;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90%}
.tl{list-style:none;margin:10px 0 0;padding:0}
.tl li{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--mute);font-weight:600}
.tl li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;background:#fff}
.tl li.ok{color:var(--ink)}.tl li.ok i{background:var(--olive);border-color:var(--olive);color:#fff}
.tl li.at{color:var(--pri);font-weight:800}.tl li.at i{border-color:var(--pri);background:var(--pri);color:#fff;box-shadow:0 0 0 4px rgba(47,58,74,.15)}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sel .opc{padding:12px;text-align:center}
.vazio{text-align:center;color:var(--ink2);padding:30px 10px}
.rod{text-align:center;color:var(--mute);font-size:12.5px;padding:24px 10px}
.rod a{color:inherit}
/* painel */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:9px 4px 10px;font-size:12px;font-weight:700;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.nav button span{font-size:20px}
.nav button[aria-current="true"]{color:var(--pri)}
.nav .bol{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;font-weight:800}
.hbt{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.chips{display:flex;gap:6px;overflow:auto;margin-bottom:10px;padding-bottom:2px}
.chips .opc{white-space:nowrap;padding:7px 12px;font-size:13.5px}
.ped{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;border-left:6px solid var(--line)}
.ped.s-novo{border-left-color:var(--acc);animation:pisca 1.2s ease-in-out 3}
@keyframes pisca{50%{box-shadow:0 0 0 6px rgba(181,98,58,.25)}}
.ped.s-confirmado,.ped.s-preparo{border-left-color:var(--blue)}.ped.s-pronto,.ped.s-saiu{border-left-color:var(--warn)}.ped.s-entregue{border-left-color:var(--olive);opacity:.85}.ped.s-cancelado{opacity:.6}
.ped .cab{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ped .num{font-size:20px;font-weight:900}
.st{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px}
.st.novo{background:var(--accbg);color:var(--acc)}.st.confirmado,.st.preparo{background:var(--bluebg);color:var(--blue)}.st.pronto,.st.saiu{background:var(--warnbg);color:var(--warn)}.st.entregue{background:var(--olivebg);color:var(--olive)}.st.cancelado{background:var(--badbg);color:var(--bad)}
.ped .it{padding:4px 0;font-size:14.5px}
.ped .it b{font-weight:800}
.ped .it small{display:block;color:var(--ink2)}
.ped .obs{background:var(--warnbg);color:#6E4F0F;border-radius:10px;padding:6px 10px;font-size:13.5px;margin-top:4px}
.ped .acoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pg{font-size:13px;font-weight:700;border-radius:10px;padding:6px 10px;display:inline-flex;gap:6px;align-items:center}
.pg.ok{background:var(--olivebg);color:var(--olive)}.pg.no{background:var(--warnbg);color:var(--warn)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.kp b{display:block;font-size:22px}
.kp small{color:var(--ink2);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink2);height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}
.ed-prato{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#FCFAF6}
.ed-row{display:flex;gap:8px;align-items:center}
.ed-row .f{flex:1}
.dias{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.dias button{width:34px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:12px;cursor:pointer}
.dias button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-top:6px;cursor:pointer}
.chk input{width:18px;height:18px}
.alerta{position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:300;background:var(--pri);color:#fff;border-radius:16px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.35);width:420px;max-width:calc(100% - 24px)}
.alerta p{margin:4px 0 10px;color:#DCE3EC}
.demo{background:#FFF7E0;color:#7A5410;font-size:12.5px;text-align:center;padding:6px 10px;font-weight:600}
.copiar{display:flex;gap:6px}.copiar input{flex:1}
@media (prefers-reduced-motion: reduce){.quadro{animation:none}*{transition:none!important;animation:none!important}}
</style>
</head>
