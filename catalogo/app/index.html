<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo Fácil</title>
<meta name="theme-color" content="#4E3D31">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#FBF6F1; --paper:#FFFFFF; --cream:#F6EDE4; --peach:#EED6C4; --rose:#D59C86;
  --brown:#735C4B; --brown-d:#4E3D31; --gold:#B8925A; --text:#3E322A; --muted:#8A7A6E;
  --line:#EADDD1; --wa:#1F9D55; --wa-d:#17803F;
  --r:18px; --shadow:0 6px 24px rgba(115,92,75,.12);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,sans-serif;font-size:15px;line-height:1.45;padding-bottom:96px}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
.serif{font-family:"Cormorant Garamond",Georgia,serif}

/* abertura */
.hero{position:relative;overflow:hidden;text-align:center;padding:28px 16px 22px;background:
  radial-gradient(120% 80% at 100% 0%, rgba(213,156,134,.35), transparent 60%),
  radial-gradient(90% 70% at 0% 100%, rgba(238,214,196,.8), transparent 60%), var(--cream)}
.hero img.logo{width:132px;height:132px;border-radius:50%;margin:0 auto 12px;box-shadow:var(--shadow);border:4px solid #fff;object-fit:cover}
.hero h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:34px;color:var(--brown-d);letter-spacing:.3px;line-height:1.05}
.hero p{margin:8px auto 0;max-width:340px;color:var(--brown);font-size:14px}
.steps{display:flex;justify-content:center;gap:8px;margin:16px auto 0;max-width:420px}
.step{flex:1;background:rgba(255,255,255,.75);border-radius:14px;padding:10px 6px;font-size:12px;color:var(--brown-d);font-weight:500}
.step b{display:block;font-size:18px;margin-bottom:2px}

/* filtros */
.filters{position:sticky;top:0;z-index:5;background:rgba(251,246,241,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.busca{max-width:1080px;margin:10px auto 0;padding:0 16px;position:relative;display:flex;align-items:center}
.busca span{position:absolute;left:30px;font-size:16px;pointer-events:none}
.busca input{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:12px 44px 12px 44px;font:inherit;font-size:15px;color:var(--text);-webkit-appearance:none;appearance:none}
.busca input:focus{outline:2px solid var(--peach);border-color:var(--rose)}
.busca input::-webkit-search-cancel-button{display:none}
.busca button{position:absolute;right:26px;width:30px;height:30px;border-radius:50%;border:0;background:var(--cream);font-size:18px;line-height:1;color:var(--brown)}
.cod{display:inline-block;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin-bottom:2px}
.vazio{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.vazio b{color:var(--brown-d)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;max-width:1080px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--brown)}
.chip.on{background:var(--brown);border-color:var(--brown);color:#fff}

.note{max-width:1080px;margin:14px auto 0;padding:0 16px}
.note div{background:#fff;border:1px dashed var(--rose);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--brown)}

/* grade */
.grid{max-width:1080px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--paper);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 10px rgba(115,92,75,.08);display:flex;flex-direction:column;border:0;padding:0;text-align:left}
.card .ph{position:relative;aspect-ratio:4/5;background:var(--cream)}
.card .ph img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);color:var(--brown-d);font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:999px}
.badge.n{left:auto;top:auto;right:8px;bottom:8px}
.card .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{margin:0;font-size:13.5px;font-weight:600;color:var(--brown-d);line-height:1.25}
.price{font-size:12.5px;color:var(--muted)}
.price b{color:var(--brown);font-size:14px}
.card .cta{margin-top:auto;padding-top:8px;font-size:12.5px;font-weight:600;color:var(--rose)}

/* barra do pedido */
.bag{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;max-width:560px;margin:0 auto;background:var(--brown-d);color:#fff;border:0;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(78,61,49,.35);transform:translateY(140%);transition:transform .3s}
.bag.show{transform:none}
.bag .count{background:var(--rose);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:700;font-size:13px}
.bag .t{flex:1;text-align:left;font-weight:600}
.bag .t small{display:block;font-weight:400;opacity:.8;font-size:12px}

/* folhas (modais) */
.sheet{position:fixed;inset:0;z-index:30;display:none}
.sheet.open{display:block}
.sheet .bk{position:absolute;inset:0;background:rgba(62,50,42,.45)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:0 0 calc(18px + env(safe-area-inset-bottom));animation:up .28s ease}
@media(min-width:720px){.sheet .pn{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:520px;border-radius:22px;animation:none}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 0}
.x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:20px;line-height:1;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal-wrap{position:relative;overflow:hidden;border-radius:22px 22px 0 0}
.gal{align-items:flex-start;transition:height .25s ease}
.gal img{flex:none;width:100%;height:auto;display:block;scroll-snap-align:start;cursor:zoom-in}
.zoom-hint{position:absolute;right:10px;bottom:10px;background:rgba(62,50,42,.72);color:#fff;font-size:11.5px;font-weight:600;border-radius:999px;padding:5px 10px;pointer-events:none}
.lbx{position:fixed;inset:0;z-index:80;background:#0d0b0a;display:none}
.lbx.open{display:block}
.lb-track{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lb-track::-webkit-scrollbar{display:none}
.lb-sl{flex:none;width:100%;height:100%;overflow:auto;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom;position:relative;isolation:isolate}
.lb-sl::before{content:"";position:fixed;inset:-60px;z-index:-1;background:var(--bg) center/cover no-repeat;filter:blur(34px) brightness(.62) saturate(1.15);transform:scale(1.1)}
.lb-sl::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,.35))}
.lb-sl img,.lb-sl video{max-width:100%;max-height:100%;object-fit:contain;transition:width .2s;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.lb-sl.z{display:block}
.lb-sl.z img{max-width:none;max-height:none;width:220%}
.lb-x{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:24px;line-height:1}
.lb-n{position:fixed;top:calc(24px + env(safe-area-inset-top));left:16px;z-index:2;color:#fff;font-size:13px;font-weight:600;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:999px}
.lb-tip{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:rgba(255,255,255,.8);font-size:12px;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:999px;white-space:nowrap}
.gal video{flex:none;width:100%;height:auto;display:block;scroll-snap-align:start;background:transparent}
.ph-edit .t video{width:100%;height:100%;object-fit:cover;border-radius:10px;background:#000}
.ph-edit .t.vid::after{content:"▶ vídeo";position:absolute;left:4px;bottom:4px;background:rgba(255,255,255,.9);font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;color:var(--brown-d)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brown)}
.inner{padding:14px 16px 0}
.inner h2{margin:0;padding-right:40px;font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;font-weight:600;color:var(--brown-d);line-height:1.1}
.inner .desc{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.fld{margin-top:16px}
.fld label,.fld .lb{display:block;font-size:13px;font-weight:600;color:var(--brown-d);margin-bottom:6px}
.fld .hint{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=date],input[type=email],textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit;font-size:15px;color:var(--text)}
input:focus,textarea:focus{outline:2px solid var(--peach);border-color:var(--rose)}
textarea{min-height:70px;resize:vertical}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px 6px 6px;font-size:12.5px}
.sw button span{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.sw button.on{border-color:var(--brown);box-shadow:0 0 0 1px var(--brown) inset;font-weight:600}
.tog{display:flex;gap:8px}
.tog button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:13px}
.tog button.on{border-color:var(--brown);background:var(--cream);font-weight:600}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px}
.qty input{width:80px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;font-size:16px;font-weight:600}
.tiers{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tiers span{font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--brown)}
.tiers span.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:600}
.foto-up .fu-btn{display:block;text-align:center;background:#fff;border:1.5px dashed var(--rose);border-radius:12px;padding:14px;font-size:14px;font-weight:600;color:var(--brown);cursor:pointer}
.foto-up input{display:none}
.foto-up .hint{margin:6px 0 0;font-size:12px}
.fu-prev{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.fu-prev img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.fu-prev span{flex:1;font-size:13px;color:var(--brown-d);font-weight:600}
.fu-prev span small{display:block;font-weight:400;color:var(--muted)}
.fu-prev button{border:0;background:none;color:var(--rose);font-weight:600;font-size:12.5px}
.cli-fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cli-fotos img{width:84px;height:84px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.photo-box{background:#fff;border:1px dashed var(--rose);border-radius:12px;padding:12px;font-size:13px;color:var(--brown)}
.total{margin:18px 16px 0;background:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.total small{display:block;color:var(--muted);font-size:11.5px}
.total b{font-size:20px;color:var(--brown-d)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 32px);margin:12px 16px 0;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:15px;background:var(--brown);color:#fff}
.btn.wa{background:var(--wa)}
.btn.ghost{background:transparent;color:var(--brown);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.5}
.err{color:#B4423A;font-size:12px;margin-top:6px;display:none}

/* lista do pedido */
.item{display:flex;gap:10px;background:#fff;border-radius:14px;padding:10px;margin-top:10px}
.item img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}
.item .m{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}
.item .m b{display:block;color:var(--brown-d);font-size:13.5px}
.item .rm{border:0;background:none;color:var(--rose);font-size:12px;font-weight:600;align-self:flex-start;padding:4px}
.empty{text-align:center;color:var(--muted);padding:30px 0}

.ribbon{background:var(--brown-d);color:#fff;text-align:center;font-size:11px;font-weight:600;letter-spacing:1.5px;padding:6px}
.filters{top:var(--tb,31px)}
.topbar{position:sticky;top:0;z-index:7}
.viewas{background:#fff;border-bottom:1px solid var(--line);padding:8px 16px 8px;text-align:center}
.seg{display:flex;max-width:420px;margin:0 auto;background:var(--cream);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:9px 6px;font-size:13px;font-weight:600;color:var(--brown)}
.seg button.on{background:var(--brown-d);color:#fff;box-shadow:0 2px 8px rgba(78,61,49,.25)}
.viewas p{margin:6px auto 0;max-width:420px;font-size:11.5px;color:var(--muted);line-height:1.35}
.viewas p b{color:var(--brown-d)}
.adm-wrap .viewas{border-bottom:0}
.wa-chat{margin-top:14px;background:#ECE5DD;border-radius:14px;padding:14px}
.bubble{background:#DCF8C6;border-radius:10px 0 10px 10px;padding:10px 12px;font-size:13px;white-space:pre-wrap;color:#222;margin-left:auto;max-width:92%;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.linkish{display:block;margin:14px auto 0;border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline}
.nt{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.nt i{font-style:normal;font-size:20px;line-height:1.2}
.nt div{min-width:0}
.nt small{display:block;font-size:11px;color:var(--muted)}
.nt b{display:block;font-size:13px;color:var(--brown-d);margin-top:1px}
.nt p{margin:2px 0 0;font-size:12px;color:var(--text)}
.nbadge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:#D64545;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.adm-nav button{position:relative}
.newbox{background:linear-gradient(90deg,#FFF4E6,#fff);border:1px solid #F1D3B3}
.enc.isnew{box-shadow:0 0 0 2px var(--rose)}
.newtag{font-style:normal;font-size:10px;font-weight:700;background:#D64545;color:#fff;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.brinde{margin-top:10px;background:#FFF4E6;border:1px dashed var(--rose);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--brown-d)}
.brinde.ok{background:#E3F4E9;border:1px solid #9ED3B0;color:#1F7A44}
.brinde-ban{max-width:1080px;margin:12px auto 0;padding:0 16px}
.brinde-ban>div{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:8px 14px 8px 8px;box-shadow:0 2px 10px rgba(115,92,75,.08)}
.brinde-ban img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}
.brinde-ban span{font-size:13px;color:var(--brown)}
.brinde-ban b{display:block;color:var(--brown-d);font-size:14px}
.lojas{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--brown)}
.lojas:empty{display:none}
.loja{border:0;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:#fff}
.rede{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 12px 7px 9px;font-size:12.5px;font-weight:700;margin:3px}
.rede svg{width:17px;height:17px;flex:none}
.rd-g{width:100%;text-align:center;margin-top:6px}
.rd-g small{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.share-row .rede{padding:5px 10px 5px 8px;font-size:11.5px;margin:0}
.rd-edit{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.rd-edit label{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--brown-d)}
.rd-edit label i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.rd-edit label i svg{width:15px;height:15px}
.rd-edit input{margin-top:4px}
.rd-h{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 0;text-transform:uppercase;letter-spacing:.6px}
.mini.loja{padding:6px 10px;font-size:11.5px;border:0;color:#fff}
.lojas.foot{max-width:520px;margin:20px auto 0;padding:0 16px}
.share-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.share-sheet .link-box{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--brown);word-break:break-all}
.ended{position:fixed;inset:0;z-index:60;background:var(--cream);display:none;place-items:center;text-align:center;padding:24px}
.ended.show{display:grid}
.ended h2{font-size:32px;color:var(--brown-d);margin:0}
.ended p{color:var(--brown);max-width:320px;margin:10px auto 0}
.ended .btn{width:100%;max-width:320px;margin:20px auto 0}
.adm-open{margin:16px auto 0;display:inline-block;border:1px solid var(--rose);background:rgba(255,255,255,.7);color:var(--brown-d);border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:600}
.adm .inner{padding-bottom:6px}
.adm-tabs{display:flex;gap:8px;margin-top:12px}
.adm-tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:13px;font-weight:600;color:var(--brown)}
.adm-tabs button.on{background:var(--brown);border-color:var(--brown);color:#fff}
.adm-info{margin-top:12px;background:#fff;border:1px dashed var(--rose);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--brown)}
.adm-item{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px;margin-top:8px}
.adm-item img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--cream)}
.adm-item .m{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.adm-item .m b{display:block;color:var(--brown-d);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-item.off img,.adm-item.off .m{opacity:.45}
.adm-acts{display:flex;flex-direction:column;gap:4px}
.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:11.5px;font-weight:600;color:var(--brown);white-space:nowrap}
.mini.del{color:#B4423A}
.ph-edit{display:flex;gap:8px;flex-wrap:wrap}
.ph-edit .t{position:relative;width:78px;height:78px}
.ph-edit .t img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.ph-edit .t button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--brown-d);color:#fff;font-size:14px;line-height:1}

.btn.del{color:#B4423A}

.filebox{display:block;background:#fff;border:1.5px dashed var(--rose);border-radius:12px;padding:14px;text-align:center;font-size:13px;font-weight:600;color:var(--brown);cursor:pointer}

.send-box{border:1px solid var(--line)}
.sb-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--brown-d)}

/* abertura padrão DayIA */
#intro{position:fixed;inset:0;z-index:100;background:#0E2238;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
#intro.fim{opacity:0;pointer-events:none}
#intro .quadro{width:76px;height:76px;background:#fff;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:cresce 1.4s cubic-bezier(.2,.8,.2,1) forwards}
#intro .quadro img{width:100%;height:100%;display:block;border-radius:10px}
#intro .by{position:absolute;display:flex;align-items:center;gap:10px;font-size:22px;color:#CFE2F2;opacity:0;transition:opacity .45s ease}
#intro .by img{height:40px;width:auto;display:block}
#intro.passo2 .quadro{opacity:0;transition:opacity .3s}
#intro.passo2 .by{opacity:1}
@keyframes cresce{0%{transform:scale(.6) rotate(0);opacity:0}20%{opacity:1}55%{transform:scale(1.6) rotate(0)}100%{transform:scale(1.6) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#intro{display:none}}


.ribbon{display:flex;align-items:center;justify-content:center;gap:6px;line-height:18px;padding:6px 10px 7px}
.ribbon img{height:14px;width:auto;display:block}
.by-dayia{display:inline-flex;align-items:center;gap:7px;margin-top:10px;background:#0E2238;color:#CFE2F2;border-radius:999px;padding:7px 14px;font-size:12px;text-decoration:none}
.by-dayia img{height:16px;width:auto;display:block}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 16px 10px}
footer b{color:var(--brown)}
.toast{position:fixed;left:50%;width:max-content;bottom:calc(88px + env(safe-area-inset-bottom));max-width:calc(100% - 32px);text-align:center;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--brown-d);color:#fff;padding:10px 16px;border-radius:16px;font-size:13px;z-index:50;transition:transform .3s,opacity .3s}
.toast.show{transform:translate(-50%,0);opacity:1}

#intro.artesa{background:radial-gradient(120% 90% at 50% 40%,#FFF9F3 0%,#F6EDE4 55%,#EED6C4 100%);transition:opacity .5s ease,background-color .5s ease}
#intro.artesa .quadro{width:132px;height:132px;border-radius:50%;padding:8px;background:#fff;box-shadow:0 14px 40px rgba(115,92,75,.22);position:relative;animation:ateFlor 1.1s cubic-bezier(.2,.9,.25,1.1) both}
#intro.artesa .quadro img{border-radius:50%;width:100%;height:100%;object-fit:cover;animation:ateFoco 1.1s ease-out both}
#intro.artesa .costura{position:absolute;inset:-16px;width:164px;height:164px;transform:rotate(-90deg);overflow:visible}
#intro.artesa .costura .pt{fill:none;stroke:#D59C86;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:6 7}
#intro.artesa .costura .mk{fill:none;stroke:#fff;stroke-width:8;stroke-dasharray:100;stroke-dashoffset:100;animation:ateCostura 1.1s .35s ease-in-out forwards}
#intro.artesa .fa{position:absolute;font-style:normal;color:#B8925A;opacity:0;animation:ateFaisca 1s ease-out forwards}
#intro.artesa .f1{top:-14px;right:-6px;font-size:20px;animation-delay:.9s}
#intro.artesa .f2{bottom:4px;left:-18px;font-size:14px;animation-delay:1.15s}
#intro.artesa .f3{top:26px;left:-24px;font-size:12px;animation-delay:1.35s}
#intro.artesa .by{color:#CFE2F2}
#intro.artesa.passo2{background:#0E2238}
#intro.artesa.passo2 .quadro{animation:ateSai .35s ease-in forwards}
@keyframes ateFlor{0%{transform:translateY(18px) scale(.82);opacity:0}100%{transform:none;opacity:1}}
@keyframes ateFoco{0%{filter:blur(5px)}100%{filter:none}}
@keyframes ateCostura{to{stroke-dashoffset:0}}
@keyframes ateFaisca{0%{opacity:0;transform:scale(.3) rotate(-20deg)}55%{opacity:1;transform:scale(1.15) rotate(8deg)}100%{opacity:.85;transform:scale(1) rotate(0)}}
@keyframes ateSai{to{opacity:0;transform:scale(.9)}}
</style>
</head>

<script>
/* ======================= base ======================= */
var SID_FIXO="AKfycbwM8aZF4jJ-DhHTYZ8B-CPI5sKfW77ZkPni62IGI14mSxUEK7dYeO2-o4aJBx5vXolX";   /* depois de implantar o servidor, cole aqui o código da implantação */
var Q=new URLSearchParams(location.search);
function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x?JSON.parse(x):null}if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return null}}
if(Q.get("s"))ls("cf-s",Q.get("s"));
var SID=SID_FIXO||Q.get("s")||ls("cf-s")||"";
var API=Q.get("api")||(SID?"https://script.google.com/macros/s/"+SID+"/exec":"");
var DEMO=!API||Q.get("demo")==="1",EMBED=Q.get("embed")==="1";
var NEG=(Q.get("n")||(DEMO?"bab-atelie":"")).toLowerCase().trim();
var LOGO_PADRAO={"bab-atelie":"demo/logo-bab.jpg"};
var WHATS_DAYIA="5519999389118";
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function brl(v){return "R$ "+(Number(v)||0).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".")}
const soNum=s=>String(s||"").replace(/\D/g,"");
const uid=()=>Math.random().toString(36).slice(2,9);
const soma=(arr,f)=>arr.reduce((a,x)=>a+(+f(x)||0),0);
const num=s=>{s=String(s==null?"":s).trim();if(/,/.test(s))s=s.replace(/\./g,"").replace(",",".");return parseFloat(s)||0};
var FUSO=-180;
const dIso=t=>new Date(t+FUSO*6e4).toISOString().slice(0,10);
const hojeISO=()=>dIso(Date.now());
const addDias=n=>dIso(Date.now()+n*864e5);
const dBR=s=>s?s.slice(8,10)+"/"+s.slice(5,7):"—";
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function telBR(t){const n=soNum(t).replace(/^55/,"");if(n.length===11)return `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`;if(n.length===10)return `(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`;return t||""}
function normTel(t){let n=soNum(t).replace(/^0+/,"");if(n.length===10||n.length===11)n="55"+n;return n}
function anivTxt(a){return a?a.slice(3,5)+"/"+a.slice(0,2):""}
function anivDe(txt){const m=(txt||"").match(/(\d{1,2})\D+(\d{1,2})/);if(!m)return "";const d=+m[1],mo=+m[2];if(d<1||d>31||mo<1||mo>12)return "";return String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function diasAteAniv(a){if(!a)return 999;const h=new Date();h.setHours(0,0,0,0);let d=new Date(h.getFullYear(),+a.slice(0,2)-1,+a.slice(3,5));if(d<h)d.setFullYear(h.getFullYear()+1);return Math.round((d-h)/864e5)}
function wa(n,txt){n=soNum(n);if(n&&n.length<=11)n="55"+n;return "https://wa.me/"+n+"?text="+encodeURIComponent(txt)}
let tt;function toast(s){const t=$("#toast");t.textContent=s;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)}
function copiar(txt,msg){const ok=()=>toast(msg||"Copiado!");if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,velho);else velho();
  function velho(){const t=document.createElement("textarea");t.value=txt;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){prompt("Copie:",txt)}t.remove()}}

/* fotos e vídeos: "d:ID" = arquivo no Google Drive da loja */
function src(r){r=String(r||"");return r.slice(0,2)==="d:"?"https://drive.google.com/thumbnail?id="+r.slice(2)+"&sz=w1600":r}
function imgErr(im){const m=String(im.src).match(/[?&]id=([^&]+)/);if(m&&!im.dataset.t){im.dataset.t=1;im.src="https://lh3.googleusercontent.com/d/"+m[1]+"=w1600"}}
function videoHtml(r,poster){r=String(r||"");if(r.slice(0,2)==="d:")return `<iframe class="dv" src="https://drive.google.com/file/d/${esc(r.slice(2))}/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy" title="Vídeo"></iframe>`;
  return `<video src="${esc(r)}" poster="${esc(src(poster))}" muted loop playsinline controls preload="metadata"></video>`}
function imgHtml(r,alt,extra){return `<img src="${esc(src(r))}" alt="${esc(alt||"")}" onerror="imgErr(this)" ${extra||""}>`}

/* ======================= servidor ======================= */
function api(acao,d){
  d=Object.assign({acao:acao,n:NEG},d||{});
  if(DEMO)return new Promise((ok,no)=>setTimeout(()=>{try{ok(JSON.parse(JSON.stringify(DEMOAPI(d))))}catch(e){e.servidor=true;no(e)}},acao==="versao"?20:260));
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d),redirect:"follow"})
    .then(r=>r.json())
    .then(j=>{$("#offline").hidden=true;if(j&&j.erro){const e=new Error(j.erro);e.servidor=true;throw e}return j},
      e=>{if(!e.servidor)$("#offline").hidden=false;throw e});
}

/* ======================= preços (iguais ao servidor) ======================= */
function faixaDe(F,q){let f={min:1,desc:0};(F||[]).forEach(x=>{if(q>=x.min)f=x});return f}
function promoDeL(promos,p){let best=null;(promos||[]).forEach(r=>{if((r.alvo==="todas"||r.alvo===p.cat||r.alvo===p.id)&&(!best||r.desc>best.desc))best=r});return best}
function precoItemL(p,q,F,promos){const d=p.campos.lembr?faixaDe(F,q).desc:0,pr=promoDeL(promos,p);return Math.round(p.preco*q*(1-d)*(1-(pr?pr.desc/100:0))*100)/100}
function faixasTxt(F){return F.map((f,i)=>Object.assign({},f,{txt:i?`${f.min}+ un.: ${Math.round(f.desc*100)}% off`:(F[1]?`1 a ${F[1].min-1} un.`:"1 un.")}))}

function lerVcf(txt){return txt.split(/BEGIN:VCARD/i).slice(1).map(b=>{
  const fn=(b.match(/^FN[^:]*:(.*)$/im)||[])[1]||((b.match(/^N[^:]*:(.*)$/im)||[])[1]||"").split(";").filter(Boolean).reverse().join(" ");
  const tel=(b.match(/^TEL[^:]*:(.*)$/im)||[])[1]||"",bd=soNum((b.match(/^BDAY[^:]*:(.*)$/im)||[])[1]||"");
  return {nome:fn.trim(),tel,aniv:bd.length>=4?bd.slice(-4,-2)+"-"+bd.slice(-2):""}})}
function lerLinhas(txt){return txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!/^nome[;,]/i.test(l)).map(l=>{
  const p=l.split(/[;,\t]/).map(s=>s.trim()),ti=p.findIndex(s=>soNum(s).length>=8),tel=ti>=0?p[ti]:"";
  const nome=p.find((s,i)=>i!==ti&&/[a-zA-ZÀ-ú]/.test(s))||"",resto=p.find((s,i)=>i!==ti&&/^\d{1,2}\/\d{1,2}/.test(s))||"";
  return {nome,tel,aniv:anivDe(resto)}})}

function mktCfg(){return P.d.negocio.mkt||MKT_PADRAO}
function enviosHoje(){return P.d.envios.n||0}
function podeEnviar(){
  const E=P.d.envios,m=mktCfg(),n=enviosHoje(),hr=new Date().getHours();
  if(n>=m.limite)return {ok:false,motivo:`Você chegou ao limite de ${m.limite} mensagens de hoje. Continue amanhã: isso protege seu WhatsApp.`};
  const espera=Math.ceil(((E.ultimo||0)+15000-Date.now())/1000);
  if(espera>0)return {ok:false,espera,motivo:`Aguarde ${espera}s antes do próximo envio. A pausa entre mensagens deixa seu WhatsApp com cara de conversa normal.`};
  if(hr<m.hIni||hr>=m.hFim)return {ok:DEMO,fora:true,motivo:`Fora do horário de envio (${m.hIni}h às ${m.hFim}h). Mensagens de noite ou de madrugada parecem propaganda e aumentam as denúncias.`};
  return {ok:true};
}

function lerCampos(){
  const e=P.ed;if(!e||!$("#eNome"))return;
  e.nome=$("#eNome").value;e.desc=$("#eDesc").value;e.cat=$("#eCat").value;e.preco=num($("#ePreco").value);e.shopee=fixUrl($("#eShopee").value);e.tiktok=fixUrl($("#eTiktok").value);
  $$(".sheet.dyn [data-c]").forEach(k=>e.campos[k.dataset.c]=k.checked?1:0);
}
function lerArquivo(fl){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok({tipo:fl.type,dados:r.result});r.onerror=()=>no(new Error("Não consegui ler o arquivo."));r.readAsDataURL(fl)})}
async function subirMidias(files,video){
  lerCampos();P.subindo=true;sheetPeca();let k=0;
  for(const fl of files){
    k++;toast(files.length>1?`Enviando ${k} de ${files.length}…`:(video?"Enviando o vídeo… pode levar um minutinho":"Enviando a foto…"));
    try{
      let ref;
      if(video){
        if(fl.size>30*1024*1024)throw new Error("Esse vídeo é grande demais. Use um de até 40 segundos.");
        ref=DEMO?URL.createObjectURL(fl):(await api("subirMidia",{token:P.tk,arquivo:await lerArquivo(fl)})).ref;
        P.ed.videos=P.ed.videos||[];P.ed.videos.push(ref);
      }else{
        const a=await prepararImg(fl,DEMO?900:1600,DEMO?.78:.84);
        ref=(await api("subirMidia",{token:P.tk,arquivo:a})).ref;P.ed.fotos.push(ref);
      }
    }catch(e){if(pErro(e))return;toast(e.message);break}
  }
  P.subindo=false;if(P.ed)sheetPeca();
}
