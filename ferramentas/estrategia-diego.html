<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estratégia de vendas por carteira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECEE; --surface:#F6F8F9; --surface2:#FFFFFF; --ink:#16222A; --muted:#5A6A74; --line:#C8D1D6;
  --blue:#1D5E8C; --blue-soft:#DCE8F1;
  --c-chave:#1D5E8C; --c-crescer:#6FA3C7; --c-esfriando:#D09A1C; --c-reativar:#BF512C; --c-adormecido:#8A7968; --c-nunca:#B9C2C8; --c-fora:#4E7D5B;
  --good:#2F7A4A; --bad:#B23F2A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10171C; --surface:#172229; --surface2:#1C2931; --ink:#E4EBEF; --muted:#94A4AE; --line:#2C3C46;
    --blue:#5EA2D4; --blue-soft:#1C3444; --c-chave:#4E93C8; --c-crescer:#86B6D8; --c-nunca:#56646C; --c-adormecido:#8F7F70;
    --good:#5DB47E; --bad:#E0735C;
  }
}
:root[data-theme="dark"]{
  --bg:#10171C; --surface:#172229; --surface2:#1C2931; --ink:#E4EBEF; --muted:#94A4AE; --line:#2C3C46;
  --blue:#5EA2D4; --blue-soft:#1C3444; --c-chave:#4E93C8; --c-crescer:#86B6D8; --c-nunca:#56646C; --c-adormecido:#8F7F70;
  --good:#5DB47E; --bad:#E0735C;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px}
header.top h1{margin:0;font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.05;letter-spacing:.2px}
header.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
nav.tabs{display:flex;gap:4px;margin:22px 0 0;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{font:600 22px/1 "Barlow Condensed",sans-serif;background:none;border:0;color:var(--muted);padding:10px 16px 12px;cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.lead{font-family:"Barlow Condensed",sans-serif;font-size:clamp(24px,3vw,32px);font-weight:600;line-height:1.15;margin:26px 0 6px;max-width:30ch}
.sub{color:var(--muted);margin:0 0 20px;max-width:75ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--surface);padding:14px 16px}
.kpi .v{font:700 30px/1.1 "Barlow Condensed",sans-serif}
.kpi .l{color:var(--muted);font-size:13.5px}
.kpi .d{font-size:13.5px;font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}
/* faixa da carteira */
.band-wrap{margin:30px 0 8px}
.band-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.band-head h3{margin:0;font-size:22px;font-weight:600}
.band-head span{color:var(--muted);font-size:13.5px}
.band{display:flex;height:84px;margin-top:10px;border-radius:3px;overflow:hidden;gap:2px}
.band button{border:0;cursor:pointer;color:#fff;text-align:left;padding:8px 9px;min-width:0;display:flex;flex-direction:column;justify-content:space-between;transition:filter .15s}
.band button:hover{filter:brightness(1.08)}
.band button.dim{filter:saturate(.35) brightness(1.1);opacity:.55}
.band button b{font:700 26px/1 "Barlow Condensed",sans-serif}
.band button small{font-size:12.5px;line-height:1.15;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.band button.light{color:#16222A}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* colunas */
.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;margin-top:30px}
.panel h3{font-size:22px;margin:0 0 10px;font-weight:600}
ol.focus{margin:0;padding:0;list-style:none;counter-reset:f}
ol.focus li{counter-increment:f;position:relative;padding:10px 0 10px 44px;border-top:1px solid var(--line)}
ol.focus li::before{content:counter(f);position:absolute;left:0;top:9px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 17px/30px "Barlow Condensed",sans-serif;text-align:center}
ol.focus li b{font-weight:600}
table.cad{width:100%;border-collapse:collapse;font-size:14px}
table.cad td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
table.cad td:first-child{white-space:nowrap;font-weight:600}
table.cad .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.alloc{display:flex;height:12px;border-radius:2px;overflow:hidden;margin:12px 0 4px}
.alloc-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:6px;flex-wrap:wrap}
/* gráfico */
.chart{margin-top:34px;background:var(--surface);border:1px solid var(--line);padding:16px 16px 10px}
.chart h3{margin:0 0 2px;font-size:22px;font-weight:600}
.chart p{margin:0 0 8px;color:var(--muted);font-size:13.5px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:"Barlow",sans-serif;font-size:11px}
/* tabela */
.list{margin-top:34px}
.list-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.list-head h3{margin:0;font-size:22px;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:5px 12px;font:500 14px "Barlow",sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
input.search{border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:7px 12px;border-radius:4px;font:15px "Barlow",sans-serif;min-width:220px}
.tscroll{overflow-x:auto;border:1px solid var(--line);background:var(--surface2)}
table.cl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:780px}
table.cl th{position:sticky;top:0;background:var(--surface);text-align:left;font:600 14px "Barlow",sans-serif;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
table.cl th.num,table.cl td.num{text-align:right}
table.cl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.cl tr.row{cursor:pointer}
table.cl tr.row:hover td{background:var(--blue-soft)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:3px;color:#fff;white-space:nowrap}
.tag.light{color:#16222A}
.flag{font-size:12px;font-weight:600;color:var(--bad);margin-left:6px;white-space:nowrap}
.flag.f{color:var(--c-fora)}
.nm{font-weight:500}
.cc{color:var(--muted);font-size:12.5px}
tr.det td{background:var(--surface);padding:12px 14px 16px}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.det-grid h4{margin:0 0 4px;font-size:13.5px;color:var(--muted);font-weight:600}
.det-grid ul{margin:0;padding-left:18px}
.obs{margin-top:10px;padding:8px 10px;border-left:3px solid var(--c-esfriando);background:var(--surface2);font-size:14px}
.script{margin-top:10px;font-size:14px;color:var(--ink)}
.more{margin:12px auto 0;display:block}
.note{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;max-width:85ch}
/* empresa */
table.cmp{width:100%;border-collapse:collapse;font-size:15px;min-width:640px}
table.cmp th,table.cmp td{padding:10px;border-bottom:1px solid var(--line);text-align:right}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp th{color:var(--muted);font-weight:600;font-size:14px}
.house{margin-top:28px}
.house li{margin:4px 0}

/* itens */
.items{margin-top:34px}
.items h3{margin:0;font-size:22px;font-weight:600}
.fam{display:grid;grid-template-columns:minmax(150px,210px) 1fr auto;gap:5px 12px;align-items:center;margin:14px 0 18px;font-size:14px}
.fam .bar{height:14px;background:var(--line);border-radius:2px;overflow:hidden}
.fam .bar div{height:100%;background:var(--c-chave)}
.fam .val{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.fam .val small{color:var(--muted);margin-left:6px}
table.it{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
table.it th{background:var(--surface);text-align:left;font-weight:600;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
table.it td{padding:7px 10px;border-bottom:1px solid var(--line)}
table.it .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.it .cod{font-weight:600;white-space:nowrap}
@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:1fr}
  .band{height:72px}
  .band button b{font-size:21px}
  .det-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function stats(S){
  const L=DATA.sellers[S], K=L.filter(c=>c.k), F=L.filter(c=>!c.k);
  const s12=K.reduce((a,c)=>a+(c.s||0),0), p12=K.reduce((a,c)=>a+(c.p||0),0);
  const ativos=K.filter(c=>c.dd!=null&&c.dd<=180).length;
  const top5=K.map(c=>c.s||0).sort((a,b)=>b-a).slice(0,5).reduce((a,b)=>a+b,0);
  const potR=K.filter(c=>(c.g==="reativar"||c.g==="esfriando")&&c.c!=="0021006").reduce((a,c)=>a+(c.pt||0),0);
  const bySeg={};ORDER.forEach(g=>{const x=K.filter(c=>c.g===g);bySeg[g]={n:x.length,s:x.reduce((a,c)=>a+(c.s||0),0),pt:x.reduce((a,c)=>a+(c.pt||0),0)}});
  const monK=DATA.months.map((_,i)=>K.reduce((a,c)=>a+(c.mo?c.mo[i]:0),0));
  const monF=DATA.months.map((_,i)=>F.reduce((a,c)=>a+(c.mo?c.mo[i]:0),0));
  return{L,K,F,s12,p12,ativos,top5,potR,bySeg,monK,monF,fs12:F.reduce((a,c)=>a+(c.s||0),0)};
}

function drawChart(st){
  const W=900,H=240,pl=48,pb=26,pt=10,n=DATA.months.length,bw=(W-pl-10)/n;
  const tot=st.monK.map((v,i)=>v+st.monF[i]);const mx=Math.max(...tot,1);
  const step=[1e3,2e3,5e3,1e4,2e4,5e4,1e5,2e5,5e5].find(s=>mx/s<=5)||1e6;const top=Math.ceil(mx/step)*step;
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  let g="";for(let v=0;v<=top;v+=step){g+=`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v>=1e3?(v/1e3)+" mil":v}</text>`}
  DATA.months.forEach((m,i)=>{const x=pl+i*bw+2,w=bw-4;const k=st.monK[i],f=st.monF[i];
    g+=`<rect x="${x}" y="${y(k)}" width="${w}" height="${y(0)-y(k)}" fill="var(--c-chave)"><title>${MN[m%100-1]}/${String(m).slice(2,4)}: carteira ${brl(k)}, fora ${brl(f)}</title></rect>`;
    g+=`<rect x="${x}" y="${y(k+f)}" width="${w}" height="${y(k)-y(k+f)}" fill="var(--c-fora)"><title>${MN[m%100-1]}/${String(m).slice(2,4)}: carteira ${brl(k)}, fora ${brl(f)}</title></rect>`;
    if(i%3===0)g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${MN[m%100-1]}/${String(m).slice(2,4)}</text>`});
  document.getElementById("chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento mensal">${g}</svg>`;
}

function defaultSort(){
  if(state.fora||state.queda) return ["s",-1];

  return ["s",-1];
}
const COLS=[["n", "Cliente", 0], ["g", "Situação", 0], ["s", "12 meses", 1], ["p", "12 m anteriores", 1], ["m", "Meses c/ compra", 1], ["l", "Última compra", 1], ["pt", "Potencial/ano", 1]];

function drawTable(S,st){

    if(open)r+=`<tr class="det"><td colspan="7">${detail(c,S)}</td></tr>`;

  tbl.querySelectorAll("tr.row").forEach(tr=>{const t=()=>{const c=tr.dataset.c;state.open.has(c)?state.open.delete(c):state.open.add(c);drawTable(S,st)};tr.onclick=t;tr.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t()}}});
  document.getElementById("morebox").innerHTML=L.length>state.limit?`<button class="chip more" id="more">Mostrar mais ${Math.min(60,L.length-state.limit)} de ${L.length-state.limit} restantes</button>`:`<p style="color:var(--muted);font-size:13.5px;margin:8px 0 0">${L.length} clientes neste filtro.</p>`;
  const m=document.getElementById("more");if(m)m.onclick=()=>{state.limit+=60;drawTable(S,st)};
}

function spark(mo){

  return `<svg viewBox="0 0 ${W} ${H}" width="240" height="40" aria-hidden="true">${mo.map((v,i)=>`<rect x="${i*bw+1}" y="${H-(v/mx)*(H-2)}" width="${bw-2}" height="${(v/mx)*(H-2)}" fill="${v?"var(--c-chave)":"var(--line)"}"/>`).join("")}<rect x="0" y="${H-1}" width="${W}" height="1" fill="var(--line)"/></svg>`;
}
function script(c){

  if(c.g==="reativar"||c.g==="adormecido") return `Abordagem: "Vocês compravam ${esc(it)} com a gente. Temos estoque e condição nova. Quem cuida dessa compra hoje?"`;
  if(c.g==="nunca") return `Abordagem: identificar a manutenção e o comprador, apresentar a Empresa Modelo e o catálogo técnico.`;
  if(c.q) return `Abordagem: pedir reunião com o comprador. O volume caiu mais da metade em relação aos 12 meses anteriores.`;
  if(c.g==="chave") return `Abordagem: antecipar a reposição de ${esc(it)} e oferecer pedido programado.`;

}

<script>
/* ===== Trazer cliente para a minha carteira (sincroniza com a Central de Vendas) ===== */
(function(){

 const KS={Ana:"ANA",Diego:"DIEGO",Bruno:"BRUNO",Carla:"CARLA"};

 const BASE=JSON.parse(JSON.stringify(DATA.sellers));
 let TR={};

 function aplica(){le();
  Object.keys(BASE).forEach(S=>DATA.sellers[S]=JSON.parse(JSON.stringify(BASE[S])));
  Object.entries(TR).forEach(([k,t])=>{if(!t||!k.startsWith("v|"))return;const cod=k.slice(2),de=KS[t.de],para=KS[t.para];

    if(r){r.k=1;r._tr=1}else{const o=achaRow();if(o){const c=JSON.parse(JSON.stringify(o));c.k=1;c._tr=1;L.push(c)}}}});}

 const css=document.createElement("style");css.textContent=`.trB{margin-top:10px;padding:8px 10px;border:1px dashed var(--line);background:var(--surface2);display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.trBt{font:600 14px "Barlow",Arial,sans-serif;border:1px solid var(--blue);color:var(--blue);background:var(--surface2);border-radius:6px;padding:6px 10px;cursor:pointer}.trBt.main{background:var(--blue);color:#fff}
.trQ{background:#FFF1B8;color:#5a4500;border-radius:4px;padding:2px 6px}.trD{color:var(--muted);font-size:13px}.trN{display:flex;gap:6px;align-items:center;font-weight:600}
@media print{.trB{display:none!important}}`;document.head.appendChild(css);
 const redesenha=()=>{try{render()}catch(e){}};
 function transf(cod,de,para){le();const k="v|"+cod,o=TR[k];
  const orig=o?o.de:de;
  if(orig===para){delete TR[k]}else TR[k]={de:orig,para,at:new Date().toISOString(),nw:false,k:cod,n:(Object.values(BASE).flat().find(x=>x.c===cod)||{}).n||""};
  grava();aplica();redesenha()}
 document.addEventListener("click",e=>{const b=e.target.closest("[data-trv],[data-trun]");if(!b)return;e.stopPropagation();
  if(b.dataset.trv){const cod=b.dataset.trv;let de=SOLOK?"Outra carteira":"Eduardo";for(const S of Object.keys(BASE)){const r=BASE[S].find(x=>x.c===cod&&x.k);if(r){de=NM[S];break}}transf(cod,de,b.dataset.para);alert(`Pronto: o cliente foi para a carteira de ${b.dataset.para}.\n\nAgora atualize no ERP (cadastro do cliente, campo vendedor) e marque "Já atualizei no ERP".`)}
  else{le();delete TR["v|"+b.dataset.trun];grava();aplica();redesenha()}},true);
 document.addEventListener("change",e=>{const s=e.target.closest("[data-trm]");if(s&&s.value){transf(s.dataset.trm,s.dataset.de,s.value);return}
  const n=e.target.closest("[data-trnw]");if(n){le();const t=TR["v|"+n.dataset.trnw];if(t){t.nw=true;grava();aplica();redesenha()}}});
 document.addEventListener("click",e=>{if(e.target.closest(".trB"))e.stopPropagation()},true);
 window.addEventListener("storage",ev=>{if(ev.key==="dm_tr"){aplica();redesenha()}});
 if(typeof drawTable==="function"){const _dt=drawTable;drawTable=function(S,st){_dt(S,st);try{const tb=document.getElementById("tbl");const box=tb&&tb.closest(".tscroll");let n=document.getElementById("trNote");
  if(state.fora&&box){if(!n){n=document.createElement("div");n.id="trNote";box.parentNode.insertBefore(n,box)}const nome=NM[S]||S;
   n.innerHTML=`<div class="trB" style="display:block;border-style:solid;border-color:#E5C65A;background:#FFF6D6;margin-bottom:8px"><b>Estes clientes são atendidos por ${SOLOK?"você":nome}, mas no ERP estão em outra carteira (quase sempre a do Eduardo, código 0000002).</b><ol style="margin:4px 0 0;padding-left:20px"><li>Clique no cliente e em <b>"trazer para a carteira de ${nome}"</b>.</li><li>No ERP, troque o representante do cliente para ${nome}.</li><li>Volte e marque <b>"Já atualizei no ERP"</b>.</li></ol>Se o cliente for mesmo uma conta da casa do Eduardo, deixe como está.</div>`}
  else if(n)n.remove()}catch(e){}}}
 redesenha();
})();
