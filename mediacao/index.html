<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mediação Fácil</title>
<meta name="theme-color" content="#1B2A4A">
<meta name="description" content="Mediação Fácil by DayIA: casos, agenda, leis e assistente de IA para mediadoras.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mediação Fácil">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2A4A;--navy2:#24375E;--gold:#C9A24A;--goldd:#9C7A2E;--goldl:#F3E7C8;--cream:#F7F2E8;--card:#FFFFFF;--blue:#8FA3C0;--bluel:#E6ECF5;--text:#1E2433;--muted:#6B7280;--line:#E7E0D2;--ok:#2E7D5B;--okl:#E3F2EA;--bad:#A94442;--badl:#F8E5E4;--warn:#9C6B12;--warnl:#FBF0D9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--cream);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:"Playfair Display",Georgia,serif;font-weight:600}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:var(--text);width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,74,.18)}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:90px}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 22px 22px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .ic{width:36px;height:36px;border-radius:10px;background:rgba(201,162,74,.18);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.brand b{font-family:"Playfair Display",serif;font-size:19px;font-weight:600;letter-spacing:.2px}
.topbtns{display:flex;gap:8px;align-items:center}
.install{background:var(--gold);color:var(--navy);font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px;display:flex;align-items:center;gap:6px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--navy2);border:1.5px solid var(--gold);color:var(--gold);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.greet{margin-top:18px}
.greet h1{font-size:24px;color:#fff}
.greet p{color:var(--blue);font-size:14px;margin-top:2px}
main{padding:18px}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.sec-title h2{font-size:18px;color:var(--navy)}
.sec-title a,.link{color:var(--goldd);font-size:13px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat small{color:var(--muted);font-size:12px}
.stat b{display:block;font-size:26px;color:var(--navy);font-family:"Playfair Display",serif;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.item .when{min-width:58px;text-align:center;background:var(--bluel);border-radius:10px;padding:6px 4px;color:var(--navy)}
.item .when b{display:block;font-size:16px}
.item .when small{font-size:11px;color:var(--muted)}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:15px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .info small{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bluel);color:var(--navy2)}
.tag.ok{background:var(--okl);color:var(--ok)}.tag.bad{background:var(--badl);color:var(--bad)}.tag.warn{background:var(--warnl);color:var(--warn)}.tag.gold{background:var(--goldl);color:var(--goldd)}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px;border-radius:999px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:11px;font-weight:600;font-size:14px}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.navy{background:var(--navy);color:#fff}
.btn.line{border:1px solid var(--line);background:#fff;color:var(--navy)}
.btn.full{width:100%}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.ai-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ai-actions button{background:var(--goldl);color:var(--goldd);border-radius:11px;padding:11px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;justify-content:center;text-align:center}
.tl{border-left:2px solid var(--goldl);margin-left:6px;padding-left:16px;display:flex;flex-direction:column;gap:12px}
.tl div{position:relative;font-size:14px}
.tl div:before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.tl small{display:block;color:var(--muted);font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}
nav .in{display:flex;max-width:760px;width:100%}
nav button{flex:1;padding:9px 2px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
nav button.on{color:var(--navy);font-weight:600}
nav button.on svg{color:var(--gold)}
.back{display:flex;align-items:center;gap:6px;color:var(--goldd);font-weight:600;font-size:14px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}
.kv span{color:var(--muted)}
.ai-out{background:#FBF8F1;border:1px solid var(--goldl);border-radius:12px;padding:14px;font-size:14px;margin-top:12px;white-space:normal}
.ai-out p{margin-bottom:8px}.ai-out ul{margin:0 0 8px 18px}
.law{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.law b{color:var(--navy)}
.law p{font-family:Georgia,serif;font-size:14.5px;margin:6px 0 8px;color:#2a3142}
mark{background:#F6E7B8;padding:0 2px;border-radius:3px}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai p{margin-bottom:6px}.msg.ai ul{margin:0 0 6px 18px}
.msg .acts{display:flex;gap:12px;margin-top:6px}
.msg .acts button{font-size:12px;color:var(--goldd);font-weight:600}
.composer{position:sticky;bottom:70px;background:var(--cream);padding:8px 0;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;max-height:140px;border-radius:14px}
.round{width:46px;height:46px;min-width:46px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.round.navy{background:var(--navy);color:#fff}.round.gold{background:var(--gold);color:var(--navy)}
.round.rec{background:#C0392B;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.45)}50%{box-shadow:0 0 0 10px rgba(192,57,43,0)}}
.suggest{display:flex;flex-direction:column;gap:8px}
.suggest button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-align:left;font-size:14px;color:var(--navy)}
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:#fff;width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
.modal h3{color:var(--navy);font-size:19px;margin-bottom:6px}
.hide{display:none!important}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:26px 0 6px}
.foot b{color:var(--navy)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
/* voz */
.fab-voz{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;cursor:pointer}
.fab-voz .mini{width:58px;height:58px;border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,#BFE3FF 0%,#7CC0FF 30%,#3D97F5 58%,#1E6FE0 82%,#1557C2 100%);box-shadow:0 8px 22px rgba(40,120,240,.40);animation:breathe 5s ease-in-out infinite}
.fab-voz .mini i{position:absolute;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.9) 0%,rgba(255,255,255,.4) 45%,rgba(255,255,255,0) 72%);filter:blur(4px)}
.fab-voz .mini i:nth-child(1){width:52px;height:26px;left:-10px;top:8px;animation:drift1 12s ease-in-out infinite}
.fab-voz .mini i:nth-child(2){width:46px;height:24px;right:-14px;top:30px;animation:drift2 14s ease-in-out infinite}
.fab-voz .mini i:nth-child(3){width:58px;height:58px;left:0;top:0;background:radial-gradient(circle at 38% 28%,rgba(255,255,255,.5),transparent 45%);filter:blur(2px)}
.fab-voz .lbl{display:none;background:#fff;color:var(--navy);font-size:12px;font-weight:600;padding:6px 10px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.app{padding-bottom:160px}
body.r-inicio .fab-voz .lbl{display:block}
body.r-assistente .fab-voz{display:none}
.voice{position:fixed;inset:0;z-index:60;background:#FFFFFF;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 20px 34px}
.voice .vtop{width:100%;display:flex;justify-content:space-between;align-items:center;max-width:560px}
.voice .vtop b{font-family:"Playfair Display",serif;font-size:17px;color:var(--navy)}
.voice .x{width:40px;height:40px;border-radius:50%;background:#F1F4F8;color:var(--navy);display:flex;align-items:center;justify-content:center}
.orb-wrap{display:flex;flex-direction:column;align-items:center;gap:28px}
.orb{width:240px;height:240px;border-radius:50%;position:relative;overflow:hidden;cursor:pointer;background:radial-gradient(circle at 50% 35%,#BFE3FF 0%,#7CC0FF 30%,#3D97F5 58%,#1E6FE0 82%,#1557C2 100%);box-shadow:0 18px 50px rgba(40,120,240,.30);animation:breathe 5s ease-in-out infinite;transition:transform .2s ease}
.orb .sw{position:absolute;inset:-25%;background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.35) 60deg,rgba(255,255,255,0) 140deg,rgba(255,255,255,.28) 220deg,rgba(255,255,255,0) 300deg);filter:blur(22px);animation:swirl 14s linear infinite}
.orb .cl{position:absolute;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.95) 0%,rgba(255,255,255,.55) 40%,rgba(255,255,255,0) 72%);filter:blur(10px)}
.orb .c1{width:190px;height:95px;left:-40px;top:30px;opacity:.8;animation:drift1 12s ease-in-out infinite}
.orb .c2{width:170px;height:85px;right:-55px;top:105px;opacity:.85;animation:drift2 14s ease-in-out infinite}
.orb .c3{width:160px;height:80px;left:10px;bottom:-25px;opacity:.6;animation:drift3 10s ease-in-out infinite}
.orb .c4{width:120px;height:60px;right:0;top:5px;opacity:.7;animation:drift1 17s ease-in-out infinite reverse}
.orb .c6{width:140px;height:70px;left:60px;top:95px;opacity:.55;animation:drift2 19s ease-in-out infinite reverse}
.orb .c5{width:240px;height:240px;left:0;top:0;background:radial-gradient(circle at 38% 28%,rgba(255,255,255,.45),transparent 45%);filter:blur(4px);opacity:1;animation:none}
@keyframes swirl{to{transform:rotate(360deg)}}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,15px) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,-20px) scale(.9)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.orb.listening{animation:breathe 1.3s ease-in-out infinite}
.orb.listening .cl{animation-duration:4s}
.orb.thinking .cl{animation-duration:2.5s}
.orb.thinking{animation:breathe 2.2s ease-in-out infinite}
.orb.speaking{animation:none}
.orb.speaking .cl{animation-duration:5s}
.orb.speaking .sw,.orb.listening .sw{animation-duration:6s}
.orb.thinking .sw{animation-duration:2.5s}
.vstatus{font-size:15px;color:var(--muted);min-height:22px;text-align:center}
.vtext{max-width:520px;text-align:center;font-size:15.5px;color:var(--navy);min-height:44px;max-height:28vh;overflow:auto;line-height:1.55}
.vbtns{display:flex;gap:14px;align-items:center}
.vbig{width:74px;height:74px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(27,42,74,.25)}
.vbig.rec{background:#E74C3C;color:#fff}
.vsmall{width:52px;height:52px;border-radius:50%;background:#F1F4F8;display:flex;align-items:center;justify-content:center;color:var(--navy)}
.vtype{display:flex;gap:8px;width:100%;max-width:520px}
/* abertura padrão DayIA */
#intro{position:fixed;inset:0;z-index:100;background:#0E2238;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
#intro.fim{opacity:0;pointer-events:none}
#intro .quadro{width:76px;height:76px;background:#fff;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:cresce 1.4s cubic-bezier(.2,.8,.2,1) forwards}
#intro .quadro img{width:100%;height:100%;display:block;border-radius:10px}
#intro .by{position:absolute;display:flex;align-items:center;gap:10px;font-size:22px;color:#CFE2F2;opacity:0;transition:opacity .45s ease}
#intro .by img{height:40px;width:auto;display:block}
#intro.passo2 .quadro{opacity:0;transition:opacity .3s}
#intro.passo2 .by{opacity:1}
@keyframes cresce{0%{transform:scale(.6) rotate(0);opacity:0}20%{opacity:1}55%{transform:scale(1.6) rotate(0)}100%{transform:scale(1.6) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#intro{display:none}}
.foot{display:flex;align-items:center;justify-content:center;gap:6px}
.foot img{height:16px;width:auto;border-radius:3px;background:#0E2238;padding:2px 5px}
.hits h4{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
</style>
</head>

function md(t){
  const lines=esc(t).split(/\n/);let h='',inList=false;
  for(let l of lines){
    l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s*(.+)$/,'<b>$1</b>');
    const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/);
    if(m){if(!inList){h+='<ul>';inList=true}h+='<li>'+m[1]+'</li>';continue}
    if(inList){h+='</ul>';inList=false}
    if(l.trim())h+='<p>'+l+'</p>';
  }
  if(inList)h+='</ul>';return h;
}

(function(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  let rec=null,cbP=()=>{},cbF=()=>{},cbS=()=>{};
  DICT={
    onPartial(f){cbP=f},onFinal(f){cbF=f},onState(f){cbS=f},
    start(){return new Promise((res,rej)=>{
      try{rec&&rec.abort()}catch(e){}
      rec=new SR();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=true;

  tx(mode,fn){return new Promise((res,rej)=>{if(!this.db)return rej('nodb');const t=this.db.transaction('docs',mode);const st=t.objectStore('docs');const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  put(k,v){return this.tx('readwrite',s=>s.put(v,k))},get(k){return this.tx('readonly',s=>s.get(k))},del(k){return this.tx('readwrite',s=>s.delete(k))}};
IDB.open().then(async()=>{for(const d of DB.docs){try{const v=await IDB.get(d.id);if(v)TXT[d.id]=v}catch(e){}}}).catch(()=>{}).finally(()=>setTimeout(atualizarLeis,1500));
/* Leis completas: o serviço da DayIA busca o texto oficial no site do Planalto e o app guarda aqui dentro */
function juntarLinhas(t){return t.split('\n').reduce((a,l)=>{if(a.length&&!/[.:;!?)\]]$/.test(a[a.length-1])&&/^[a-zà-ú(0-9,]/.test(l)&&!/^(Art\.|§|[IVXLC]+ ?[-–]|[a-z]\))/.test(l))a[a.length-1]+=' '+l;else a.push(l);return a},[]).join('\n')}
function docDaLei(id){return DB.docs.find(x=>x.lei===id)}
const baixando={};
async function baixarLei(id){
  if(baixando[id])return baixando[id];
  const l=LEIS.find(x=>x.id===id);if(!l||!IA_URL)return null;
  baixando[id]=(async()=>{
    const r=await fetch(IA_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tipo:'lei',id,url:l.url})});
    const d=await r.json();if(!d.texto)throw new Error(d.erro||'Não consegui baixar a lei.');
    const t=juntarLinhas(d.texto);const pages=[];for(let i=0;i<t.length;i+=3000)pages.push({p:Math.floor(i/3000)+1,t:t.slice(i,i+3000)});
    const velho=docDaLei(id);const docId=velho?velho.id:'lei-'+id;
    TXT[docId]=pages;try{await IDB.put(docId,pages)}catch(e){}
    if(velho){velho.paginas=pages.length;velho.data=iso(new Date());velho.atualizado=iso(new Date())}
    else DB.docs.unshift({id:docId,nome:l.num+' - '+l.nome,paginas:pages.length,data:iso(new Date()),lei:id,oficial:true,atualizado:iso(new Date())});
    save();return docDaLei(id);
  })().finally(()=>{delete baixando[id]});
  return baixando[id];
}
async function atualizarLeis(){
  if(!IA_URL||!navigator.onLine)return;
  for(const l of LEIS){const d=docDaLei(l.id);
    const precisa=!d||!TXT[d.id]||diasDesde(d.atualizado||'2000-01-01')>30;
    if(precisa){try{await baixarLei(l.id);if(route==='leis'||route==='biblioteca')render()}catch(e){}}}
}
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const STOP=new Set('para como qual quais quando onde sobre entre pela pelo pelas pelos esse essa isso este esta isto aquele aquela minha meus minhas seus suas dela dele tem tenho pode posso deve devo fazer feito sendo seria ser estar mais menos muito muita porque pois ainda tambem caso casos voce existe'.split(' '));
const CHK={};
function chunksOf(id){const pages=TXT[id]||[];if(CHK[id]&&CHK[id].src===pages)return CHK[id].l;const out=[];pages.forEach(pg=>{const t=pg.t;for(let i=0;i<t.length;i+=1100){const tt=t.slice(Math.max(0,i-150),i+1100);out.push({p:pg.p,t:tt,n:norm(tt)})}});CHK[id]={src:pages,l:out};return out}
/* Leis de outras áreas só entram quando a pergunta fala delas, para não confundir a IA */
const AREA_FORA={cp:/penal|crime|criminal|delito|pena\b/,cpp:/penal|crime|criminal|inquerito|delegad/,ctb:/transito|veiculo|carro|multa|acidente/,ctn:/tribut|imposto|itcmd|itbi|iptu|fiscal/,clt:/trabalh|clt|emprego|salario|patrao/,lgpd:/dados|lgpd|privacidade/};
function buscaDocs(q,max=5){
  const nq=norm(q);const ws=[...new Set(nq.split(/[^a-z0-9]+/).filter(w=>w.length>3&&!STOP.has(w)))];
  if(!ws.length)return [];
  const precisa=Math.min(2,ws.length);const hits=[];
  DB.docs.forEach(d=>{if(d.lei&&AREA_FORA[d.lei]&&!AREA_FORA[d.lei].test(nq))return;
    chunksOf(d.id).forEach(c=>{let s=0,dif=0;ws.forEach(w=>{const k=c.n.split(w).length-1;if(k){dif++;s+=1+Math.min(k,4)*.3}});if(dif>=precisa)hits.push({doc:d.nome,p:c.p,t:c.t,s:s+(d.lei?0:1.5)})})});
  return hits.sort((a,b)=>b.s-a.s).slice(0,max);
}
function docCtx(q){
  if(!DB.docs.length)return {txt:DB.soDocs?'A mediadora ainda não enviou nenhum documento para a biblioteca. Diga isso a ela e não responda com conhecimento de fora.':'',fontes:[]};
  const hs=buscaDocs(q);
  const fontes=[...new Set(hs.map(x=>x.doc+(x.p?', p. '+x.p:'')))];
  const tre=hs.map(x=>'['+x.doc+(x.p?', p. '+x.p:'')+']\n'+x.t.replace(/\s+/g,' ').trim()).join('\n\n');
  if(DB.soDocs)return {fontes,txt:'MODO SÓ OS MEUS DOCUMENTOS: responda SOMENTE com base nos trechos abaixo, tirados dos documentos que a mediadora enviou. Cite a fonte assim: (nome do documento, p. X). Se a resposta não estiver nos trechos, diga claramente: "Não encontrei isso nos seus documentos." e não use conhecimento de fora.\n\nTRECHOS:\n'+(tre||'(nenhum trecho encontrado)')};
  return {fontes,txt:tre?'TRECHOS DOS DOCUMENTOS DA MEDIADORA (use primeiro e cite a fonte assim: (nome do documento, p. X)):\n'+tre:''};
}
async function lerArquivo(f,onProg){
  const nome=f.name.replace(/\.(pdf|txt)$/i,'');
  if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
    if(!window.pdfjsLib)throw new Error('Não consegui abrir o leitor de PDF. Confira a internet e tente de novo.');
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;const pages=[];
    for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();pages.push({p:i,t:tc.items.map(s=>s.str).join(' ').replace(/\s+/g,' ').trim()});onProg&&onProg(i,pdf.numPages)}
    if(!pages.some(p=>p.t.length>20))throw new Error('Esse PDF parece ser uma foto ou digitalização, sem texto para ler. Envie um PDF com texto (como os do site do Planalto).');
    return {nome,pages};
  }
  const t=await f.text();const pages=[];for(let i=0;i<t.length;i+=3000)pages.push({p:Math.floor(i/3000)+1,t:t.slice(i,i+3000)});
  if(!t.trim())throw new Error('O arquivo está vazio.');
  return {nome,pages};
}
async function ask(input,onText,opts={}){
  if(!AI)throw {code:'off'};
  const r=await AI(input,Object.assign({onText:onText?({text})=>onText(text):undefined,cache:false},opts));
  return r.text;
}
function aiErr(e){
  if(e&&e.code==='off')return 'A IA ainda não foi ligada neste app. Fale com a DayIA.';
  if(e&&e.code==='rede')return 'Sem internet agora. Confira a conexão e tente de novo.';
  if(e&&e.code==='limite')return 'A IA chegou ao limite de hoje. Amanhã ela volta.';
  if(e&&e.code==='rate_limited')return 'Muitos pedidos seguidos. Espere um pouquinho e tente de novo.';
  if(e&&e.code==='not_granted')return 'A IA não foi autorizada neste aparelho.';
  return 'Não consegui responder agora. Tente de novo.';
}

  return html;
}

}

function lerArquivoContatos(f){
  f.text().then(t=>{let lista=[];
    if(/BEGIN:VCARD/i.test(t)){t.split(/BEGIN:VCARD/i).slice(1).forEach(b=>{const g=re=>{const m=b.match(re);return m?m[1].trim():''};lista.push({nome:g(/\nFN[^:]*:(.+)/i)||g(/\nN[^:]*:(.+)/i).replace(/;+/g,' ').trim(),tel:g(/\nTEL[^:]*:(.+)/i),email:g(/\nEMAIL[^:]*:(.+)/i)})})}
    else{const ls=t.split(/\r?\n/).filter(Boolean);const sep=ls[0].includes(';')?';':',';const cab=ls[0].split(sep).map(x=>norm(x.replace(/"/g,'')));
      const iN=cab.findIndex(x=>/nome|name/.test(x)),iT=cab.findIndex(x=>/tel|fone|phone|celular|whats/.test(x)),iE=cab.findIndex(x=>/mail/.test(x));
      ls.slice(1).forEach(l=>{const c=l.split(sep).map(x=>x.replace(/"/g,'').trim());lista.push({nome:c[iN>=0?iN:0]||'',tel:iT>=0?c[iT]:'',email:iE>=0?c[iE]:''})})}
    const n=juntarContatos(lista);render();const m2=document.getElementById('contMsg');if(m2)m2.textContent=n+' contato(s) importado(s).';
  }).catch(()=>{const m2=document.getElementById('contMsg');if(m2)m2.textContent='Não consegui ler esse arquivo.'})
}

let fFin={q:'',ver:'Todos'};
function resumoFin(){const hoje=iso(new Date()),mes=hoje.slice(0,7),ano=hoje.slice(0,4);let rm=0,ar=0,ra=0;
  DB.receb.forEach(r=>{const v=Number(r.valor)||0;if(r.pago){if((r.pagoEm||r.data).slice(0,7)===mes)rm+=v;if((r.pagoEm||r.data).slice(0,4)===ano)ra+=v}else ar+=v});return {rm,ar,ra}}

  const q=norm(fFin.q.trim());const s=resumoFin();
  const l=DB.receb.filter(r=>(fFin.ver==='Todos'||(fFin.ver==='Pagos'?r.pago:!r.pago))&&(!q||norm([r.desc,(caso(r.casoId)||{}).titulo,fmtBR(r.data),String(r.valor)].join(' ')).includes(q))).sort((a,b)=>b.data.localeCompare(a.data));

  <div class="list">${l.map(r=>`<div class="item"><div class="info"><b>${brl(r.valor)} · ${esc(r.desc||'Mediação')}</b><small>${esc((caso(r.casoId)||{}).titulo||'Sem caso')} · ${fmtBR(r.data)}${r.pago&&r.pagoEm?' · pago em '+fmtBR(r.pagoEm):''}</small></div>
  <button class="tag ${r.pago?'ok':'warn'}" data-pago="${r.id}" style="cursor:pointer">${r.pago?'Pago':'A receber'}</button><button class="round" style="width:34px;height:34px;min-width:34px;color:var(--muted)" data-editreceb="${r.id}" aria-label="Editar">${IC.edit}</button></div>`).join('')||'<div class="card">Nenhum recebimento ainda.</div>'}</div>`;
}

/* ---------- modais ---------- */
function modal(html){
  const r=document.getElementById('modalRoot');
  r.innerHTML=`<div class="modal-bg" id="mbg"><div class="modal">${html}</div></div>`;
  r.querySelector('#mbg').addEventListener('click',e=>{if(e.target.id==='mbg'||e.target.closest('[data-close]'))closeModal()});
  return r.querySelector('.modal');
}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function toast(t){const m=modal(`<h3>${esc(t)}</h3><button class="btn navy full" data-close style="margin-top:14px">Ok</button>`)}

function copyText(t,btn){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent='Copiado';setTimeout(()=>btn.textContent=o,1500)}};
  try{navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done))}catch(e){fallbackCopy(t,done)}
}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()}

/* ---------- voz ---------- */
let speaking=false;
let AUDIO=null,vozEleven=true;
async function falarEleven(clean){
  if(!IA_URL||!vozEleven)return false;
  try{
    const r=await fetch(IA_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tipo:'voz',texto:clean.slice(0,1500)})});
    const d=await r.json();
    if(d.codigo==='semvoz'){vozEleven=false;return false}
    if(!d.audio)return false;
    return 'data:audio/mpeg;base64,'+d.audio;
  }catch(e){return false}
}
function speak(text,onEnd){
  const clean=text.replace(/\*\*/g,'').replace(/^[-•]\s*/gm,'').slice(0,1990);
  if(IA_URL&&vozEleven){
    speaking=true;const meu=Symbol();speak.atual=meu;
    /* Fala em partes: a primeira frase sai logo, o resto é preparado enquanto ela fala */
    const frases=clean.match(/[^.!?…]+[.!?…]+["”)]?\s*|[^.!?…]+$/g)||[clean];
    let p1='',i=0;while(i<frases.length&&(p1.length<40||i===0)){p1+=frases[i];i++}
    const partes=[p1.trim(),frases.slice(i).join('').trim()].filter(Boolean);
    const audios=partes.map(t=>falarEleven(t));
    let tocou=false;
    const tocar=async n=>{
      if(speak.atual!==meu)return;
      if(n>=partes.length){speak.atual=null;speaking=false;onEnd&&onEnd();return}
      const src=await audios[n];if(speak.atual!==meu)return;
      if(!src){if(!tocou){speak.atual=null;speaking=false;falarLocal(clean,onEnd)}else{speak.atual=null;speaking=false;falarLocal(partes.slice(n).join(' '),onEnd)}return}
      try{AUDIO&&AUDIO.pause()}catch(e){}
      AUDIO=new Audio(src);
      AUDIO.onended=()=>tocar(n+1);AUDIO.onerror=()=>tocar(n+1);
      AUDIO.onplaying=()=>{if(speak.atual===meu&&!tocou&&speak.onPlay){tocou=true;speak.onPlay()}tocou=true};
      AUDIO.play().catch(()=>{if(speak.atual!==meu)return;speak.atual=null;speaking=false;falarLocal(partes.slice(n).join(' '),onEnd)});
    };
    tocar(0);
    return;
  }
  falarLocal(clean,onEnd);
}
function falarLocal(clean,onEnd){
  if(TTS){
    speaking=true;
    return TTS.speak(clean,{language:'pt-BR',voice:'airy'}).catch(()=>{}).finally(()=>{speaking=false;onEnd&&onEnd()});
  }
  if(window.speechSynthesis){
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean);u.lang='pt-BR';if(VOZ)u.voice=VOZ;u.rate=1.05;u.onend=()=>{speaking=false;onEnd&&onEnd()};u.onerror=u.onend;speaking=true;speechSynthesis.speak(u);return}catch(e){}
  }
  onEnd&&onEnd();
}
function stopSpeak(){speak.atual=null;try{AUDIO&&AUDIO.pause()}catch(e){}try{TTS&&TTS.stop()}catch(e){}try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}speaking=false}

let V={hist:[],heard:'',partial:'',listening:false,starting:false,cb:null,open:false,auto:true,timer:null,barge:false,falaAtual:'',iv:null};
/* Interromper falando: separa a voz dela do eco da própria IA saindo do alto-falante */
const normV=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>1);
function falaDela(txt){
  const w=normV(txt);if(!w.length)return false;
  if(/^(espera|pera|perai|chega|calma|stop|ana|elena|escuta|um minuto|so um)/.test(w.join(' ')))return true;
  const ia=new Set(normV(V.falaAtual));const fora=w.filter(x=>!ia.has(x)).length;
  return w.length>=2&&fora>=2&&fora/w.length>=.5;
}
try{const vh=JSON.parse(sessionStorage.getItem('mf-voz')||'null');if(vh&&Array.isArray(vh.hist))V.hist=vh.hist}catch(e){}
function guardarVoz(){try{sessionStorage.setItem('mf-voz',JSON.stringify({hist:V.hist.slice(-20),aberta:V.open}))}catch(e){}}
/* Tela sempre acesa durante a conversa por voz */
let TRAVA=null;
async function manterTelaAcesa(){try{if('wakeLock' in navigator&&!TRAVA){TRAVA=await navigator.wakeLock.request('screen');TRAVA.addEventListener('release',()=>{TRAVA=null})}}catch(e){}}
function liberarTela(){try{TRAVA&&TRAVA.release()}catch(e){}TRAVA=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&V.open)manterTelaAcesa()});
function openVoice(){
  const r=document.getElementById('voiceRoot');V.open=true;manterTelaAcesa();guardarVoz();
  try{if(IA_URL)fetch(IA_URL,{mode:'no-cors'}).catch(()=>{})}catch(e){}
  r.innerHTML=`<div class="voice"><div class="vtop"><b>Conversa por voz</b><button class="x" id="vClose" aria-label="Fechar">${IC.x}</button></div>
  <div class="orb-wrap"><div class="orb" id="orb" role="button" aria-label="Falar"><div class="sw"></div><div class="cl c1"></div><div class="cl c2"></div><div class="cl c3"></div><div class="cl c4"></div><div class="cl c6"></div><div class="cl c5"></div></div><div class="vstatus" id="vStatus">${DICT?'Toque na bola e comece a falar':'Escreva sua pergunta abaixo'}</div><div class="vtext" id="vText"></div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px;width:100%">
  ${DICT?`<button class="chip ${V.auto?'on':''}" id="vAuto">${V.auto?'✓ ':''}Conversa contínua</button>
  <div class="vbtns"><button class="vsmall" id="vKb" aria-label="Digitar">${IC.send}</button><button class="vbig" id="vMic" aria-label="Falar">${IC.mic}</button><button class="vsmall" id="vStop" aria-label="Parar">${IC.stop}</button></div>`:''}
  <div class="vtype ${DICT?'hide':''}" id="vType"><input id="vIn" placeholder="Sua dúvida..."><button class="round gold" id="vSend" aria-label="Enviar">${IC.send}</button></div>
  ${!DICT?'<p style="font-size:12px;color:var(--muted);text-align:center;max-width:320px">Este navegador não tem microfone para o app. Abra no Chrome para conversar falando.</p>':''}</div></div>`;
  const orb=r.querySelector('#orb'),st=r.querySelector('#vStatus'),vt=r.querySelector('#vText');
  const setOrb=s=>{orb.className='orb '+s};
  const mic=r.querySelector('#vMic');
  const idleMsg=()=>{setOrb('');st.textContent=DICT?'Toque na bola para falar':'Escreva outra pergunta'};
  function listen(){
    if(!DICT||V.listening||V.starting||!V.open)return;
    stopSpeak();orb.style.transform='';V.heard='';V.partial='';vt.textContent='';V.starting=true;
    DICT.start().then(()=>{V.starting=false}).catch(e=>{V.starting=false;idleMsg();if(e&&e.code==='not_granted'){st.textContent='Microfone não autorizado. Use o teclado.';r.querySelector('#vType').classList.remove('hide')}});
  }
  /* Enquanto ela fala: mede o volume do microfone (com cancelamento de eco do celular).
     Se a Dra. falar por cima, a IA para e o app passa a ouvir. */
  async function escutarInterrupcao(){
    if(!V.open||!speaking||V.listening||V.starting||V.vad)return;
    let stream,ctx;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}});}catch(e){return}
    if(!speaking||!V.open){stream.getTracks().forEach(t=>t.stop());return}
    ctx=new (window.AudioContext||window.webkitAudioContext)();const src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=1024;src.connect(an);
    const buf=new Float32Array(an.fftSize);let base=0,n=0,alto=0;const t0=Date.now();
    const fim=()=>{clearInterval(V.vad);V.vad=null;try{stream.getTracks().forEach(t=>t.stop())}catch(e){}try{ctx.close()}catch(e){}};
    V.vadFim=fim;
    V.vad=setInterval(()=>{
      if(!speaking||!V.open){fim();return}
      an.getFloatTimeDomainData(buf);let s=0;for(const x of buf)s+=x*x;const rms=Math.sqrt(s/buf.length);
      if(Date.now()-t0<600){base+=rms;n++;return}
      const lim=Math.max(.025,(base/Math.max(n,1))*2.8);
      alto=rms>lim?alto+1:Math.max(0,alto-1);
      if(alto>=4){fim();interrompeu('')}
    },60);
  }
  function interrompeu(){
    V.barge=false;if(V.vadFim)V.vadFim();stopSpeak();clearInterval(V.iv);orb.style.transform='';
    setTimeout(listen,150);
  }
  function armSilence(){clearTimeout(V.timer);V.timer=setTimeout(()=>{if(V.listening&&(V.heard+V.partial).trim())DICT.stop().catch(()=>{})},1100)}
  const close=()=>{V.open=false;if(V.vadFim)V.vadFim();liberarTela();try{sessionStorage.removeItem('mf-voz')}catch(e){}clearTimeout(V.timer);try{DICT&&V.listening&&DICT.stop().catch(()=>{})}catch(e){}V.listening=false;V.cb=null;stopSpeak();r.innerHTML=''};
  r.querySelector('#vClose').onclick=close;
  const ans=async q=>{
    q=(q||'').trim();
    if(!q){idleMsg();return}
    vt.textContent='“'+q+'”';
    if(!AI){st.textContent=aiErr({code:'off'});setOrb('');return}
    setOrb('thinking');st.textContent='Pensando...';
    V.hist.push({role:'user',content:q});
    const h=V.hist.slice(-14).map(m=>({...m}));
    if(h[0].role!=='user')h.shift();
    const pre=base('Agora é uma conversa falada. Responda em 2 a 4 frases curtas, em texto corrido, sem listas, símbolos, títulos ou asteriscos, porque a resposta será lida em voz alta. Tom natural de colega para colega, sem cumprimentos e sem frases de abertura: comece já respondendo. Ao citar lei, fale só o artigo e o nome da lei, sem número de página. Pode fazer uma pergunta curta de volta quando ajudar a entender o caso.');
    const dc=docCtx(q);
    h[0]={role:'user',content:pre+'\n\n'+(h.length===1&&dc.txt?dc.txt+'\n\n':'')+'FALA DELA: '+h[0].content};
    if(h.length>1&&dc.txt)h[h.length-1]={role:'user',content:dc.txt+'\n\nFALA DELA: '+q};
    try{
      const t=await ask(h,x=>{vt.textContent=x});
      if(!V.open)return;
      V.hist.push({role:'assistant',content:t});guardarVoz();vt.textContent=t;
      setOrb('speaking');st.textContent=DICT?(V.auto?'Falando... pode me interromper falando ou tocando na bola':'Falando... toque na bola para interromper'):'Falando...';
      clearInterval(V.iv);V.iv=setInterval(()=>{orb.style.transform='scale('+(1+Math.random()*.08)+')'},140);
      V.falaAtual=t;
      speak(t,()=>{clearInterval(V.iv);orb.style.transform='';if(!V.open)return;
        if(V.vadFim)V.vadFim();
        if(DICT&&V.auto){st.textContent='Pode falar...';setTimeout(listen,350)}else idleMsg()});
      speak.onPlay=(DICT&&V.auto)?()=>setTimeout(escutarInterrupcao,250):null;
    }catch(e){setOrb('');st.textContent=aiErr(e)}
  };
  const send=r.querySelector('#vSend'),inp=r.querySelector('#vIn');
  send.onclick=()=>{const q=inp.value;inp.value='';ans(q)};
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send.onclick()}};
  if(DICT){
    hookDictGlobal();
    V.cb={
      partial:({text})=>{if(V.listening){V.partial=text;vt.textContent=(V.heard+' '+text).trim();armSilence()}},
      final:({text})=>{if(V.listening){V.heard=(V.heard+' '+text).trim();V.partial='';vt.textContent=V.heard;armSilence()}},
      state:({state})=>{
        if(!V.open)return;
        if(state==='listening'){V.listening=true;mic.classList.add('rec');mic.innerHTML=IC.stop;setOrb('listening');st.textContent='Ouvindo...'}
        else if(state==='idle'&&V.listening){V.listening=false;clearTimeout(V.timer);mic.classList.remove('rec');mic.innerHTML=IC.mic;const q=(V.heard+' '+V.partial).trim();V.heard='';V.partial='';
          if(q)ans(q);else if(V.auto&&V.open&&!speaking){st.textContent='Pode falar...';setTimeout(listen,300)}else idleMsg()}
      }
    };

let dictTarget=null;
function bindDictTo(btn,field){
  btn.onclick=()=>{
    if(dictTarget){DICT.stop().catch(()=>{});return}
    dictTarget={btn,field,base:field.value};
    DICT.start().catch(()=>{dictTarget=null});
  };
}
function hookDictGlobal(){
  if(!DICT||hookDictGlobal.done)return;hookDictGlobal.done=true;
  DICT.onPartial(x=>{if(V.cb)V.cb.partial(x);else if(dictTarget)dictTarget.field.value=(dictTarget.base+' '+x.text).trim()});
  DICT.onFinal(x=>{if(V.cb)V.cb.final(x);else if(dictTarget){dictTarget.base=(dictTarget.base+' '+x.text).trim();dictTarget.field.value=dictTarget.base}});
  DICT.onState(x=>{if(V.cb){V.cb.state(x);return}if(!dictTarget)return;if(x.state==='listening'){dictTarget.btn.classList.add('rec')}else if(x.state==='idle'){dictTarget.btn.classList.remove('rec');dictTarget=null}});
}

async function acrescentarLei(){
  const inp=document.getElementById('novaLei'),msg=document.getElementById('nlMsg');const v=inp.value.trim();msg.style.color='';
  if(!IA_URL){msg.textContent=aiErr({code:'off'});return}
  let cands=[],num='',ano='';
  if(/^https:\/\/(www\.)?(planalto\.gov\.br|atos\.cnj\.jus\.br)\//i.test(v))cands=[v];
  else{const m=v.replace(/\s/g,'').match(/^(\d[\d.]*)\/?(\d{4})?$/);if(!m){msg.style.color='var(--bad)';msg.textContent='Digite o número e o ano, como 13.465/2017, ou cole o link do Planalto.';return}
    num=m[1].replace(/\./g,'');ano=m[2]||'';const a=+ano;const base='https://www.planalto.gov.br/ccivil_03/';
    const faixa=a>=2023?'2023-2026':a>=2019?'2019-2022':a>=2015?'2015-2018':a>=2011?'2011-2014':a>=2007?'2007-2010':a>=2004?'2004-2006':'';
    if(faixa)cands.push(base+'_ato'+faixa+'/'+ano+'/lei/l'+num+'.htm',base+'_ato'+faixa+'/'+ano+'/lei/L'+num+'.htm');
    if(a>=2000&&a<=2003)cands.push(base+'leis/'+ano+'/l'+num+'.htm',base+'leis/'+ano+'/L'+num+'.htm');
    cands.push(base+'leis/l'+num+'compilado.htm',base+'leis/l'+num+'compilada.htm',base+'leis/l'+num+'.htm',base+'leis/L'+num+'.htm')}
  msg.innerHTML='<span class="spin"></span> Procurando no site do Planalto...';
  for(const url of cands){
    try{const r=await fetch(IA_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tipo:'lei',id:'extra',url})});const d=await r.json();
      if(d.texto&&d.texto.length>500){
        const tit=(d.texto.match(/(LEI|DECRETO|RESOLUÇÃO)[^\n]{0,90}/i)||[v])[0].trim();
        const id='x'+(num||Date.now());const l={id,chave:[num||id],nome:tit,num:num?('Lei '+v):tit,area:'Acrescentada',url,arts:[]};
        DB.leisExtra=(DB.leisExtra||[]).filter(x=>x.id!==id);DB.leisExtra.push(l);if(!LEIS.find(x=>x.id===id))LEIS.push(l);save();
        await baixarLei(id);msg.textContent='Pronto! '+tit+' agora está no app.';inp.value='';setTimeout(render,1200);return}
    }catch(e){}
  }
  msg.style.color='var(--bad)';msg.textContent='Não achei essa lei no site do Planalto. Confira o número e o ano, ou cole o link da página da lei.';
}
async function enviarArquivos(files){
  const msg=document.getElementById('upMsg');const say=(t,bad)=>{const m=document.getElementById('upMsg');if(m){m.textContent=t;m.style.color=bad?'var(--bad)':''}};
  let ok=0;
  for(const f of files){
    try{
      say('Lendo '+f.name+'...');
      const r=await lerArquivo(f,(i,n)=>say('Lendo '+f.name+': página '+i+' de '+n));
      const id='d'+Date.now()+Math.floor(Math.random()*999);
      TXT[id]=r.pages;try{await IDB.put(id,r.pages)}catch(e){}
      DB.docs.push({id,nome:r.nome,paginas:r.pages.length,data:iso(new Date())});save();ok++;
    }catch(e){say(f.name+': '+(e.message||'não consegui ler esse arquivo.'),true);await new Promise(r=>setTimeout(r,2500))}
  }
  render();if(ok)say(ok+' documento(s) adicionados. A IA já usa nas respostas.');
}
function corrigir(i){
  const a=DB.chat[i];if(!a)return;let qq='';for(let j=i-1;j>=0;j--){if(DB.chat[j].role==='user'){qq=DB.chat[j].content;break}}
  const m=modal(`<h3>Corrigir a IA</h3><p class="note">Escreva qual é a resposta certa. A IA vai seguir essa correção sempre que o assunto aparecer.</p>${qq?`<label>Pergunta</label><div class="card" style="font-size:14px">${esc(qq.slice(0,300))}</div>`:''}<label>Resposta certa</label><textarea id="corrIn"></textarea><div class="row" style="margin-top:14px"><button class="btn line" data-close>Cancelar</button><button class="btn navy" id="corrOk" style="flex:1">Salvar correção</button></div>`);
  m.querySelector('#corrOk').onclick=()=>{const t=m.querySelector('#corrIn').value.trim();if(!t){const x=m.querySelector('#corrIn');x.style.borderColor='var(--bad)';x.placeholder='Escreva a resposta certa primeiro';x.focus();return}
    DB.regras.push({id:'r'+Date.now(),texto:(qq?'Sobre a pergunta "'+qq.slice(0,200)+'": ':'')+t,data:iso(new Date())});save();closeModal();toast('Correção salva. A IA vai usar daqui pra frente.')};
}
async function explica(btn){
  const [lid,n]=btn.dataset.explica.split('|');const law=LEIS.find(x=>x.id===lid);const art=law.arts.find(x=>x.n===n);
  const box=btn.closest('.law').querySelector('.exp');
  if(!AI){box.innerHTML=`<div class="ai-out">${aiErr({code:'off'})}</div>`;return}
  box.innerHTML='<div class="ai-out"><span class="spin"></span> Explicando...</div>';const b=box.firstChild;
  try{const t=await ask(base()+'\n\nExplique em palavras simples este artigo, com um exemplo prático do dia a dia de uma mediação. Seja breve (até 6 frases).\n\n'+law.nome+' ('+law.num+'), '+art.n+': '+art.t,x=>{b.innerHTML=md(x)});b.innerHTML=md(t)}
  catch(e){b.textContent=aiErr(e)}
}
function relatorio(){
  const ac=DB.casos.filter(c=>c.status==='Acordo'),sa=DB.casos.filter(c=>c.status==='Sem acordo'),ab=DB.casos.filter(c=>c.status==='Em andamento');
  const tipos={};DB.casos.forEach(c=>tipos[c.tipo]=(tipos[c.tipo]||0)+1);
  const p=DB.perfil;
  const txt=`Relatório de mediações\nMediadora: ${(p.titulo?p.titulo+' ':'')+p.nome}${p.oab?' · '+p.oab:''}\nData: ${fmtBR(iso(new Date()))}\n\nCasos no total: ${DB.casos.length}\nEm andamento: ${ab.length}\nCom acordo: ${ac.length}\nSem acordo: ${sa.length}\nTaxa de acordo: ${ac.length+sa.length?Math.round(ac.length/(ac.length+sa.length)*100):0}%\n\nPor tipo:\n${Object.entries(tipos).map(([k,v])=>'- '+k+': '+v).join('\n')}`;
  const m=modal(`<h3>Relatório do mês</h3><div class="ai-out">${md(txt)}</div><div class="row" style="margin-top:12px"><button class="btn line" data-close>Fechar</button><button class="btn navy" id="rCopy" style="flex:1">Copiar</button></div>`);
  m.querySelector('#rCopy').onclick=e=>copyText(txt,e.target);
}
